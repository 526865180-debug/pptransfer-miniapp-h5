/* ===== app.wxss（全局设计系统） ===== */
/* app.wxss — PPTransfer 小程序设计系统（v3）

<body>
<div id="h5-app">
  <div id="h5-pages"></div>
  <nav id="h5-tabbar"></nav>
</div>

<!-- ===== 页面模板 ===== -->
<template id="tpl-index">
<div class="page">

  
  <div class="corp-banner">
    <div class="corp-identity">
      <div class="corp-avatar">{{companyShort}}</div>
      <span class="corp-name">{{companyName}}</span>
    </div>
    <div class="corp-divider"></div>
    <div class="corp-notice" data-hover-class="press-soft" data-on-tap="goNotifications">
      <div class="notice-bell-wrap">
        <img class="notice-bell" src="/images/bell_gray.png">
        <div data-wx-if="unreadCount > 0" class="notice-badge">{{unreadCount > 99 ? '99+' : unreadCount}}</div>
      </div>
      <span class="notice-label">通知</span>
    </div>
  </div>

  
  <div class="hero">
    <div class="hero-deco a"></div>
    <div class="hero-deco b"></div>

    <div class="hero-label-row">
      <span class="hero-label">总资产折合估值 (USD)</span>
      <img
        class="hero-eye"
        src="/images/{{amountVisible ? 'eye_white' : 'eyeoff_white'}}.png"
        data-on-tap="toggleAmount">
    </div>
    <div class="hero-amount-row" data-hover-class="press" data-on-tap="goWallet">
      <span class="hero-amount blur{{amountVisible ? '' : ' on'}}">{{totalAsset}}</span>
      <div class="hero-growth">↑ {{growth}}</div>
      <div class="hero-arrow">›</div>
    </div>

    <div class="hero-divider"></div>

    <div class="intransit">
      <span class="intransit-label">在途资金 (USD)</span>
      <div class="intransit-tag" data-on-tap="goInTransit">详情 ›</div>
    </div>
    <span class="intransit-amount blur{{amountVisible ? '' : ' on'}}">{{inTransit}}</span>

    <div class="bal-scroll h5-scroll-x"    >
      <div class="bal-chip" data-wx-for="balances" data-wx-key="ccy">
        <div class="bal-chip-head">
          <span class="bal-flag">{{item.flag}}</span>
          <span class="bal-ccy">{{item.ccy}}</span>
        </div>
        <span class="bal-amount blur-s{{amountVisible ? '' : ' on'}}">{{item.amount}}</span>
      </div>
    </div>
  </div>

  
  <div class="quick-row">
    <div class="quick-item" data-wx-for="quickActions" data-wx-key="key"
      data-hover-class="press" data-on-tap="onQuickAction" data-key="{{item.key}}">
      <div class="quick-tile {{item.bg}}">
        <img class="quick-icon" src="/images/{{item.icon}}.png">
      </div>
      <span class="quick-label">{{item.label}}</span>
    </div>
  </div>

  
  <div class="card section">
    <div class="sec-head">
      <div>
        <span class="sec-title">实时汇率走势</span>
        <span class="sec-sub">更新于 {{rateUpdateTime}} · UTC+8</span>
      </div>
      <div class="sec-link" data-hover-class="press" data-on-tap="goExchange">换汇中心 ›</div>
    </div>

    <div class="rate-tabs">
      <div class="rate-tab {{ratePair === item ? 'active' : ''}}"
        data-wx-for="ratePairs" data-wx-key="*this"
        data-on-tap="onRateTab" data-pair="{{item}}">{{item}}</div>
    </div>

    <div class="chart-box">
      <div class="h5-chart-host" id="rate-chart" canvas-id="rate-chart" ec="{{ecRate}}"></div>
    </div>

    <div class="trend-foot">
      <div class="range-seg">
        <div class="range-item {{rateRange === item ? 'active' : ''}}"
          data-wx-for="rateRanges" data-wx-key="*this"
          data-on-tap="onRangeTab" data-range="{{item}}">{{item}}</div>
      </div>
      <div class="trend-caption">
        <span class="trend-val">{{rateNow}}</span>
        <span class="trend-chg {{rateUp ? 'up' : 'down'}}">{{rateChange}}</span>
      </div>
    </div>
  </div>

</div>
</template>
<template id="tpl-rmb-exchange">
<div class="page">

  
  <div class="banner">
    <div class="banner-deco a"></div>
    <div class="banner-deco b"></div>
    <div class="banner-text">
      <span class="banner-title">人民币结汇</span>
      <span class="banner-sub">将外币资金结汇为人民币，最快 30 分钟到账</span>
    </div>
    <div class="record-btn" data-hover-class="press" data-on-tap="onRecords">
      <img class="record-icon" src="/images/doc_white.png">
      <span>结汇记录</span>
    </div>
  </div>

  
  <div class="entry" data-wx-for="entries" data-wx-key="key"
    data-hover-class="press-soft" data-on-tap="onEntry" data-key="{{item.key}}">
    <div class="entry-tile {{item.tile}}">
      <img class="entry-tile-icon" src="/images/{{item.icon}}.png">
    </div>
    <div class="entry-body">
      <div class="entry-title-row">
        <span class="entry-title">{{item.title}}</span>
        <div class="entry-coming" data-wx-if="item.coming">即将上线</div>
      </div>
      <span class="entry-desc">{{item.desc}}</span>
    </div>
    <img class="entry-arrow" src="/images/{{item.arrow}}.png">
  </div>

  
  <div class="card info">
    <div class="info-item" data-wx-for="infoCards" data-wx-key="title">
      <div class="info-icon {{item.bg}}">
        <img class="info-icon-img" src="/images/{{item.icon}}.png">
      </div>
      <div class="info-body">
        <span class="info-title">{{item.title}}</span>
        <span class="info-desc">{{item.desc}}</span>
      </div>
    </div>
  </div>

  <div class="page-footer-space"></div>
</div>
</template>
<template id="tpl-exchange">
<div class="page">

  
  <div class="card section">
    <div class="sec-head">
      <div>
        <span class="sec-title">快速换汇</span>
        <span class="sec-sub">实时参考汇率 · 免手续费</span>
      </div>
    </div>

    
    <div class="swap-side">
      <div class="swap-side-top">
        <span class="swap-label">卖出</span>
        <span class="swap-bal">可用余额 {{sellBal}}</span>
      </div>
      <div class="swap-side-main">
        <div class="ccy-pick" data-hover-class="press-soft" data-on-tap="openPicker" data-side="sell">
          <span class="ccy-flag">{{sellFlag}}</span>
          <span class="ccy-code">{{sell}}</span>
          <img class="ccy-caret" src="/images/chev_gray.png">
        </div>
        <input class="swap-input" type="digit" placeholder="0.00" placeholder-class="swap-ph"
          value="{{sellAmount}}" data-on-input="onAmountInput" />
      </div>
    </div>

    
    <div class="swap-mid">
      <div class="swap-btn" data-hover-class="press" data-on-tap="swapSides">
        <img class="swap-btn-icon" src="/images/swap_blue.png">
      </div>
    </div>

    
    <div class="swap-side">
      <div class="swap-side-top">
        <span class="swap-label">买入</span>
        <span class="swap-bal">参考汇率 1 {{sell}} = {{rateText}} {{buy}}</span>
      </div>
      <div class="swap-side-main">
        <div class="ccy-pick" data-hover-class="press-soft" data-on-tap="openPicker" data-side="buy">
          <span class="ccy-flag">{{buyFlag}}</span>
          <span class="ccy-code">{{buy}}</span>
          <img class="ccy-caret" src="/images/chev_gray.png">
        </div>
        <span class="swap-out">{{buyAmount}}</span>
      </div>
    </div>

    <div class="swap-fee">
      <span class="detail-label">手续费</span>
      <span class="pill emerald">免手续费</span>
    </div>

    <div class="btn btn-primary {{canSubmit ? '' : 'btn-disabled'}}" data-hover-class="press" data-on-tap="onSubmit">立即换汇</div>
  </div>

  
  <div class="card section">
    <div class="sec-head">
      <span class="sec-title">换汇历史</span>
      <div class="sec-link" data-hover-class="press" data-on-tap="goRecords">查看全部 ›</div>
    </div>
    <div class="list-row" data-wx-for="records" data-wx-key="time">
      <div class="tile amber">
        <img src="/images/swap_amber.png">
      </div>
      <div class="row-body">
        <span class="row-title">{{item.pair}}</span>
        <span class="row-sub">{{item.time}} · 汇率 {{item.rate}}</span>
      </div>
      <div class="rec-right">
        <span class="row-value">{{item.amount}}</span>
        <span class="pill emerald rec-pill">{{item.status}}</span>
      </div>
    </div>
  </div>

  <div class="page-footer-space"></div>
</div>


<div class="mask" data-wx-if="pickerVisible" data-on-tap="closePicker">
  <div class="sheet" data-on-tap-catch="noop">
    <div class="sheet-head">
      <span class="sheet-title">选择{{pickerSide === 'sell' ? '卖出' : '买入'}}币种</span>
      <div class="sheet-close" data-on-tap="closePicker">关闭</div>
    </div>
    <div class="ccy-option {{sell === item.code && pickerSide === 'sell' ? 'active' : ''}} {{buy === item.code && pickerSide === 'buy' ? 'active' : ''}}"
      data-wx-for="currencies" data-wx-key="code"
      data-hover-class="press-soft" data-on-tap="pickCcy" data-code="{{item.code}}">
      <span class="ccy-flag">{{item.flag}}</span>
      <div class="ccy-opt-body">
        <span class="ccy-opt-code">{{item.code}}</span>
        <span class="ccy-opt-name">{{item.name}}</span>
      </div>
      <span class="ccy-opt-bal">{{item.balance}}</span>
      <img class="ccy-opt-check"
        src="{{(pickerSide === 'sell' && sell === item.code) || (pickerSide === 'buy' && buy === item.code) ? '/images/check_emerald.png' : ''}}">
    </div>
  </div>
</div>


<div class="mask" data-wx-if="confirmVisible" data-on-tap="closeConfirm">
  <div class="sheet" data-on-tap-catch="noop">
    <div class="sheet-head">
      <span class="sheet-title">确认换汇交易</span>
      <div class="countdown">{{countdownText}}</div>
    </div>

    <div class="detail-row">
      <span class="detail-label">卖出</span>
      <span class="detail-value num">- {{sellAmountFmt}} {{sell}}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">买入</span>
      <span class="detail-value num">+ {{buyAmountFmt}} {{buy}}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">交易汇率</span>
      <span class="detail-value num">1 {{sell}} = {{rateText}} {{buy}}</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">手续费</span>
      <span class="detail-value">免手续费</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">预计到账</span>
      <span class="detail-value num">{{buyAmountFmt}} {{buy}}</span>
    </div>

    <div class="field pwd-field">
      <span class="field-label">交易密码</span>
      <input class="field-input" type="number" password maxlength="6"
        placeholder="请输入 6 位交易密码" placeholder-class="swap-ph"
        value="{{password}}" data-on-input="onPwdInput" />
      <span class="field-hint">汇率锁定时长 30 秒，超时后需重新确认</span>
    </div>

    <div class="btn-row">
      <div class="btn btn-ghost" data-hover-class="press" data-on-tap="closeConfirm">取消</div>
      <div class="btn btn-primary {{password.length === 6 ? '' : 'btn-disabled'}}" data-hover-class="press" data-on-tap="onConfirm">确定交易</div>
    </div>
  </div>
</div>


<div class="mask center" data-wx-if="successVisible">
  <div class="dialog" data-on-tap-catch="noop">
    <img class="dialog-icon" src="/images/success_badge.png">
    <span class="dialog-title">换汇申请成功</span>
    <span class="dialog-desc">我们将尽快为您处理，到账后可在资产中查看</span>

    <div class="dialog-detail">
      <div class="detail-row">
        <span class="detail-label">卖出</span>
        <span class="detail-value num">{{sellAmountFmt}} {{sell}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">买入</span>
        <span class="detail-value num">{{buyAmountFmt}} {{buy}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">参考汇率</span>
        <span class="detail-value num">1 {{sell}} = {{rateText}} {{buy}}</span>
      </div>
    </div>

    <div class="btn-row">
      <div class="btn btn-ghost" data-hover-class="press" data-on-tap="resetForm">继续换汇</div>
      <div class="btn btn-primary" data-hover-class="press" data-on-tap="onDone">完成</div>
    </div>
  </div>
</div>
</template>
<template id="tpl-international-remittance">
<div class="page">

  
  <div class="steps">
    <div class="step">
      <div class="step-dot {{step >= 1 ? 'on' : ''}} {{step > 1 ? 'done' : ''}}">
        <span data-wx-if="step > 1">✓</span>
        <span data-wx-else="">1</span>
      </div>
      <span class="step-text {{step >= 1 ? 'on' : ''}}">填写汇款信息</span>
    </div>
    <div class="step-line {{step > 1 ? 'on' : ''}}"></div>
    <div class="step">
      <div class="step-dot {{step >= 2 ? 'on' : ''}} {{step > 2 ? 'done' : ''}}">
        <span data-wx-if="step > 2">✓</span>
        <span data-wx-else="">2</span>
      </div>
      <span class="step-text {{step >= 2 ? 'on' : ''}}">确认汇款信息</span>
    </div>
    <div class="step-line {{step > 2 ? 'on' : ''}}"></div>
    <div class="step">
      <div class="step-dot {{step >= 3 ? 'on' : ''}}">
        <span>3</span>
      </div>
      <span class="step-text {{step >= 3 ? 'on' : ''}}">申请受理</span>
    </div>
  </div>

  
  <h5-block data-wx-if="step === 1">
    <div class="card section">
      <div class="sec-head">
        <span class="sec-title">汇款信息</span>
      </div>

      
      <div class="field">
        <span class="field-label">付款币种</span>
        <div class="picker-field" data-hover-class="press-soft" data-on-tap="openCcyPicker">
          <div class="picker-left">
            <span class="ccy-flag">{{currencyFlag}}</span>
            <span class="picker-value {{currency ? '' : 'placeholder'}}">{{currency || '请选择币种'}}</span>
          </div>
          <img class="ccy-caret" src="/images/chev_gray.png">
        </div>
        <span class="field-hint" data-wx-if="currency">可用余额 {{balanceText}}</span>
      </div>

      <div class="field">
        <span class="field-label">收款人账户名称</span>
        <input class="field-input" placeholder="请输入收款人账户名称" placeholder-class="ph"
          value="{{beneficiaryName}}" data-on-input="onInput" data-key="beneficiaryName" />
      </div>

      <div class="field">
        <span class="field-label">收款人账号</span>
        <input class="field-input" placeholder="请输入收款人银行账号" placeholder-class="ph"
          value="{{beneficiaryAccount}}" data-on-input="onInput" data-key="beneficiaryAccount" />
      </div>

      <div class="field">
        <span class="field-label">Swift Code</span>
        <input class="field-input upper" placeholder="例如：CITIUS33" placeholder-class="ph" maxlength="11"
          value="{{swiftCode}}" data-on-input="onSwiftInput" />
        <span class="field-hint">8-11 位，可在收款银行开户资料中查询</span>
      </div>

      <div class="field">
        <span class="field-label">汇出金额</span>
        <div class="amount-field">
          <input class="amount-input" type="digit" placeholder="0.00" placeholder-class="ph"
            value="{{amount}}" data-on-input="onAmountInput" />
          <div class="amount-all" data-hover-class="press" data-on-tap="useAll">全部</div>
        </div>
        <span class="field-hint" data-wx-if="currency">可用余额 {{balanceText}}</span>
      </div>

      
      <div class="field">
        <span class="field-label">是否全额到账</span>
        <div class="radio-opt {{!fullArrival ? 'active' : ''}}" data-on-tap="setFullArrival" data-value="0">
          <div class="radio-dot {{!fullArrival ? 'on' : ''}}"></div>
          <div class="radio-body">
            <span class="radio-title">否（收款方承担中间行费用）</span>
            <span class="radio-desc">实际到账金额可能少于汇出金额</span>
          </div>
        </div>
        <div class="radio-opt {{fullArrival ? 'active' : ''}}" data-on-tap="setFullArrival" data-value="1">
          <div class="radio-dot {{fullArrival ? 'on' : ''}}"></div>
          <div class="radio-body">
            <span class="radio-title">是（汇出金额即到账金额）</span>
            <span class="radio-desc">加收全额到账费 25 {{currency || ''}}</span>
          </div>
        </div>
      </div>

      
      <div class="field">
        <span class="field-label">费用明细</span>
        <div class="fee-box">
          <div class="fee-row">
            <span class="k">手续费</span>
            <span class="v">{{feeFee}}</span>
          </div>
          <div class="fee-row">
            <span class="k">全额到账费</span>
            <span class="v">{{feeFull}}</span>
          </div>
          <div class="fee-row total">
            <span class="k">费用合计</span>
            <span class="v">{{feeTotal}}</span>
          </div>
          <div class="fee-row deduct">
            <span class="k">扣款金额</span>
            <span class="v">{{feeDeduct}}</span>
          </div>
        </div>
        <span class="field-hint">扣款金额 = 汇出金额 + 费用合计，将自动计算</span>
      </div>

      <div class="field">
        <span class="field-label">转账附言</span>
        <input class="field-input" placeholder="选填，将展示在收款方账单上" placeholder-class="ph"
          value="{{remark}}" data-on-input="onInput" data-key="remark" />
      </div>

      <div class="field">
        <span class="field-label">汇款人名称</span>
        <div class="readonly-field">{{remitter}}</div>
      </div>

      
      <div class="field">
        <span class="field-label">付款材料</span>
        <div class="upload-box" data-wx-if="!fileName" data-hover-class="press-soft" data-on-tap="onUpload">
          <img class="upload-icon" src="/images/upload_blue.png">
          <span class="upload-title">上传付款材料</span>
          <span class="upload-hint">支持 zip, rar, png, jpg, jpeg, pdf，单个不超过 20MB</span>
        </div>
        <div class="file-row" data-wx-else="">
          <img class="file-icon" src="/images/doc_blue.png">
          <span class="file-name">{{fileName}}</span>
          <div class="file-del" data-hover-class="press" data-on-tap="removeFile">移除</div>
        </div>
      </div>

      <div class="btn btn-primary {{canNext ? '' : 'btn-disabled'}}" data-hover-class="press" data-on-tap="goStep2">下一步</div>
    </div>
  </h5-block>

  
  <h5-block data-wx-elif="step === 2">
    <div class="alert-bar">
      <img class="alert-icon" src="/images/warn_red.png">
      <span class="alert-text">付款申请无法取消，请确认付款信息</span>
    </div>

    <div class="card section">
      <div class="sec-head">
        <span class="sec-title">付款信息</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">付款币种</span>
        <span class="detail-value">{{currency}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">收款人账户名称</span>
        <span class="detail-value">{{beneficiaryName}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">收款人账号</span>
        <span class="detail-value">{{beneficiaryAccount}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Swift Code</span>
        <span class="detail-value">{{swiftCode}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">汇款人名称</span>
        <span class="detail-value">{{remitter}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">付款材料</span>
        <span class="detail-value">{{fileName || '未上传'}}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">转账附言</span>
        <span class="detail-value">{{remark || '—'}}</span>
      </div>
    </div>

    <div class="card section">
      <div class="sec-head">
        <span class="sec-title">资金明细</span>
      </div>
      <div class="fee-box">
        <div class="fee-row">
          <span class="k">汇出金额</span>
          <span class="v">{{amountFmt}} {{currency}}</span>

<template id="tpl-in-transit-funds">

      <div class="hero-meta-split"></div>

  <div class="card section" data-wx-if="list.length > 0">

<template id="tpl-notifications">

  <div class="card section head">

<template id="tpl-rights-center">

  <div class="rc-banner">

        <span class="rc-stat-label">{{item.label}}</span>
      </div>

  <div class="card section">

    <div class="rc-tabs h5-scroll-x"    >

    <div class="empty" data-wx-if="!filteredList.length">
      <img src="/images/inbox_gray.png">
      <span class="empty-text">暂无相关优惠券</span>

  </div>

  <div class="page-footer-space"></div>
</div>

</div>

          (showCancel ? '<div class="h5-modal-btn" data-act="cancel">' + escapeHtml(opt.cancelText || '取消') + '</div>' : '') +

        '</div>' +
      '</div>'
    document.body.appendChild(wrap)
    requestAnimationFrame(function () { wrap.classList.add('show') })

    function done(ok) {
      wrap.classList.remove('show')
      setTimeout(function () { wrap.parentNode && wrap.parentNode.removeChild(wrap) }, 200)
      if (ok) { opt.success && opt.success({ confirm: true, cancel: false }) }
      else { opt.fail && opt.fail({ confirm: false, cancel: true }); opt.complete && opt.complete({}) }
    }
    wrap.addEventListener('click', function (e) {
      var act = e.target.getAttribute && e.target.getAttribute('data-act')
      if (act === 'confirm') done(true)
      else if (act === 'cancel' || e.target === wrap) done(false)
    })
  }

  function copyText(text) {

    ta.value = text
    ta.style.cssText = 'position:fixed;left:-9999px;top:0'
    document.body.appendChild(ta)
    ta.select()
    var ok = false
    try { ok = document.execCommand('copy') } catch (e) {}
    document.body.removeChild(ta)
    if (!ok && navigator.clipboard) {
      try { navigator.clipboard.writeText(text) } catch (e) {}
    }

  }

  function makeSelectorQuery(inst) {
    var ops = []
    var api = {
      in: function () { return api },
      select: function (sel) { ops.push({ sel: sel, all: false }); return api },
      selectAll: function (sel) { ops.push({ sel: sel, all: true }); return api },
      selectViewport: function () { ops.push({ viewport: true }); return api },
      boundingClientRect: function (cb) { api.__cb = cb; return api },
      scrollOffset: function (cb) { api.__cb = cb; return api },
      fields: function () { return api },
      exec: function (cb) {
        var body = inst.__body
        var res = ops.map(function (op) {
          if (op.viewport) return { scrollTop: body.scrollTop, scrollLeft: body.scrollLeft }
          var els = op.all ? Array.prototype.slice.call(body.querySelectorAll(op.sel)) : [body.querySelector(op.sel)]
          var out = els.map(function (el) {
            if (!el) return null
            var r = el.getBoundingClientRect()
            return { left: r.left, top: r.top, right: r.right, bottom: r.bottom, width: r.width, height: r.height, id: el.id }
          })
          return op.all ? out : out[0]

        if (typeof cb === 'function') cb(res)
        if (typeof api.__cb === 'function') api.__cb(res)

    }
    return api
  }

  /* ============================================================
     9. 迷你 ECharts（仅实现汇率折线图所需的绘制）
     ============================================================ */
  function MiniChart(canvas, width, height, dpr) {
    this.canvas = canvas
    this.w = width
    this.h = height
    this.dpr = dpr || window.devicePixelRatio || 1
    canvas.width = Math.round(width * this.dpr)
    canvas.height = Math.round(height * this.dpr)
    canvas.style.width = width + 'px'
    canvas.style.height = height + 'px'
    this.ctx = canvas.getContext('2d')
  }

  MiniChart.prototype.resize = function (w, h) {
    this.w = w; this.h = h
    this.canvas.width = Math.round(w * this.dpr)
    this.canvas.height = Math.round(h * this.dpr)
    this.canvas.style.width = w + 'px'
    this.canvas.style.height = h + 'px'
    this.draw()
  }

  MiniChart.prototype.setOption = function (option) {
    this.option = option
    this.draw()
  }

  MiniChart.prototype.draw = function () {
    var o = this.option
    if (!o || !this.ctx) return
    var ctx = this.ctx
    var dpr = this.dpr
    var W = this.w, H = this.h

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
    ctx.clearRect(0, 0, W, H)

    var series = o.series && o.series[0]
    if (!series) return
    var rates = series.data || []
    var dates = (o.xAxis && o.xAxis.data) || []
    if (!rates.length) return

    var yLabelFont = 10
    var padL = 36, padR = 8, padT = 14, padB = 16
    var x0 = padL, x1 = W - padR, y0 = padT, y1 = H - padB
    if (x1 <= x0 || y1 <= y0) return

    var min = Math.min.apply(null, rates)
    var max = Math.max.apply(null, rates)
    var span = max - min || Math.abs(max) * 0.01 || 1
    min -= span * 0.18
    max += span * 0.18

    var n = rates.length
    function px(i) { return x0 + (n === 1 ? (x1 - x0) / 2 : (x1 - x0) * i / (n - 1)) }
    function py(v) { return y1 - (v - min) / (max - min) * (y1 - y0) }

    var pts = rates.map(function (v, i) { return { x: px(i), y: py(v) } })

    // --- y 轴网格 + 标签 ---
    var splitN = (o.yAxis && o.yAxis.splitNumber) || 3
    var yFmt = (o.yAxis && o.yAxis.axisLabel && o.yAxis.axisLabel.formatter) || function (v) { return String(v) }
    ctx.save()
    ctx.font = yLabelFont + 'px -apple-system, "PingFang SC", sans-serif'
    ctx.textAlign = 'right'
    ctx.textBaseline = 'middle'
    for (var s = 0; s <= splitN; s++) {
      var vv = min + (max - min) * s / splitN
      var yy = py(vv)
      if (yy < y0 - 1 || yy > y1 + 1) continue
      ctx.beginPath()
      ctx.setLineDash([3, 3])
      ctx.strokeStyle = '#f1f5f9'
      ctx.lineWidth = 1
      ctx.moveTo(x0, Math.round(yy) + 0.5)
      ctx.lineTo(x1, Math.round(yy) + 0.5)
      ctx.stroke()
      ctx.setLineDash([])
      ctx.fillStyle = '#94a3b8'
      ctx.fillText(String(yFmt(vv)), x0 - 5, yy)
    }
    ctx.restore()

    // --- x 轴标签 ---
    var interval = (o.xAxis && o.xAxis.axisLabel && o.xAxis.axisLabel.interval) || 0
    var step = interval + 1
    ctx.save()
    ctx.font = yLabelFont + 'px -apple-system, "PingFang SC", sans-serif'
    ctx.fillStyle = '#94a3b8'
    ctx.textAlign = 'center'
    ctx.textBaseline = 'top'
    var lastRight = -999
    for (var i = 0; i < n; i += step) {
      var label = String(dates[i] === undefined ? '' : dates[i])
      if (!label) continue
      var tw = ctx.measureText(label).width
      var cx = px(i)
      if (cx - tw / 2 < lastRight + 4) continue
      if (cx - tw / 2 < x0 - 2 || cx + tw / 2 > x1 + 2) continue
      ctx.fillText(label, cx, y1 + 4)
      lastRight = cx + tw / 2
    }
    ctx.restore()

    // --- 面积渐变 ---
    var areaColor = series.areaStyle && series.areaStyle.color
    var grad = ctx.createLinearGradient(0, y0, 0, y1)
    if (areaColor && areaColor.colorStops) {
      areaColor.colorStops.forEach(function (st) { grad.addColorStop(st.offset, st.color) })
    } else {
      grad.addColorStop(0, 'rgba(37,99,235,0.18)')
      grad.addColorStop(1, 'rgba(37,99,235,0.01)')
    }
    ctx.save()
    ctx.beginPath()
    traceSmooth(ctx, pts, series.smooth !== false)
    ctx.lineTo(pts[pts.length - 1].x, y1)
    ctx.lineTo(pts[0].x, y1)
    ctx.closePath()
    ctx.fillStyle = grad
    ctx.fill()
    ctx.restore()

    // --- 折线 ---
    var lineColor = (series.lineStyle && series.lineStyle.color) || '#2563eb'
    var lineWidth = (series.lineStyle && series.lineStyle.width) || 2
    ctx.save()
    ctx.beginPath()
    traceSmooth(ctx, pts, series.smooth !== false)
    ctx.strokeStyle = lineColor
    ctx.lineWidth = lineWidth
    ctx.lineJoin = 'round'
    ctx.lineCap = 'round'
    ctx.stroke()
    ctx.restore()

    // --- 当前价标注线 ---
    var ml = series.markLine
    if (ml && ml.data && ml.data.length) {
      var mv = ml.data[0].yAxis
      var my = py(mv)
      if (my >= y0 && my <= y1) {
        var lc = (ml.lineStyle && ml.lineStyle.color) || '#f59e0b'
        ctx.save()
        ctx.beginPath()
        ctx.setLineDash([4, 3])
        ctx.strokeStyle = lc
        ctx.lineWidth = (ml.lineStyle && ml.lineStyle.width) || 1
        ctx.moveTo(x0, Math.round(my) + 0.5)
        ctx.lineTo(x1, Math.round(my) + 0.5)
        ctx.stroke()
        ctx.setLineDash([])

        var labelText = String(mv.toFixed(4))
        ctx.font = 'bold 10px -apple-system, "PingFang SC", sans-serif'
        var lw = ctx.measureText(labelText).width + 8
        var lx = x1 - lw
        var ly = my - 14
        if (ly < y0) ly = my + 3
        ctx.fillStyle = 'rgba(255, 251, 235, 0.95)'
        roundRect(ctx, lx, ly, lw, 14, 4)
        ctx.fill()
        ctx.fillStyle = (ml.label && ml.label.color) || '#d97706'
        ctx.textAlign = 'center'
        ctx.textBaseline = 'middle'
        ctx.fillText(labelText, lx + lw / 2, ly + 7.5)
        ctx.restore()
      }
    }
  }

  function traceSmooth(ctx, pts, smooth) {
    if (!pts.length) return
    ctx.moveTo(pts[0].x, pts[0].y)
    if (!smooth || pts.length < 3) {
      for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y)
      return
    }
    for (var j = 0; j < pts.length - 1; j++) {
      var p0 = pts[j - 1] || pts[j]
      var p1 = pts[j]
      var p2 = pts[j + 1]
      var p3 = pts[j + 2] || p2
      ctx.bezierCurveTo(
        p1.x + (p2.x - p0.x) / 6, p1.y + (p2.y - p0.y) / 6,
        p2.x - (p3.x - p1.x) / 6, p2.y - (p3.y - p1.y) / 6,
        p2.x, p2.y
      )
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath()
    ctx.moveTo(x + r, y)
    ctx.arcTo(x + w, y, x + w, y + h, r)
    ctx.arcTo(x + w, y + h, x, y + h, r)
    ctx.arcTo(x, y + h, x, y, r)
    ctx.arcTo(x, y, x + w, y, r)
    ctx.closePath()
  }

  var CHART_INSTANCES = []

  var ECHARTS = {
    init: function (canvas, theme, opt) {
      var chart = new MiniChart(canvas, (opt && opt.width) || canvas.clientWidth, (opt && opt.height) || canvas.clientHeight, (opt && opt.devicePixelRatio) || 1)
      chart.__host = canvas.parentElement
      CHART_INSTANCES.push(chart)
      return chart
    },
    dispose: function (chart) {},
    graphic: {}
  }

  /* ============================================================
     10. 路由与页面栈
     ============================================================ */
  var stack = []        // [{ name, inst }]
  var metaByName = {}

  PAGES_META.forEach(function (m) { metaByName[m.name] = m })

  function pageNameFromUrl(url) {
    var m = /\/pages\/([^\/?#]+)\//.exec(url || '')
    if (m) return m[1]
    var m2 = /([^\/?#]+)$/.exec(String(url || '').replace(/\/$/, ''))
    return m2 ? m2[1] : ''
  }

  function showPageEl(name, visible) {
    var el = document.getElementById('pg-' + name)
    if (el) el.classList.toggle('on', !!visible)
  }

  function lifecycle(inst, hook) {
    var fn = inst[hook]
    if (typeof fn === 'function') {
      try { fn.call(inst) } catch (e) { warn('[h5] ' + hook + ' 异常 (' + inst.__name + ')', e) }
    }

  function mount(name) {
    var inst = createPageInstance(name)
    bindEvents(inst)
    showPageEl(name, true)

    // 清理同页残留（同一页可能被多次 push）
    var body = inst.__body
    if (body) body.innerHTML = ''

    CURRENT_PAGE = inst
    lifecycle(inst, 'onLoad')
    renderPage(inst)
    inst.__rendered = true
    lifecycle(inst, 'onReady')
    lifecycle(inst, 'onShow')
    syncNav(inst)
    syncTabbar(inst)
    return inst
  }

  function unmount(entry) {
    showPageEl(entry.name, false)
    lifecycle(entry.inst, 'onHide')
    lifecycle(entry.inst, 'onUnload')
  }

  function syncNav(inst) {
    var meta = metaByName[inst.__name] || {}
    var el = document.getElementById('pg-' + inst.__name)
    if (!el) return
    var titleEl = el.querySelector('.h5-nav-title')
    if (titleEl) titleEl.textContent = meta.title || ''
    var nav = el.querySelector('.h5-nav')
    if (nav) nav.classList.toggle('no-back', !!meta.isTab)
  }

  function syncTabbar(inst) {
    var meta = metaByName[inst.__name] || {}
    var bar = document.getElementById('h5-tabbar')
    if (!bar) return
    if (!meta.isTab) {
      bar.classList.remove('on')
      return

    bar.classList.add('on')
    Array.prototype.forEach.call(bar.querySelectorAll('.h5-tab'), function (t) {
      t.classList.toggle('on', t.getAttribute('data-name') === inst.__name)

  }

  function writeHash(name) {
    var h = '#/' + name
    if (location.hash !== h) {
      try { history.replaceState(null, '', h) } catch (e) { location.hash = h }
    }
  }

  function pushPage(name, replace) {
    if (!PAGE_DEFS[name]) { warn('[h5] 页面不存在:', name); return }
    var prev = stack[stack.length - 1]
    if (prev && !replace) { lifecycle(prev.inst, 'onHide'); showPageEl(prev.name, false) }
    if (prev && replace) { unmount(prev); stack.pop() }

    var inst = mount(name)
    stack.push({ name: name, inst: inst })
    writeHash(name)
    var body = inst.__body
    if (body) body.scrollTop = 0

  function switchTabPage(name) {
    while (stack.length) {
      var e = stack.pop()
      if (e.name !== name) unmount(e)
      else { stack.push(e); break }
    }
    if (!stack.length || stack[stack.length - 1].name !== name) {
      var inst = mount(name)
      stack = [{ name: name, inst: inst }]
    } else {
      var cur = stack[stack.length - 1]
      showPageEl(name, true)
      CURRENT_PAGE = cur.inst
      lifecycle(cur.inst, 'onShow')
      renderPage(cur.inst)
      syncNav(cur.inst)
      syncTabbar(cur.inst)

    writeHash(name)

    var cur = stack[stack.length - 1]
    if (!cur) { pushPage(PAGES_META[0] ? PAGES_META[0].name : 'index'); return }
    showPageEl(cur.name, true)
    CURRENT_PAGE = cur.inst
    // 同一页面可能被多次实例化而共用同一容器，返回时需按该实例的数据重绘
    if (!cur.inst.__master) renderPage(cur.inst)
    lifecycle(cur.inst, 'onShow')
    syncNav(cur.inst)
    syncTabbar(cur.inst)
    writeHash(cur.name)

  WX.switchTab = function (o) { switchTabPage(pageNameFromUrl(o.url)); o && o.success && o.success({}) }

  }

  /* ============================================================
     11. 页面外壳（导航栏 + tabBar 由构建期写好，这里只接线）
     ============================================================ */
  function buildTabbar() {
    var bar = document.getElementById('h5-tabbar')
    if (!bar) return
    bar.innerHTML = ''

    host.innerHTML = ''

      sec.id = 'pg-' + m.name
      sec.setAttribute('data-name', m.name)

          '<div class="h5-nav-back" data-back="1">‹</div>' +
          '<div class="h5-nav-title">' + escapeHtml(m.title || '') + '</div>' +

      sec.querySelector('.h5-nav-back').addEventListener('click', function () { goBack(1) })
      host.appendChild(sec)
    })
  }

  function onResize() {
    setRootSize()
    CHART_INSTANCES.forEach(function (c) {
      var canvas = c.canvas
      if (!canvas || !document.body.contains(canvas)) return
      var box = canvas.closest('.chart-box') || canvas.parentElement
      if (!box) return
      var w = Math.max(box.clientWidth, 40)
      var h = Math.max(box.clientHeight, 40)
      if (Math.abs(w - c.w) > 0.5 || Math.abs(h - c.h) > 0.5) c.resize(w, h)
    })
  }

  function boot() {
    setRootSize()

    buildPages()
    buildTabbar()

    window.addEventListener('resize', onResize)
    window.addEventListener('orientationchange', function () { setTimeout(onResize, 200) })

    // 起始页：hash 优先；其余情况先落到首页
    var start = (location.hash || '').replace(/^#\/?/, '')
    var startMeta = metaByName[start]
    if (!startMeta) start = PAGES_META[0] ? PAGES_META[0].name : 'index'
    if (start === (PAGES_META[0] && PAGES_META[0].name)) startMeta = metaByName[start]

    if (startMeta && startMeta.isTab) {
      switchTabPage(start)
    } else {
      var home = PAGES_META[0] ? PAGES_META[0].name : 'index'
      pushPage(home)
      if (start !== home) pushPage(start)
      return finishBoot()

  function finishBoot() {
    var cur = stack[stack.length - 1]

  }

  window.addEventListener('hashchange', function () {
    var name = (location.hash || '').replace(/^#\/?/, '')
    if (!name || !metaByName[name]) return
    var cur = stack[stack.length - 1]
    if (cur && cur.name === name) return
    if (metaByName[name].isTab) switchTabPage(name)
    else pushPage(name)
  })

  // 所有注入脚本执行完毕后再启动（页面 JS 需要先完成 Page() 注册）
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 0) })
  } else {
    setTimeout(boot, 0)
  }

  // 调试出口 + 供构建期注入的 app.js 使用
  window.__H5_BOOTSTRAP__ = { App: App, getApp: getApp, WX: WX }
  window.__H5__ = { getStack: function () { return stack }, WX: WX, PAGE_DEFS: PAGE_DEFS }

})(window, document)

const { fmtNum, withSymbol } = require('../../utils/format.js')

// 币种表（余额与 Web 版 wallet.html 对齐）
const CURRENCIES = [
  { code: 'USD', name: '美元', flag: '🇺🇸', symbol: '$', balance: 842500.20, balanceText: '$ 842,500.20' },
  { code: 'CNH', name: '人民币', flag: '🇨🇳', symbol: '¥', balance: 890000.00, balanceText: '¥ 890,000.00' },
  { code: 'EUR', name: '欧元', flag: '🇪🇺', symbol: '€', balance: 156920.00, balanceText: '€ 156,920.00' },
  { code: 'GBP', name: '英镑', flag: '🇬🇧', symbol: '£', balance: 42000.00, balanceText: '£ 42,000.00' },
  { code: 'HKD', name: '港币', flag: '🇭🇰', symbol: 'HK$', balance: 125000.00, balanceText: 'HK$ 125,000.00' },
  { code: 'AUD', name: '澳元', flag: '🇦🇺', symbol: 'A$', balance: 68400.00, balanceText: 'A$ 68,400.00' }
]

// 以 USD 为锚的参考汇率（对齐 Web 版 1 USD = 7.2345 CNH）
const RATES = { USD: 1, CNH: 7.2345, EUR: 0.9234, GBP: 0.7891, HKD: 7.8102, AUD: 1.5234 }

function findCcy(code) {
  return CURRENCIES.filter(function (c) { return c.code === code })[0]
}

Page({
  data: {
    currencies: CURRENCIES,

    // 换汇表单
    sell: 'USD',
    buy: 'CNH',
    sellFlag: '🇺🇸',
    buyFlag: '🇨🇳',
    sellBal: '$ 842,500.20',
    sellAmount: '',
    sellAmountFmt: '0.00',
    buyAmount: '—',
    buyAmountFmt: '0.00',
    rateText: (RATES.CNH / RATES.USD).toFixed(4),
    canSubmit: false,

    // 弹层
    pickerVisible: false,
    pickerSide: 'sell',
    confirmVisible: false,
    successVisible: false,
    password: '',
    countdownText: '00:30',

    // 换汇历史（源：exchange.html）
    records: [
      { pair: 'USD → CNH', time: '2026-04-01 09:42', amount: '- $ 50,000.00', rate: '7.2345', status: '已完成' },
      { pair: 'EUR → USD', time: '2026-04-01 15:45', amount: '- € 12,000.00', rate: '1.0842', status: '已完成' },
      { pair: 'USD → HKD', time: '2026-03-30 11:08', amount: '- $ 8,000.00', rate: '7.8102', status: '已完成' }
    ]
  },

  onLoad() {
    this.recalc()
  },

  onUnload() {
    this.clearTimer()
  },

  onHide() {
    this.clearTimer()
  },

  /* ===== 换汇表单 ===== */

  // 汇率 = 目标币种 / 源币种
  currentRate() {
    const { sell, buy } = this.data
    const r = RATES[buy] / RATES[sell]
    return Math.round(r * 10000) / 10000
  },

  recalc() {
    const rate = this.currentRate()
    const amount = parseFloat(this.data.sellAmount) || 0
    const buyValue = amount * rate
    const sellCcy = findCcy(this.data.sell)
    const canSubmit = amount > 0 && amount <= sellCcy.balance && this.data.sell !== this.data.buy

    this.setData({
      rateText: rate.toFixed(4),
      sellAmountFmt: fmtNum(amount),
      buyAmount: amount > 0 ? withSymbol(findCcy(this.data.buy).symbol, buyValue) : '—',
      buyAmountFmt: fmtNum(buyValue),
      canSubmit: canSubmit
    })
  },

  onAmountInput(e) {
    // 只保留数字与一个小数点
    let v = (e.detail.value || '').replace(/[^\d.]/g, '')
    const firstDot = v.indexOf('.')
    if (firstDot >= 0) {
      v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '')
    }
    this.setData({ sellAmount: v }, () => this.recalc())
  },

  swapSides() {
    const { sell, buy } = this.data
    const sellCcy = findCcy(buy)
    this.setData({
      sell: buy,
      buy: sell,
      sellFlag: sellCcy.flag,
      buyFlag: findCcy(sell).flag,
      sellBal: sellCcy.balanceText
    }, () => this.recalc())
  },

  openPicker(e) {
    this.setData({ pickerVisible: true, pickerSide: e.currentTarget.dataset.side })
  },

  closePicker() {
    this.setData({ pickerVisible: false })
  },

  pickCcy(e) {
    const code = e.currentTarget.dataset.code
    const { pickerSide, sell, buy } = this.data

    // 选择与另一侧相同的币种时，自动对调，避免同币种互换
    if (pickerSide === 'sell' && code === buy) {
      this.setData({
        sell: code,
        buy: sell,
        sellFlag: findCcy(code).flag,
        buyFlag: findCcy(sell).flag,
        sellBal: findCcy(code).balanceText,
        pickerVisible: false
      }, () => this.recalc())
      return
    }
    if (pickerSide === 'buy' && code === sell) {
      this.setData({
        buy: code,
        sell: buy,
        buyFlag: findCcy(code).flag,
        sellFlag: findCcy(buy).flag,
        sellBal: findCcy(buy).balanceText,
        pickerVisible: false
      }, () => this.recalc())
      return
    }

    if (pickerSide === 'sell') {
      this.setData({
        sell: code,
        sellFlag: findCcy(code).flag,
        sellBal: findCcy(code).balanceText,
        pickerVisible: false
      }, () => this.recalc())
    } else {
      this.setData({ buy: code, buyFlag: findCcy(code).flag, pickerVisible: false }, () => this.recalc())
    }
  },

  noop() {},

  /* ===== 确认交易 ===== */

  onSubmit() {
    if (!this.data.canSubmit) {
      const ccy = findCcy(this.data.sell)
      const amount = parseFloat(this.data.sellAmount) || 0
      wx.showToast({
        title: amount <= 0 ? '请输入换汇金额' : '超出可用余额 ' + ccy.balanceText,
        icon: 'none'
      })
      return
    }
    this.setData({ confirmVisible: true, password: '' })
    this.startCountdown()
  },

  closeConfirm() {
    this.clearTimer()
    this.setData({ confirmVisible: false })
  },

  onPwdInput(e) {
    this.setData({ password: (e.detail.value || '').slice(0, 6) })
  },

  // 汇率锁定 30 秒倒计时（对齐 Web 版确认弹层的 00:30）
  startCountdown() {
    this.clearTimer()
    let left = 30
    const paint = () => {
      this.setData({ countdownText: '00:' + (left < 10 ? '0' + left : left) })
    }
    paint()
    this.timer = setInterval(() => {
      left -= 1
      if (left <= 0) {
        this.clearTimer()
        this.setData({ confirmVisible: false })
        wx.showToast({ title: '汇率已刷新，请重新确认', icon: 'none' })
        return
      }
      paint()
    }, 1000)
  },

  clearTimer() {
    if (this.timer) {
      clearInterval(this.timer)
      this.timer = null
    }
  },

  onConfirm() {
    if (this.data.password.length !== 6) {
      wx.showToast({ title: '请输入 6 位交易密码', icon: 'none' })
      return
    }
    this.clearTimer()
    const { sell, buy, sellAmountFmt, buyAmountFmt } = this.data
    const now = new Date()
    const pad = (n) => (n < 10 ? '0' + n : '' + n)
    const record = {
      pair: sell + ' → ' + buy,
      time: now.getFullYear() + '-' + pad(now.getMonth() + 1) + '-' + pad(now.getDate()) +
        ' ' + pad(now.getHours()) + ':' + pad(now.getMinutes()),
      amount: '- ' + findCcy(sell).symbol + ' ' + sellAmountFmt,
      rate: this.currentRate().toFixed(4),
      status: '处理中'
    }
    this.setData({
      confirmVisible: false,
      successVisible: true,
      password: '',
      records: [record].concat(this.data.records)
    })
  },

  resetForm() {
    this.setData({ successVisible: false, sellAmount: '', sellAmountFmt: '0.00', buyAmount: '—', buyAmountFmt: '0.00', canSubmit: false })
  },

  onDone() {
    this.setData({ successVisible: false })
    wx.navigateBack()
  },

  goRecords() {
    wx.navigateTo({ url: '/pages/rmb-exchange-records/rmb-exchange-records' })
  }
})

// 费率规则（对齐源文件常量）
const FEE_RATE = 0.001 // 0.1%
const FEE_MIN = 15 // 最低手续费
const FULL_FEE = 25 // 全额到账费
const MAX_FILE = 20 * 1024 * 1024 // 单个材料 20MB

function findCcy(code) {
  return CURRENCIES.filter(function (c) { return c.code === code })[0]
}

function pad(n) {
  return n < 10 ? '0' + n : '' + n
}

Page({
  data: {
    step: 1,
    currencies: CURRENCIES,

    // 表单
    currency: '',
    currencyFlag: '',
    balanceText: '',
    beneficiaryName: '',
    beneficiaryAccount: '',
    swiftCode: '',
    amount: '',
    amountFmt: '0.00',
    fullArrival: false,
    remark: '',
    remitter: 'PPTRANSFER LIMITED',
    fileName: '',

    // 费用与到账
    feeFee: '—',
    feeFull: '—',
    feeTotal: '—',
    feeDeduct: '—',
    arriveFmt: '0.00',
    feeBearer: '共同承担/付款人',

    // 交互
    canNext: false,
    ccyPickerVisible: false,
    password: '',
    refNo: ''
  },

  /* ===== 输入 ===== */

  onInput(e) {
    const key = e.currentTarget.dataset.key
    this.setData({ [key]: e.detail.value })
    if (key === 'beneficiaryName' || key === 'beneficiaryAccount') this.checkNext()
  },

  onSwiftInput(e) {
    this.setData({ swiftCode: (e.detail.value || '').toUpperCase() }, () => this.checkNext())
  },

  onAmountInput(e) {
    let v = (e.detail.value || '').replace(/[^\d.]/g, '')
    const firstDot = v.indexOf('.')
    if (firstDot >= 0) {
      v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '')
    }
    this.setData({ amount: v }, () => {
      this.recalcFees()
      this.checkNext()
    })
  },

  useAll() {

    if (!ccy) {
      wx.showToast({ title: '请先选择付款币种', icon: 'none' })
      return
    }
    this.setData({ amount: String(ccy.balance) }, () => {
      this.recalcFees()
      this.checkNext()
    })
  },

  setFullArrival(e) {
    this.setData({ fullArrival: e.currentTarget.dataset.value === '1' }, () => {
      this.recalcFees()
    })
  },

  /* ===== 币种选择 ===== */

  openCcyPicker() {
    this.setData({ ccyPickerVisible: true })
  },

  closeCcyPicker() {
    this.setData({ ccyPickerVisible: false })
  },

  pickCcy(e) {

    const ccy = findCcy(code)
    this.setData({
      currency: code,
      currencyFlag: ccy.flag,
      balanceText: ccy.balanceText,
      ccyPickerVisible: false
    }, () => {
      this.recalcFees()
      this.checkNext()
    })
  },

  /* ===== 费用试算 ===== */

  calcFee() {
    const amt = parseFloat(this.data.amount) || 0
    const fee = amt > 0 ? Math.max(amt * FEE_RATE, FEE_MIN) : 0
    const full = this.data.fullArrival && amt > 0 ? FULL_FEE : 0
    const total = fee + full
    return { amt: amt, fee: fee, full: full, total: total, deduct: amt + total }
  },

  recalcFees() {
    const f = this.calcFee()
    const cur = this.data.currency
    const money = (v) => (v > 0 ? fmtNum(v) + ' ' + cur : '—')

    this.setData({
      amountFmt: fmtNum(f.amt),
      feeFee: money(f.fee),
      feeFull: money(f.full),
      feeTotal: money(f.total),
      feeDeduct: money(f.deduct),
      arriveFmt: fmtNum(f.amt > f.fee && f.amt > 0 ? f.amt - f.fee : 0),
      feeBearer: this.data.fullArrival ? '付款人全额承担' : '共同承担/付款人'

    const ok = !!(d.currency && d.beneficiaryName && d.beneficiaryAccount && d.swiftCode &&

    this.setData({ canNext: ok })
    return ok
  },

  validate() {
    const d = this.data
    const amt = parseFloat(d.amount) || 0
    const ccy = findCcy(d.currency)
    if (!d.currency) return '请选择付款币种'
    if (!d.beneficiaryName) return '请输入收款人账户名称'
    if (!d.beneficiaryAccount) return '请输入收款人账号'
    if (!d.swiftCode) return '请输入 Swift Code'
    if (!(amt > 0)) return '请输入汇出金额'
    if (ccy && amt > ccy.balance) return '超出可用余额 ' + ccy.balanceText
    return ''
  },

    if (err) {

// 统一补齐展示字段（类型配色 / 状态徽章 / 金额文案 / 使用进度）
function decorate(c) {
  const ckey = colorKeyOf(c.scope)
  return Object.assign({}, c, {
    ckey: ckey,
    icon: TYPE_ICON[ckey],
    statusText: STATUS_TEXT[c.status],
    pill: STATUS_PILL[c.status],
    usedText: '¥' + fmtNum(c.used),

    pct: c.amount > 0 ? Math.min(100, Math.round((c.used / c.amount) * 100)) : 0,

    scopeList: c.scope.split('/').map(function (s) { return s.trim() })

Page({

  onLoad() {
    this.refreshStats()
    this.setData({ filteredList: this.filterBy('all') })
  },

  /* ===== 统计 + 筛选计数 ===== */
  refreshStats() {
    const avail = COUPONS.filter(c => c.status === 'active' || c.status === 'expiring')
    const totalUsed = COUPONS.reduce((s, c) => s + c.used, 0)
    const totalLeft = avail.reduce((s, c) => s + (c.amount - c.used), 0)
    const countBy = st => COUPONS.filter(c => c.status === st).length

    this.setData({
      stats: [
        { icon: 'ticket_blue', tone: 'blue', value: String(avail.length), label: '可用优惠券' },
        { icon: 'coin_emerald', tone: 'emerald', value: '¥' + fmtNum(totalUsed), label: '累计已抵扣' },
        { icon: 'wallet_amber', tone: 'amber', value: '¥' + fmtNum(totalLeft), label: '剩余可用额度' },

      filters: [
        { key: 'all', label: '全部', count: COUPONS.length },
        { key: 'active', label: '可用', count: avail.length },

        { key: 'expired', label: '已过期', count: countBy('expired') }

    })

    if (key === 'all') return COUPONS
    if (key === 'active') return COUPONS.filter(c => c.status === 'active' || c.status === 'expiring')
    return COUPONS.filter(c => c.status === key)
  },

  onFilter(e) {
    const key = e.currentTarget.dataset.key
    if (key === this.data.filterKey) return
    this.setData({ filterKey: key, filteredList: this.filterBy(key) })
  },

  /* ===== 详情弹层 ===== */
  openDetail(e) {
    const id = e.currentTarget.dataset.id
    const coupon = COUPONS.filter(c => c.id === id)[0]
    if (!coupon) return
    this.setData({ detailVisible: true, detail: coupon })
  },

  closeDetail() {
    this.setData({ detailVisible: false })
  },

  noop() {},

  showRules() {
