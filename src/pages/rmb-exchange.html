<!--
  pages/rmb-exchange.html · 人民币结汇
  ---------------------------------------------------------------
  页头是模块级 tab（结汇提现 / 结汇账户）+ 横幅 + 入口 + 优势信息。
  两个 tab 各自是一个独立页面，tab 只做导航、不做页内切换：
    结汇提现  → pages/rmb-exchange-withdraw.html
    结汇账户  → pages/rmb-exchange-accounts.html（列表，内含添加账户入口）
  那两页顶部放同一条 tab 条（用 data-replace 互跳，来回切换不会让页面栈
  越堆越深），三个页面因此看起来是同一模块下的三个 tab 页。
  本页的 tab 用 data-go：从这里进子页要入栈，返回才有落点。
  入口与信息项都是同构列表，由 JS 渲染；入口数据里打 hidden 标记的
  不渲染（企业结汇暂时下线），未上线的入口写 data-demo 给占位提示。
-->

<!-- ================= 顶部 tab：结汇提现 / 结汇账户 ================= -->
<div class="seg tabseg" id="rmb-tabseg" role="tablist" aria-label="人民币结汇功能">
  <button type="button" class="seg-item" role="tab" aria-selected="true"
          data-go="rmb-exchange-withdraw">结汇提现</button>
  <button type="button" class="seg-item" role="tab" aria-selected="false"
          data-go="rmb-exchange-accounts">结汇账户</button>
</div>

<!-- ================= 页头横幅 ================= -->
<section class="banner">
  <span class="banner-deco banner-deco--a" aria-hidden="true"></span>
  <span class="banner-deco banner-deco--b" aria-hidden="true"></span>
  <div class="banner-text">
    <h1 class="banner-title">人民币结汇</h1>
    <p class="banner-sub">将外币资金结汇为人民币，最快 30 分钟到账</p>
  </div>
  <button type="button" class="record-btn" data-go="rmb-exchange-records">
    <svg aria-hidden="true"><use href="#i-doc"/></svg>
    <span>结汇记录</span>
  </button>
</section>

<!-- ================= 结汇入口 ================= -->
<nav id="entry-list" aria-label="结汇入口"></nav>

<!-- ================= 优势信息 ================= -->
<section class="card info-card">
  <ul class="info-list" id="info-list"></ul>
</section>

<div class="page-end"></div>
