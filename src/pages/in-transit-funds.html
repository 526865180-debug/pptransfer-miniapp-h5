<!--
  pages/in-transit-funds.html · 在途资金
  ---------------------------------------------------------------
  汇总 Hero 与筛选项为静态骨架；状态页签、资金列表、汇总数字由 JS 渲染
  （数据见 in-transit-funds.js 顶部的演示常量）。
  汇总金额带 data-amount，跟随全局金额脱敏开关。
  资金详情交给 PP.ui.sheet，片段里只留触发按钮。
-->

<!-- 汇总 Hero -->
<section class="hero fund-hero">
  <span class="hero-deco hero-deco--a" aria-hidden="true"></span>
  <span class="hero-deco hero-deco--b" aria-hidden="true"></span>

  <span class="hero-label">在途资金合计 (USD)</span>
  <span class="hero-amount num" data-amount id="fund-total">$ 0.00</span>

  <span class="hero-divider" aria-hidden="true"></span>

  <div class="hero-meta">
    <div class="hero-meta-item">
      <span class="hero-meta-label">全部笔数</span>
      <span class="hero-meta-value num" id="fund-all-count">0 笔</span>
    </div>
    <span class="hero-meta-split" aria-hidden="true"></span>
    <div class="hero-meta-item">
      <span class="hero-meta-label">在途中</span>
      <span class="hero-meta-value num" id="fund-transit-count">0 笔</span>
    </div>
  </div>
</section>

<!-- 状态筛选；由 JS 渲染 -->
<div class="seg fund-filter" id="fund-status" role="tablist" aria-label="资金状态筛选"></div>

<!-- 资金列表；由 JS 渲染 -->
<section class="card card--section" id="fund-list-card">
  <ul class="fund-list" id="fund-list" role="list"></ul>
  <p class="fund-count" id="fund-count">共 0 条记录</p>
</section>

<!-- 空状态 -->
<section class="card card--section empty" id="fund-empty" hidden>
  <svg class="empty-icon" aria-hidden="true"><use href="#i-inbox"/></svg>
  <span class="empty-text">未找到匹配的资金记录</span>
</section>
