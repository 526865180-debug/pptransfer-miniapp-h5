<!--
  pages/rmb-exchange-withdraw.html · 结汇提现
  ---------------------------------------------------------------
  人民币结汇模块的 tab 一。顶部 tab 条与首页、结汇账户页共用同一条：
  两个子页是平级的，互跳用 data-replace（顶掉栈顶而不是入栈），来回切换
  不会把页面栈越堆越深；返回键始终回到人民币结汇首页。

  三步在同一页内切换（section 的 hidden 属性），不新开路由。
  步骤 1 对齐产品截图：可提现金额 / 提现金额(全部提现) / 提现至单选 /
  结汇提现账户(搜索选择) / 基础手续费 / 到账金额(反算) / 转账附言。
  步骤 2 确认信息 + 交易密码；步骤 3 提交成功。
  账户搜索选择用 PP.ui.sheet；提交前用 PP.ui.confirm 二次确认。
-->

<!-- ================= 顶部 tab：结汇提现 / 结汇账户 ================= -->
<div class="seg tabseg" id="withdraw-tabseg" role="tablist" aria-label="人民币结汇功能">
  <button type="button" class="seg-item" role="tab" aria-selected="true"
          data-go="rmb-exchange-withdraw" data-replace>结汇提现</button>
  <button type="button" class="seg-item" role="tab" aria-selected="false"
          data-go="rmb-exchange-accounts" data-replace>结汇账户</button>
</div>

<!-- 步骤指示器：data-tone 由 JS 按当前进度刷新 -->
<ol class="wz-steps" id="steps" aria-label="结汇提现流程">
  <li class="wz-step" data-tone="blue" aria-current="step">
    <span class="wz-dot">1</span>
    <span class="wz-text">填写信息</span>
  </li>
  <li class="wz-step" data-tone="neutral">
    <span class="wz-dot">2</span>
    <span class="wz-text">确认信息</span>
  </li>
  <li class="wz-step" data-tone="neutral">
    <span class="wz-dot">3</span>
    <span class="wz-text">提交完成</span>
  </li>
</ol>

<!-- ===== 步骤 1：填写提现信息 ===== -->
<section class="wizard-step" data-step="0">
  <div class="card quota">
    <div class="quota-body">
      <span class="quota-label">可提现金额</span>
      <span class="quota-amount num" id="available-amount">997.00 CNH</span>
    </div>
    <button type="button" class="quota-link" data-go="exchange">去换汇</button>
  </div>

  <div class="card wizard-card">
    <!-- 提现金额 -->
    <div class="frow">
      <label class="frow-label" for="amount-input">
        <i class="frow-req" aria-hidden="true">*</i>提现金额：
      </label>
      <div class="amt-wrap">
        <input class="field-input amt-input num" id="amount-input" type="text"
               inputmode="decimal" autocomplete="off" placeholder="请输入提现金额">
        <button type="button" class="amt-all" id="fill-all">全部提现</button>
      </div>
      <span class="field-error" id="amount-error" role="alert" hidden></span>
    </div>

    <!-- 提现至 -->
    <div class="frow">
      <span class="frow-label" id="to-label"><i class="frow-req" aria-hidden="true">*</i>提现至：</span>
      <div class="radio-group" role="radiogroup" aria-labelledby="to-label">
        <button type="button" class="radio-pill" role="radio" aria-checked="true"  data-value="company">本公司</button>
        <button type="button" class="radio-pill" role="radio" aria-checked="false" data-value="supplier">供应商</button>
      </div>
    </div>

    <!-- 结汇提现账户 -->
    <div class="frow">
      <span class="frow-label" id="acct-label"><i class="frow-req" aria-hidden="true">*</i>结汇提现账户：</span>
      <button type="button" class="select-field" id="account-btn"
              aria-haspopup="dialog" aria-labelledby="acct-label">
        <span class="select-value is-placeholder" id="account-value">请选择结汇提现账户</span>
        <svg class="select-caret" aria-hidden="true"><use href="#i-chevron-down"/></svg>
      </button>
      <span class="select-hint">可输入账户名称/备注名/卡号/银行名称搜索</span>
      <button type="button" class="link-btn link-btn--end" data-go="add-rmb-exchange-account">添加结汇提现账户</button>
    </div>

    <!-- 基础手续费 -->
    <div class="detail-row fee-row">
      <span class="detail-label">基础手续费</span>
      <span class="detail-value num" id="fee-value">-- CNH</span>
    </div>

    <!-- 到账金额 -->
    <div class="frow">
      <label class="frow-label" for="arrival-input">
        <i class="frow-req" aria-hidden="true">*</i>到账金额：
      </label>
      <input class="field-input num" id="arrival-input" type="text"
             inputmode="decimal" autocomplete="off"
             placeholder="您可输入到账金额，将为您自动计算提现金额">
    </div>

    <!-- 转账附言 -->
    <div class="frow frow--last">
      <label class="frow-label" for="memo-input">转账附言：</label>
      <textarea class="memo-input" id="memo-input" rows="3" maxlength="50"
                placeholder="选填，将随款项展示给收款方"></textarea>
    </div>
  </div>

  <div class="footbar">
    <button type="button" class="btn btn--ghost" data-back>取消</button>
    <button type="button" class="btn btn--primary" id="next-btn" aria-disabled="true">下一步</button>
  </div>
</section>

<!-- ===== 步骤 2：确认信息 ===== -->
<section class="wizard-step" data-step="1" hidden>
  <div class="card wizard-card">
    <div class="section-head">
      <h2 class="section-title">提现信息确认</h2>
    </div>
    <div class="detail-row">
      <span class="detail-label">提现金额</span>
      <span class="detail-value num" id="confirm-amount">0.00 CNH</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">提现至</span>
      <span class="detail-value" id="confirm-to">本公司</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">结汇提现账户</span>
      <span class="detail-value" id="confirm-account">--</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">基础手续费</span>
      <span class="detail-value num" id="confirm-fee">0.00 CNH</span>
    </div>
    <div class="detail-row">
      <span class="detail-label">到账金额</span>
      <span class="detail-value num" data-tone="success" id="confirm-arrival">0.00 CNH</span>
    </div>
    <div class="detail-row" id="confirm-memo-row" hidden>
      <span class="detail-label">转账附言</span>
      <span class="detail-value" id="confirm-memo"></span>
    </div>
  </div>

  <div class="card wizard-card">
    <div class="field">
      <label class="field-label" for="pwd-input">交易密码</label>
      <input class="field-input" id="pwd-input" type="password" inputmode="numeric"
             maxlength="6" autocomplete="off" placeholder="请输入 6 位交易密码">
    </div>
  </div>

  <div class="footbar">
    <button type="button" class="btn btn--ghost" id="prev-btn">返回上一步</button>
    <button type="button" class="btn btn--primary" id="submit-btn" aria-disabled="true">确认提交</button>
  </div>
</section>

<!-- ===== 步骤 3：提交成功 ===== -->
<section class="wizard-step" data-step="2" hidden>
  <div class="result">
    <span class="result-icon" aria-hidden="true">
      <svg aria-hidden="true"><use href="#i-check-circle"/></svg>
    </span>
    <h2 class="result-title">您的结汇提现已提交成功</h2>
    <p class="result-desc">我们将尽快完成审核，请耐心等待结果</p>

    <div class="card result-card">
      <div class="detail-row">
        <span class="detail-label">申请金额</span>
        <span class="detail-value num" id="result-amount">0.00 CNH</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">到账金额</span>
        <span class="detail-value num" id="result-arrival">0.00 CNH</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">交易流水号</span>
        <span class="detail-value num" id="result-order-no"></span>
      </div>
    </div>
  </div>

  <div class="footbar">
    <button type="button" class="btn btn--ghost" data-go="index">返回首页</button>
    <button type="button" class="btn btn--primary" data-go="rmb-exchange-records">查看结汇记录</button>
  </div>
</section>
