<!--
  pages/order-management.html · 订单管理
  ---------------------------------------------------------------
  静态结构与文案写在这里；订单卡片由 JS 从 ORDERS 渲染。
  筛选 / 详情 / 编辑（创建）三个弹层交给 PP.ui.sheet，页面里只有触发按钮。
  新增订单按钮用 sticky 停靠条实现，跟随滚动停在列表上方，
  不脱离应用框（position: fixed 在桌面态会跑出 430px 的模拟机身）。
-->

<!-- ===== 订单状态统计（点击即筛选） ===== -->
<div class="stat-bar" role="group" aria-label="按订单状态筛选">
  <button type="button" class="stat-item" data-status="" aria-pressed="true">
    <span class="stat-num num" data-count="all">10</span>
    <span class="stat-label">全部</span>
  </button>
  <button type="button" class="stat-item" data-status="待关联" data-tone="warning" aria-pressed="false">
    <span class="stat-num num" data-count="pending">3</span>
    <span class="stat-label">待关联</span>
  </button>
  <button type="button" class="stat-item" data-status="部分关联" aria-pressed="false">
    <span class="stat-num num" data-count="partial">3</span>
    <span class="stat-label">部分关联</span>
  </button>
  <button type="button" class="stat-item" data-status="全部关联" data-tone="success" aria-pressed="false">
    <span class="stat-num num" data-count="linked">4</span>
    <span class="stat-label">全部关联</span>
  </button>
</div>

<!-- ===== 搜索 + 筛选 ===== -->
<div class="toolbar">
  <div class="search-box">
    <svg class="search-icon" aria-hidden="true"><use href="#i-search"/></svg>
    <input type="text" class="search-input" id="om-search" enterkeyhint="search"
           placeholder="搜索订单号 / 合同号 / 买方"
           aria-label="搜索订单号、合同号或买方">
    <button type="button" class="search-clear" id="om-clear" hidden>清除</button>
  </div>
  <button type="button" class="filter-btn" id="om-filter" data-active="false"
          aria-haspopup="dialog" aria-label="筛选">
    <svg aria-hidden="true"><use href="#i-filter"/></svg>
    <span class="filter-badge" id="om-filter-badge" hidden>0</span>
  </button>
</div>

<!-- ===== 列表头 ===== -->
<div class="list-head">
  <span class="list-count" id="om-count">共 10 条订单</span>
  <button type="button" class="btn-text" id="om-export">导出列表</button>
</div>

<!-- ===== 订单卡片列表（JS 渲染） ===== -->
<ul class="om-list" id="om-list" aria-label="订单列表"></ul>

<!-- ===== 空状态 ===== -->
<div class="card empty om-empty" id="om-empty" hidden>
  <svg class="empty-icon" aria-hidden="true"><use href="#i-inbox"/></svg>
  <p class="empty-text">未找到匹配的订单</p>
  <p class="empty-sub">试试调整搜索关键词或筛选条件</p>
</div>

<!-- 给停靠的新增按钮留出高度，避免遮住最后一张卡片 -->
<div class="fab-space" aria-hidden="true"></div>

<!-- ===== 新增订单 ===== -->
<div class="fab-dock">
  <button type="button" class="fab" id="om-create" aria-haspopup="dialog" aria-label="新增订单">
    <svg aria-hidden="true"><use href="#i-plus"/></svg>
    <span>新增订单</span>
  </button>
</div>
