<svg xmlns="http://www.w3.org/2000/svg" style="display:none">
<!--
  PPTransfer H5 · 图标 sprite
  ---------------------------------------------------------------
  Solar 风格线性图标，统一 24×24 网格、1.8 描边、圆头圆角。
  颜色一律 currentColor —— 图标本身不携带颜色，配色由外层决定
  （.tile[data-tone] / .tab[aria-selected] / .pill[data-tone] 等），
  这正是原方案 53 张彩色 PNG 能收敛为 30 个 symbol 的原因。

  用法：<svg class="..." aria-hidden="true"><use href="#i-home"/></svg>
  装饰性图标必须带 aria-hidden，否则读屏会念出无意义的图形。
-->

