  <script data-bundle-from="js/pages/rmb-exchange-withdraw.js">
  /* ===== 脚本 · js/pages/rmb-exchange-withdraw.js ===== */
  /* ============================================================
     pages/rmb-exchange-withdraw.js · 结汇提现
     ------------------------------------------------------------
     职责：金额双向计算、提现至单选、结汇提现账户搜索选择、
           分步切换、确认弹层、结果页。
     金额规则：
       基础手续费 = 提现金额 × 0.10%
       到账金额   = 提现金额 − 手续费
       反算       = 到账金额 ÷ (1 − 0.10%)
     两个输入框「最后编辑的为准」：改提现金额 → 刷到账金额；
     改到账金额 → 反算提现金额。手续费未定前显示 “-- CNH”。
     弹层统一走 PP.ui（sheet / confirm / toast），页面不写遮罩结构。
     ============================================================ */
  (function (PP) {
    'use strict'

    var dom = PP.dom

    /** 手续费率 0.10% */
    var FEE_RATE = 0.001
    /** 可提现金额（CNH，演示数据） */
    var AVAILABLE = 997

    /** 结汇提现账户（演示数据；sub 用于搜索：账户名称/备注名/卡号/银行名称） */
    var ACCOUNTS = [
      { value: 'cmb-8888', title: '招商银行 · 6225 **** 8888', sub: '顾人 · 备注：主账户' },
      { value: 'icbc-6301', title: '工商银行 · 6212 **** 6301', sub: '对公账户 · 备注：货款' },
      { value: 'ccb-2044', title: '建设银行 · 6217 **** 2044', sub: '顾人 · 备注：备用' },
      { value: 'boc-7715', title: '中国银行 · 6216 **** 7715', sub: '财务部 · 备注：结算' },
      { value: 'comm-0913', title: '交通银行 · 6222 **** 0913', sub: '顾人 · 备注：供应商付款' },
      { value: 'spdb-3308', title: '浦发银行 · 6225 **** 3308', sub: '极光科技 · 备注：对私' }
    ]

    var TO_LABELS = { company: '本公司', supplier: '供应商' }

    /** 当前页面实例的可变状态；未挂载时为 null */
    var view = null

    /* ---------------------------------------------- 工具 */

    /** '997.00' —— 提现相关金额一律两位小数 */
    function num(n) {
      return PP.format.fmtNum(n, 2)
    }

    /** 保留两位的合法浮点 */
    function round2(n) {
      return Math.round(n * 100) / 100
    }

    /** 金额输入只保留数字与一个小数点 */
    function sanitize(raw) {
      var s = String(raw).replace(/[^\d.]/g, '')
      var dot = s.indexOf('.')
      if (dot >= 0) s = s.slice(0, dot + 1) + s.slice(dot + 1).replace(/\./g, '')
      return s
    }

    function amountValue() { return parseFloat(view.amount) || 0 }
    function arrivalValue() { return parseFloat(view.arrival) || 0 }
    function feeValue() { return round2(amountValue() * FEE_RATE) }

    function canNext() {
      var amount = amountValue()
      return amount > 0 && amount <= AVAILABLE &&
        arrivalValue() > 0 && !!view.account
    }

    /** 下一步不可用时的原因，用于点击置灰按钮后的 toast */
    function nextBlocker() {
      if (amountValue() <= 0) return '请输入提现金额'
      if (amountValue() > AVAILABLE) return '超过可提现金额 ' + num(AVAILABLE) + ' CNH'
      if (!view.account) return '请选择结汇提现账户'
      if (arrivalValue() <= 0) return '请确认到账金额'
      return ''
    }

    /* ---------------------------------------------- 渲染 */

    function refresh() {
      if (!view || !view.root) return

      // 手续费：金额未填时保持截图中的 “-- CNH”
      dom.qs('#fee-value', view.root).textContent =
        amountValue() > 0 ? num(feeValue()) + ' CNH' : '-- CNH'

      var bad = view.amount !== '' && amountValue() > AVAILABLE
      var input = dom.qs('#amount-input', view.root)
      var err = dom.qs('#amount-error', view.root)
      input.setAttribute('aria-invalid', bad ? 'true' : 'false')
      err.hidden = !bad
      err.textContent = bad ? '超过可提现金额 ' + num(AVAILABLE) + ' CNH' : ''

      dom.qs('#next-btn', view.root)
        .setAttribute('aria-disabled', canNext() ? 'false' : 'true')
      dom.qs('#submit-btn', view.root)
        .setAttribute('aria-disabled', view.pwd.length === 6 ? 'false' : 'true')
    }

    /* ---------------------------------------------- 账户搜索选择 */

    function pickAccount() {
      PP.ui.searchPicker({
        title: '选择结汇提现账户',
        placeholder: '账户名称/备注名/卡号/银行名称',
        value: view.account,
        items: ACCOUNTS
      }).then(function (value) {
        if (!value || !view) return
        view.account = value
        ACCOUNTS.forEach(function (a) {
          if (a.value !== value) return
          var el = dom.qs('#account-value', view.root)
          el.textContent = a.title
          el.classList.remove('is-placeholder')
        })
        dom.haptic()
        refresh()
      })
    }

    /* ---------------------------------------------- 分步 */

    function syncSteps() {
      dom.qsa('.wz-step', view.root).forEach(function (li, i) {
        li.setAttribute('data-tone', i < view.step ? 'success' : (i === view.step ? 'blue' : 'neutral'))
        if (i === view.step) li.setAttribute('aria-current', 'step')
        else li.removeAttribute('aria-current')

        var dot = dom.qs('.wz-dot', li)
        if (i < view.step) dom.setHTML(dot, dom.raw('<svg aria-hidden="true"><use href="#i-check"/></svg>'))
        else dot.textContent = String(i + 1)
      })
    }

    function goStep(step) {
      view.step = step
      dom.qsa('.wizard-step', view.root).forEach(function (el) {
        el.hidden = Number(el.getAttribute('data-step')) !== step
      })
      syncSteps()
      // 步骤切换后回到顶部，避免停在上一屏的滚动位置
      var body = dom.qs('#app-body')
      if (body) body.scrollTop = 0
    }

    /** 进入确认步骤前，把步骤 1 的选择同步到确认卡 */
    function syncConfirm() {
      dom.qs('#confirm-amount', view.root).textContent = num(amountValue()) + ' CNH'
      dom.qs('#confirm-to', view.root).textContent = TO_LABELS[view.to]
      var acct = ACCOUNTS.filter(function (a) { return a.value === view.account })[0]
      dom.qs('#confirm-account', view.root).textContent = acct ? acct.title : '--'
      dom.qs('#confirm-fee', view.root).textContent = num(feeValue()) + ' CNH'
      dom.qs('#confirm-arrival', view.root).textContent = num(arrivalValue()) + ' CNH'
      var memoRow = dom.qs('#confirm-memo-row', view.root)
      memoRow.hidden = !view.memo
      dom.qs('#confirm-memo', view.root).textContent = view.memo
    }

    /* ---------------------------------------------- 提交 */

    function stamp() {
      var d = new Date()
      function pad(n) { return String(n).padStart(2, '0') }
      return String(d.getFullYear()) + pad(d.getMonth() + 1) + pad(d.getDate()) +
        pad(d.getHours()) + pad(d.getMinutes()) + pad(d.getSeconds())
    }

    function submit() {
      view.orderNo = 'EXC' + stamp()
      dom.qs('#result-amount', view.root).textContent = num(amountValue()) + ' CNH'
      dom.qs('#result-arrival', view.root).textContent = num(arrivalValue()) + ' CNH'
      dom.qs('#result-order-no', view.root).textContent = view.orderNo

      var pwd = dom.qs('#pwd-input', view.root)
      pwd.value = ''
      view.pwd = ''

      goStep(2)
      dom.haptic()
    }

    /* ---------------------------------------------- 页面定义 */

    PP.definePage('rmb-exchange-withdraw', {
      mount: function (root, ctx) {
        view = {
          root: root,
          step: 0,
          amount: '',
          arrival: '',
          to: 'company',
          account: null,
          memo: '',
          pwd: '',
          orderNo: ''
        }

        var offs = []
        function listen(type, sel, fn) { offs.push(dom.on(root, type, sel, fn)) }

        /* -------- 金额双向计算 -------- */

        // 改提现金额 → 重算到账金额
        listen('input', '#amount-input', function (e, el) {
          var clean = sanitize(el.value)
          if (clean !== el.value) el.value = clean
          view.amount = clean
          var amount = amountValue()
          var arrival = amount > 0 ? String(round2(amount * (1 - FEE_RATE))) : ''
          view.arrival = arrival
          dom.qs('#arrival-input', root).value = arrival
          refresh()
        })

        // 改到账金额 → 反算提现金额
        listen('input', '#arrival-input', function (e, el) {
          var clean = sanitize(el.value)
          if (clean !== el.value) el.value = clean
          view.arrival = clean
          var arrival = arrivalValue()
          var amount = arrival > 0 ? String(round2(arrival / (1 - FEE_RATE))) : ''
          view.amount = amount
          dom.qs('#amount-input', root).value = amount
          refresh()
        })

        listen('click', '#fill-all', function () {
          view.amount = String(AVAILABLE)
          dom.qs('#amount-input', root).value = view.amount
          var arrival = String(round2(AVAILABLE * (1 - FEE_RATE)))
          view.arrival = arrival
          dom.qs('#arrival-input', root).value = arrival
          dom.haptic()
          refresh()
        })

        /* -------- 提现至单选 -------- */

        listen('click', '.radio-pill', function (e, el) {
          if (el.getAttribute('aria-checked') === 'true') return
          dom.qsa('.radio-pill', root).forEach(function (b) {
            b.setAttribute('aria-checked', b === el ? 'true' : 'false')
          })
          view.to = el.getAttribute('data-value')
          dom.haptic()
        })

        /* -------- 结汇提现账户 -------- */

        listen('click', '#account-btn', pickAccount)

        /* -------- 分步与提交 -------- */

        listen('click', '#next-btn', function () {
          var blocker = nextBlocker()
          if (blocker) {
            PP.ui.toast(blocker)
            return
          }
          syncConfirm()
          goStep(1)
        })

        listen('click', '#prev-btn', function () { goStep(0) })

        listen('input', '#memo-input', function (e, el) {
          view.memo = el.value.trim()
        })

        listen('input', '#pwd-input', function (e, el) {
          view.pwd = el.value
          refresh()
        })

        listen('click', '#submit-btn', function () {
          if (view.pwd.length !== 6) {
            PP.ui.toast('请输入 6 位交易密码')
            return
          }
          PP.ui.confirm({
            title: '确认提交',
            content: '本次结汇提现 ' + num(amountValue()) + ' CNH，到账 ' +
              num(arrivalValue()) + ' CNH，确认提交？',
            confirmText: '确认提交'
          }).then(function (ok) {
            if (ok && view) submit()
          })
        })

        /* -------- 初始状态 -------- */
        goStep(0)
        refresh()

        ctx.onCleanup(function () {
          offs.forEach(function (off) { off() })
          view = null
        })
      }
    })
  })((window.PP = window.PP || {}))
  </script><!-- js/pages/add-rmb-exchange-account.js -->
  <script data-bundle-from="js/pages/add-rmb-exchange-account.js">
  /* ===== 脚本 · js/pages/add-rmb-exchange-account.js ===== */
  /* ============================================================
     pages/add-rmb-exchange-account.js · 添加人民币结汇账户
     ------------------------------------------------------------
     参考 desktop 版 pages/add_rmb_exchange_account.html：
       步骤 1 账户所属 / 账户类型 / 开户地区 / 账户名称 / 银行账号 /
              银行名称 / 别名，按 所属 × 类型 动态显示条件字段
       步骤 2 授权声明（回填步骤 1 的账户信息）+ 交易密码 + 同意勾选
       步骤 3 申请成功
     开户地区是系统固定值（中国内地），只读展示、不参与校验也不提供选择器。
     银行名称按类型分两种采集方式：企业账户用 searchPicker 手选；个人账户不可填写，
     由银行账号按卡 BIN 前缀自动返显（见 CARD_BINS / detectBank）。
     条件字段（见 RULES）：
       personal            仅个人账户        → I 类银行账户卡提示
       enterprise          仅企业账户        → 开户行支行号（CNAPS 行号，必填）
       supplier-enterprise 供应商的企业账户  → 法人名称 / 法人身份证号（双双选填，
                                              填其一则另一必填，见 syncLegalRequired）
       supplier-personal   供应商的个人账户  → 公司名称 / 统一信用代码（选填）/
                                              收款人身份证号（必填）/ 历史采购合同（选填）
     即企业账户一律填开户行支行号，扩展材料只对供应商账户收集。
     切换所属/类型只改 data-only 行的显隐，已填值留在 DOM 里，来回切换不丢；
     例外：银行来源随类型而变（企业手选 ↔ 个人自动返显），切类型时银行与支行清空重采。
     校验按同一套规则决定是否检查条件字段。
     弹层统一走 PP.ui（picker / searchPicker / toast）。
     ============================================================ */
  (function (PP) {
    'use strict'

    var dom = PP.dom

    /** 开户地区：系统固定值，只读展示 */
    var REGION_FIXED = '中国内地'

    /** 银行（演示数据，sub 参与搜索：银行名称 / CNAPS 行号） */
    var BANKS = [
      { value: '招商银行', title: '招商银行', sub: 'CNAPS 308584000013' },
      { value: '工商银行', title: '工商银行', sub: 'CNAPS 102100099996' },
      { value: '建设银行', title: '建设银行', sub: 'CNAPS 105100000017' },
      { value: '中国银行', title: '中国银行', sub: 'CNAPS 104100000004' },
      { value: '农业银行', title: '农业银行', sub: 'CNAPS 103100000026' },
      { value: '交通银行', title: '交通银行', sub: 'CNAPS 301290000007' },
      { value: '浦发银行', title: '浦发银行', sub: 'CNAPS 310290000013' },
      { value: '中信银行', title: '中信银行', sub: 'CNAPS 302100011000' },
      { value: '民生银行', title: '民生银行', sub: 'CNAPS 305100000013' },
      { value: '兴业银行', title: '兴业银行', sub: 'CNAPS 309391000011' }
    ]

    /** 依所选银行生成开户支行（演示数据；CNAPS 前缀沿用银行自身的行号） */
    function branchesFor(bankName) {
      var bank = null
      BANKS.forEach(function (b) { if (b.value === bankName) bank = b })
      var base = (bank && /\d{12}/.exec(bank.sub)) ? String(/\d{12}/.exec(bank.sub)[0]) : '308584000013'
      var head = base.slice(0, 9)
      return [
        { value: head + '013', title: bankName + '深圳前海支行', sub: 'CNAPS ' + head + '013' },
        { value: head + '046', title: bankName + '深圳南山支行', sub: 'CNAPS ' + head + '046' },
        { value: head + '091', title: bankName + '深圳福田支行', sub: 'CNAPS ' + head + '091' }
      ]
    }

    /** 演示数据：卡 BIN 前缀 → 银行名称。个人账户按银行账号自动识别开户行用 */
    var CARD_BINS = [
      { prefix: '6222', bank: '工商银行' },
      { prefix: '6225', bank: '招商银行' },
      { prefix: '6217', bank: '建设银行' },
      { prefix: '6216', bank: '中国银行' },
      { prefix: '6228', bank: '农业银行' },
      { prefix: '6214', bank: '交通银行' },
      { prefix: '6215', bank: '浦发银行' },
      { prefix: '6226', bank: '中信银行' },
      { prefix: '6221', bank: '民生银行' },
      { prefix: '6229', bank: '兴业银行' }
    ]

    /** 按卡 BIN 前缀识别开户银行；账号不足 6 位或匹配不上时返回 '' */
    function detectBank(acctNo) {
      var n = String(acctNo).replace(/\D/g, '')
      if (n.length < 6) return ''
      var hit = ''
      CARD_BINS.forEach(function (b) {
        if (!hit && n.indexOf(b.prefix) === 0) hit = b.bank
      })
      return hit
    }

    /** 当前页面实例的可变状态；未挂载时为 null */
    var view = null

    /* ---------------------------------------------- 工具 */

    function val(sel) {
      var el = dom.qs(sel, view.root)
      return el ? el.value.trim() : ''
    }

    /** 去掉 4 位分组时插入的空格，得到原始账号 */
    function rawNum(sel) {
      return val(sel).replace(/\s+/g, '')
    }

    /** 长卡号按 4 位分组展示，如 6222 0202 0012 3456 789 */
    function group4(s) {
      return s.replace(/(\d{4})(?=\d)/g, '$1 ')
    }

    function setText(sel, text) {
      var el = dom.qs(sel, view.root)
      if (el) el.textContent = text
    }

    /** 账户所属 / 账户类型 */
    function isSupplier() { return view.owner === 'supplier' }
    function isPersonal() { return view.type === 'personal' }

    /**
     * 条件字段规则：data-only 的取值 → 显示条件。
     *   企业账户一律要填开户行支行号；扩展材料只对供应商账户收集。
     */
    var RULES = {
      personal: function () { return isPersonal() },
      enterprise: function () { return !isPersonal() },
      'supplier-enterprise': function () { return isSupplier() && !isPersonal() },
      'supplier-personal': function () { return isSupplier() && isPersonal() }
    }

    /** 给每张分组卡的最后一行收掉分隔线（显隐会改变「最后一行」是谁） */
    function markLastRow() {
      dom.qsa('.wizard-card', view.root).forEach(function (card) {
        var rows = dom.qsa('.frow', card)
        var shown = rows.filter(function (r) { return !r.hidden })
        rows.forEach(function (r) { r.classList.remove('frow--last') })
        if (shown.length) shown[shown.length - 1].classList.add('frow--last')
      })
    }

    function syncConditionalRows() {
      Object.keys(RULES).forEach(function (key) {
        var show = RULES[key]()
        dom.qsa('[data-only="' + key + '"]', view.root).forEach(function (el) {
          el.hidden = !show
        })
      })
      markLastRow()

      /* 账户名称占位文案按类型切换（沿用 desktop 版细节） */
      var nameInput = dom.qs('#add-acct-name', view.root)
      if (nameInput) {
        nameInput.placeholder = isPersonal()
          ? '请输入'
          : '如：深圳市极光贸易有限公司'
      }

      /* 个人账户的银行名称由银行账号返显，切换类型后立刻按当前账号重算一次 */
      if (isPersonal()) syncAutoBank()

      /* 法人信息的必填标记随另一字段的填写情况变化 */
      syncLegalRequired()
    }

    /* ---------------- 法人信息（供应商企业账户）：填其一则另一必填 ---------------- */

    /** 把某字段的标签在「*（必填）」与「选填」之间切换 */
    function setRequiredMark(sel, required) {
      var field = dom.qs(sel, view.root)
      if (!field) return
      var row = field.closest('.frow')
      if (!row) return
      var req = dom.qs('.frow-req', row)
      var optional = dom.qs('.frow-optional', row)
      if (req) req.hidden = !required
      if (optional) optional.hidden = required
    }

    /** 法人名称 / 法人身份证号：都空则都选填，任一有值则另一必填 */
    function syncLegalRequired() {
      if (!isSupplier() || isPersonal()) return
      var byName = !!val('#add-legal-name')
      var byId = !!val('#add-legal-id')
      setRequiredMark('#add-legal-name', byId)
      setRequiredMark('#add-legal-id', byName)
    }

    /** 银行来源随类型切换：清掉上一次采集的银行与支行，避免取值与可见控件对不上 */
    function resetBank() {
      view.bank = ''
      view.branch = ''
      view.branchTitle = ''
      var picked = dom.qs('#add-bank-value', view.root)
      if (picked) {
        picked.textContent = '搜索银行名称 / CNAPS 行号'
        picked.classList.add('is-placeholder')
      }
      var auto = dom.qs('#add-bank-auto', view.root)
      if (auto) auto.value = ''
      var branch = dom.qs('#add-branch-value', view.root)
      if (branch) {
        branch.textContent = '请先选择开户银行'
        branch.classList.add('is-placeholder')
      }
    }

    /** 个人账户：银行名称不可填写，按银行账号自动返显（识别不出则留空） */
    function syncAutoBank() {
      var name = detectBank(rawNum('#add-acct-no'))
      view.bank = name
      /* 账号变了，先前识别/选择出的支行不再适用 */
      view.branch = ''
      view.branchTitle = ''
      var auto = dom.qs('#add-bank-auto', view.root)
      if (auto) auto.value = name
      var branch = dom.qs('#add-branch-value', view.root)
      if (branch) {
        branch.textContent = '请先选择开户银行'
        branch.classList.add('is-placeholder')
      }
    }

    /* ---------------------------------------------- 行内校验 */

    /** 给字段所在 .frow 标红并滚动定位；返回行元素 */
    function showError(sel) {
      var el = dom.qs(sel, view.root)
      if (!el) return null
      var row = el.closest('.frow')
      if (row) row.classList.add('is-error')
      if (el.scrollIntoView) el.scrollIntoView({ block: 'center', behavior: 'smooth' })
      if (el.focus) el.focus({ preventScroll: true })
      return row
    }

    /** 任何输入 / 选择都会清掉所在行的错误态 */
    function clearRowError(e, el) {
      var row = el.closest('.frow')
      if (row) row.classList.remove('is-error')
    }

    /** 步骤 1 的必填校验：返回第一个缺失项 { msg, sel } */
    function firstMissing() {
      if (!val('#add-acct-name')) return { msg: '请填写账户名称', sel: '#add-acct-name' }
      if (!rawNum('#add-acct-no')) return { msg: '请填写银行账号', sel: '#add-acct-no' }
      if (!view.bank) {
        return isPersonal()
          ? { msg: '银行账号有误，无法识别开户银行', sel: '#add-acct-no' }
          : { msg: '请选择银行名称', sel: '#add-bank-btn' }
      }
      /* 企业账户一律要选开户行支行号 */
      if (!isPersonal() && !view.branch) {
        return { msg: '请选择开户行支行号', sel: '#add-branch-btn' }
      }
      /* 供应商企业账户的法人信息：两项都选填，但填其一则另一必填 */
      if (isSupplier() && !isPersonal()) {
        var legalName = val('#add-legal-name')
        var legalId = val('#add-legal-id')
        if (legalName && !legalId) return { msg: '请填写法人身份证号', sel: '#add-legal-id' }
        if (legalId && !legalName) return { msg: '请填写法人名称', sel: '#add-legal-name' }
      }
      /* 公司名称 / 统一信用代码为选填（自然人供应商不一定有），这里只把关身份证号 */
      if (isSupplier() && isPersonal() && !val('#add-id-card')) {
        return { msg: '请填写收款人身份证号', sel: '#add-id-card' }
      }
      return null
    }

    /** 把步骤 1 的账户信息同步到授权声明 */
    function syncAuth() {
      setText('#add-auth-bank', view.bank || '—')
      setText('#add-auth-name', val('#add-acct-name') || '—')
      setText('#add-auth-no', group4(rawNum('#add-acct-no')) || '—')
    }

    /* ---------------------------------------------- 列表渲染 */

    function fileRow(file, index) {
      var size = file.size > 1024 * 1024
        ? (file.size / 1024 / 1024).toFixed(1) + 'MB'
        : Math.ceil(file.size / 1024) + 'KB'
      return (
        '<li class="upload-item">' +
        '<svg class="upload-icon" aria-hidden="true"><use href="#i-doc"/></svg>' +
        '<span class="upload-name truncate">' + dom.esc(file.name) + '</span>' +
        '<span class="upload-size">' + dom.esc(size) + '</span>' +
        '<button type="button" class="upload-remove" data-index="' + index + '"' +
        ' aria-label="移除 ' + dom.esc(file.name) + '">' +
        '<svg aria-hidden="true"><use href="#i-close"/></svg>' +
        '</button>' +
        '</li>'
      )
    }

    function renderFiles() {
      var list = dom.qs('#add-upload-list', view.root)
      if (!list) return
      dom.setHTML(list, dom.raw(view.files.map(fileRow).join('')))
    }

    /* ---------------------------------------------- 分步 */

    function syncSteps() {
      dom.qsa('.wz-step', view.root).forEach(function (li, i) {
        li.setAttribute('data-tone', i < view.step ? 'success' : (i === view.step ? 'blue' : 'neutral'))
        if (i === view.step) li.setAttribute('aria-current', 'step')
        else li.removeAttribute('aria-current')

        var dot = dom.qs('.wz-dot', li)
        if (i < view.step) dom.setHTML(dot, dom.raw('<svg aria-hidden="true"><use href="#i-check"/></svg>'))
        else dot.textContent = String(i + 1)
      })
    }

    function goStep(step) {
      view.step = step
      dom.qsa('.wizard-step', view.root).forEach(function (el) {
        el.hidden = Number(el.getAttribute('data-step')) !== step
      })
      syncSteps()
      var body = dom.qs('#app-body')
      if (body) body.scrollTop = 0
    }

    function refresh() {
      if (!view || !view.root) return
      dom.qs('#add-confirm-btn', view.root)
        .setAttribute('aria-disabled', (view.pwd.length === 6 && view.agreed) ? 'false' : 'true')
    }

    /* ---------------------------------------------- 选择器 */

    function pickBank() {
      PP.ui.searchPicker({
        title: '选择银行名称',
        placeholder: '银行名称 / CNAPS 行号',
        value: view.bank,
        items: BANKS
      }).then(function (value) {
        if (!value || !view) return
        view.bank = value
        var el = dom.qs('#add-bank-value', view.root)
        el.textContent = value
        el.classList.remove('is-placeholder')
        /* 换银行后原支行不再有效，重置支行选择 */
        view.branch = ''
        view.branchTitle = ''
        var branch = dom.qs('#add-branch-value', view.root)
        branch.textContent = '请选择开户支行'
        branch.classList.add('is-placeholder')
      })
    }

    /** 支行号：依所选银行搜索选择（CNAPS 行号参与检索） */
    function pickBranch() {
      if (!view.bank) {
        PP.ui.toast('请先选择银行名称')
        showError('#add-bank-btn')
        return
      }
      PP.ui.searchPicker({
        title: '选择开户支行',
        placeholder: '支行名称 / CNAPS 行号',
        value: view.branch,
        items: branchesFor(view.bank)
      }).then(function (value) {
        if (!value || !view) return
        view.branch = value
        var items = branchesFor(view.bank)
        items.forEach(function (it) {
          if (String(it.value) === String(value)) view.branchTitle = it.title
        })
        var el = dom.qs('#add-branch-value', view.root)
        el.textContent = view.branchTitle || value
        el.classList.remove('is-placeholder')
      })
    }

    /* ---------------------------------------------- 页面定义 */

    PP.definePage('add-rmb-exchange-account', {
      mount: function (root, ctx) {
        view = {
          root: root,
          step: 0,
          owner: 'company',
          type: 'enterprise',
          bank: '',
          branch: '',
          branchTitle: '',
          files: [],
          pwd: '',
          agreed: false
        }

        var offs = []
        function listen(type, sel, fn) { offs.push(dom.on(root, type, sel, fn)) }

        /* -------- 行内错误态：任何输入/选择都清掉所在行的标红 -------- */

        listen('input', '.field-input', clearRowError)
        listen('click', '.select-field', clearRowError)
        listen('click', '.radio-pill', clearRowError)

        /* -------- 单选：账户所属 / 账户类型 -------- */

        listen('click', '[data-owner]', function (e, el) {
          if (el.getAttribute('aria-checked') === 'true') return
          dom.qsa('[data-owner]', root).forEach(function (b) {
            b.setAttribute('aria-checked', b === el ? 'true' : 'false')
          })
          view.owner = el.getAttribute('data-owner')
          syncConditionalRows()
        })

        listen('click', '[data-type]', function (e, el) {
          if (el.getAttribute('aria-checked') === 'true') return
          dom.qsa('[data-type]', root).forEach(function (b) {
            b.setAttribute('aria-checked', b === el ? 'true' : 'false')
          })
          view.type = el.getAttribute('data-type')
          /* 企业手选 / 个人自动返显是两套来源，切换时清空重采 */
          resetBank()
          syncConditionalRows()
        })

        /* -------- 银行名称 / 开户行支行号 -------- */

        listen('click', '#add-bank-btn', pickBank)
        listen('click', '#add-branch-btn', pickBranch)

        /* -------- 银行账号：失焦时按 4 位分组展示，存值始终去空格 -------- */

        listen('input', '#add-acct-no', function (e, el) {
          el.value = el.value.replace(/[^\d\s]/g, '')
          /* 个人账户的银行名称跟着账号走 */
          if (isPersonal()) syncAutoBank()
        })
        listen('focusout', '#add-acct-no', function (e, el) {
          el.value = group4(el.value.replace(/\s+/g, ''))
        })

        /* -------- 法人信息：填其一则另一变必填 -------- */

        listen('input', '#add-legal-name', syncLegalRequired)
        listen('input', '#add-legal-id', syncLegalRequired)

        /* -------- 历史采购合同上传 -------- */

        listen('change', '#add-contract-file', function (e, el) {
          Array.prototype.slice.call(el.files || []).forEach(function (f) {
            view.files.push(f)
          })
          el.value = ''
          renderFiles()
        })

        listen('click', '.upload-remove', function (e, el) {
          view.files.splice(Number(el.getAttribute('data-index')), 1)
          renderFiles()
        })

        /* -------- 分步 -------- */

        listen('click', '#add-next-btn', function () {
          var missing = firstMissing()
          if (missing) {
            PP.ui.toast(missing.msg)
            showError(missing.sel)
            return
          }
          syncAuth()
          goStep(1)
        })

        listen('click', '#add-prev-btn', function () { goStep(0) })

        listen('input', '#add-trade-pwd', function (e, el) {
          view.pwd = el.value
          refresh()
        })

        listen('change', '#add-agree', function (e, el) {
          view.agreed = el.checked
          refresh()
        })

        listen('click', '#add-confirm-btn', function () {
          if (view.pwd.length !== 6) {
            PP.ui.toast('请输入 6 位交易密码')
            return
          }
          if (!view.agreed) {
            PP.ui.toast('请阅读并同意授权声明')
            return
          }
          setText('#add-result-name', val('#add-acct-name'))
          setText('#add-result-no', PP.format.maskAccount(rawNum('#add-acct-no')))
          setText('#add-result-region', REGION_FIXED)
          goStep(2)
          dom.haptic()
        })

        /* -------- 初始状态 -------- */
        syncConditionalRows()
        renderFiles()
        goStep(0)
        refresh()

        ctx.onCleanup(function () {
          offs.forEach(function (off) { off() })
          view = null
        })
      }
    })
  })((window.PP = window.PP || {}))

  <script data-bundle-from="js/pages/rmb-exchange-records.js">
  /* ===== 脚本 · js/pages/rmb-exchange-records.js ===== */
  /* ============================================================
     pages/rmb-exchange-records.js · 结汇记录
     ------------------------------------------------------------
     职责：按状态分段过滤结汇记录（4 条演示数据）、回填汇总金额、
     渲染记录列表并打开详情弹层。
     演示数据放在文件顶部的大写常量里，字段名与小程序源码保持一致。

     汇总口径与小程序一致：失败记录既不计入汇出金额，也不计入手续费合计。
     ============================================================ */
  (function (PP) {
    'use strict'

    var dom = PP.dom

    /** 结汇状态 → 徽章色调（对应小程序 statusClass 的 蓝 / 绿 / 红） */
    var STATUS_TONE = { '处理中': 'blue', '已完成': 'success', '失败': 'danger' }

    /** 结汇记录（演示数据，源 rmb-exchange-records.js 的 4 条原样迁入） */
    var RECORDS = [
      {
        id: 'r1', no: 'EXC20260702103012', time: '2026-07-02 10:30:12', type: '结汇提现',
        bankName: '招商银行 · 6225 **** 8888', accountName: '深圳市鹏程贸易有限公司',
        accountNo: '6225880012348888', accountRemark: '主结算账户',
        pay: 120000, fee: 120, out: 119880, status: '处理中', statusClass: 'blue'
      },
      {
        id: 'r2', no: 'EXC20260628154400', time: '2026-06-28 15:44:00', type: '结汇提现',
        bankName: '中国银行 · 6217 **** 3021', accountName: '深圳市鹏程贸易有限公司',
        accountNo: '6217001234563021', accountRemark: '备用账户',
        pay: 86000, fee: 86, out: 85914, status: '已完成', statusClass: 'emerald'
      },
      {
        id: 'r3', no: 'EXC20260625091833', time: '2026-06-25 09:18:33', type: '结汇提现',
        bankName: '招商银行 · 6225 **** 8888', accountName: '深圳市鹏程贸易有限公司',
        accountNo: '6225880012348888', accountRemark: '主结算账户',
        pay: 52000, fee: 52, out: 51948, status: '已完成', statusClass: 'emerald'
      },
      {
        id: 'r4', no: 'EXC20260620171205', time: '2026-06-20 17:12:05', type: '结汇提现',
        bankName: '工商银行 · 6222 **** 7745', accountName: '深圳市鹏程贸易有限公司',
        accountNo: '6222021234567745', accountRemark: '',
        pay: 30000, fee: 30, out: 29970, status: '失败', statusClass: 'red'
      }
    ]

    /** 状态分段（key 与小程序 statusTabs 一致） */
    var STATUS_KEYS = { all: '', processing: '处理中', done: '已完成', failed: '失败' }

    /** 当前页面实例的可变状态；未挂载时为 null */
    var view = null

    /* ---------------------------------------------- 数据 */

    function decorate(r) {
      return Object.assign({}, r, {
        statusTone: STATUS_TONE[r.status] || 'neutral',
        payText: PP.format.fmtNum(r.pay),
        feeText: PP.format.fmtNum(r.fee),
        outText: PP.format.fmtNum(r.out)
      })
    }

    function matchStatus(r) {
      var want = STATUS_KEYS[view.status]
      return !want || r.status === want
    }

    /* ---------------------------------------------- 渲染 */

    function rowHTML(r) {
      return (
        '<li class="rec">' +
          '<button type="button" class="rec-main" data-id="' + dom.esc(r.id) + '"' +
            ' aria-label="查看结汇记录 ' + dom.esc(r.no) + ' 的详情">' +
            '<span class="rec-head">' +
              '<span class="rec-no">' + dom.esc(r.no) + '</span>' +
              '<span class="pill" data-tone="' + r.statusTone + '">' + dom.esc(r.status) + '</span>' +
            '</span>' +
            '<span class="rec-line">' +
              '<span class="rec-label">提现账户</span>' +
              '<span class="rec-value">' + dom.esc(r.bankName) + '</span>' +
            '</span>' +
            '<span class="rec-line">' +
              '<span class="rec-label">提现时间</span>' +
              '<span class="rec-value num">' + dom.esc(r.time) + '</span>' +
            '</span>' +
            '<span class="rec-foot">' +
              '<span class="rec-amount">' +
                '<span class="rec-amount-label">付款金额</span>' +
                '<span class="rec-amount-value num" data-amount>' + dom.esc(r.payText) + ' CNH</span>' +
              '</span>' +
              '<span class="rec-amount">' +
                '<span class="rec-amount-label">汇出金额</span>' +
                '<span class="rec-amount-value num rec-amount-value--out" data-amount>' +
                  dom.esc(r.outText) + ' CNH</span>' +
              '</span>' +
            '</span>' +
          '</button>' +
        '</li>'
      )
    }

    function applyFilter() {
      var rows = view.list.filter(matchStatus)
      // 失败记录不计入汇总（与小程序口径一致）
      var total = rows.reduce(function (s, r) { return s + (r.status === '失败' ? 0 : r.out) }, 0)
      var fee = rows.reduce(function (s, r) { return s + (r.status === '失败' ? 0 : r.fee) }, 0)

      var listEl = dom.qs('#rx-list', view.root)
      dom.renderList(listEl, rows, rowHTML)
      dom.toggle(dom.qs('#rx-card', view.root), rows.length > 0)
      dom.toggle(dom.qs('#rx-empty', view.root), rows.length === 0)
      dom.qs('#rx-count', view.root).textContent = '共 ' + rows.length + ' 条记录'
      dom.qs('#rx-total', view.root).textContent = PP.format.fmtNum(total) + ' CNH'
      dom.qs('#rx-fee', view.root).textContent = PP.format.fmtNum(fee) + ' CNH'

      view.rows = rows
    }

    /* ---------------------------------------------- 详情弹层 */

    function detailRow(label, valueHTML, extraClass) {
      return '<div class="detail-row">' +
        '<span class="detail-label">' + dom.esc(label) + '</span>' +
        '<span class="detail-value' + (extraClass ? ' ' + extraClass : '') + '">' + valueHTML + '</span>' +
        '</div>'
    }

    function detailBody(r) {
      return (
        detailRow('交易流水号', dom.esc(r.no), 'num') +
        detailRow('时间', dom.esc(r.time)) +
        detailRow('类型', dom.esc(r.type)) +
        detailRow('提现账户', dom.esc(r.bankName)) +
        detailRow('账号名称', dom.esc(r.accountName)) +
        detailRow('账号', dom.esc(r.accountNo), 'num') +
        detailRow('提现账号备注', dom.esc(r.accountRemark)) +
        detailRow('付款金额', dom.esc(r.payText) + ' CNH', 'num') +
        detailRow('手续费', dom.esc(r.feeText) + ' CNH', 'num') +
        detailRow('汇出金额', dom.esc(r.outText) + ' CNH', 'num rx-strong') +
        detailRow('状态', dom.esc(r.status))
      )
    }

    function openDetail(r) {
      PP.ui.sheet({
        title: '结汇记录详情',
        body: detailBody(r)
      })
    }

    /* ---------------------------------------------- 页面定义 */

    PP.definePage('rmb-exchange-records', {
      mount: function (root, ctx) {
        view = {
          root: root,
          list: RECORDS.map(decorate),
          rows: [],
          status: 'all'
        }

        var offs = [
          dom.on(root, 'click', '[data-key]', function (e, el) {
            var key = el.getAttribute('data-key')
            if (key === view.status) return
            view.status = key
            dom.qsa('[data-key]', root).forEach(function (btn) {
              btn.setAttribute('aria-selected', btn.getAttribute('data-key') === key ? 'true' : 'false')
            })
            applyFilter()
          }),

          dom.on(root, 'click', '.rec-main', function (e, el) {
            var id = el.getAttribute('data-id')
            var row = view.rows.filter(function (r) { return r.id === id })[0]
            if (row) openDetail(row)
          })
        ]

        applyFilter()

        ctx.onCleanup(function () {
          offs.forEach(function (off) { off() })
          view = null
        })
      }
    })
  })((window.PP = window.PP || {}))

    /** 当前页面实例的可变状态；未挂载时为 null */
    var view = null

    /** '¥ 10,000,000.00' —— 币种符号 + 千分位两位小数 */
    function money(entry) {

    /* ---------------------------------------------- 渲染 */

    function renderAccounts(root) {

        return (
          '<li class="acct">' +
          '<span class="acct-flag" aria-hidden="true">' + dom.esc(a.flag) + '</span>' +
          '<span class="acct-body">' +
          '<span class="acct-name">' + dom.esc(label) + '</span>' +
          '<span class="acct-amount num" data-amount>' + dom.esc(money(a)) + '</span>' +
          '</span>' +
          '<span class="acct-ops">' +
          '<button type="button" class="acct-op" data-op="exchange" data-ccy="' + dom.esc(a.ccy) + '"' +
          ' aria-label="换汇 ' + dom.esc(label) + '">换汇</button>' +
          '<button type="button" class="acct-op" data-op="withdraw" data-ccy="' + dom.esc(a.ccy) + '"' +
          ' aria-label="提现 ' + dom.esc(label) + '">提现</button>' +
          '</span>' +
          '</li>'
        )
      }).join('')))
    }

    /* ---------------------------------------------- 金额脱敏 */

    function syncAmount() {
      if (!view) return
      var visible = PP.store.get('amountVisible')
      var btn = dom.qs('#wallet-amount-toggle', view.root)

      // 用 body 属性驱动，全站所有 [data-amount] 一次性生效
      if (visible) document.body.removeAttribute('data-amount-hidden')
      else document.body.setAttribute('data-amount-hidden', 'true')

      if (!btn) return
      btn.setAttribute('aria-pressed', visible ? 'true' : 'false')
      btn.setAttribute('aria-label', visible ? '隐藏金额' : '显示金额')
      var use = btn.querySelector('use')
      if (use) use.setAttribute('href', visible ? '#i-eye' : '#i-eye-off')
    }

    /* ---------------------------------------------- 行内动作 */

    function onAction(el) {
      var ccy = el.getAttribute('data-ccy')
      if (el.getAttribute('data-op') === 'exchange') {
        PP.ui.toast('换汇（' + ccy + '）待接入')
        return
      }
      // 人民币账户走结汇提现流程，其余币种待接入
      if (ccy === 'CNH') {
        PP.router.go('rmb-exchange-withdraw')
        return
      }
      PP.ui.toast('提现（' + ccy + '）待接入')
    }

    /* ---------------------------------------------- 页面定义 */

    PP.definePage('wallet', {
      mount: function (root, ctx) {
        view = { root: root }

        renderAccounts(root)

        dom.qs('#total-asset', root).textContent = money(TOTAL_ASSET)
        dom.qs('#in-transit', root).textContent = money(IN_TRANSIT)
        dom.qs('#acct-count', root).textContent = String(ACCOUNTS.length)

        var offToggle = dom.on(root, 'click', '#wallet-amount-toggle', function () {
          PP.store.set({ amountVisible: !PP.store.get('amountVisible') })
          dom.haptic()
        })

        var offOps = dom.on(root, 'click', '[data-op]', function (e, el) {
          onAction(el)
        })

        syncAmount()

        var unsub = PP.store.subscribe(syncAmount)

        ctx.onCleanup(function () {
          offToggle()
          offOps()
          unsub()
          view = null
        })
      },

      /** 从提现等页面返回时，脱敏开关可能已被改过，重新同步一次 */
      show: syncAmount
    })
  })((window.PP = window.PP || {}))

            return '<span class="pill" data-tone="neutral">' + dom.esc(t) + '</span>'

    PP.definePage('collection', {
      mount: function (root, ctx) {

        listen('#open-apply', openApply)

        syncFilters()

        ctx.onCleanup(function () {
          offs.forEach(function (off) { off() })
          view = null
        })
      }
    })
  })((window.PP = window.PP || {}))

        '<span class="note-summary">' + esc(n.summary) + '</span>' +
        '<span class="note-time">' + esc(n.time) + '</span>' +
        '</span>' +
        '</button>' +
        '</li>'
      )
    }

    function renderList(root) {
      var list = listOf()
      PP.dom.renderList(PP.dom.qs('#note-list', root), list, noteHTML)
      PP.dom.toggle(PP.dom.qs('#note-list-card', root), list.length > 0)
      PP.dom.toggle(PP.dom.qs('#note-empty', root), list.length === 0)

      var sub = PP.dom.qs('#note-sub', root)
      if (sub) sub.textContent = '未读 ' + unreadOf(view.all) + ' 条 · 共 ' + view.all.length + ' 条'
    }

    /* ---------------------------------------------- 详情弹层 */

    function openDetail(id) {
      var n = itemOf(id)
      if (!n) return

      // 打开详情即标记已读
      if (!n.read) {
        n.read = true
        renderList(view.root)
      }

      var body =
        '<div class="note-sheet">' +
        '<span class="tile" data-tone="' + n.tone + '">' +
        '<svg aria-hidden="true"><use href="#' + n.icon + '"/></svg></span>' +
        '<h3 class="note-detail-title">' + PP.dom.esc(n.title) + '</h3>' +
        '<p class="note-detail-time">' +
        PP.dom.esc(n.time + ' · ' + n.categoryLabel) + '</p>' +
        '<p class="note-detail-content">' + PP.dom.esc(n.content) + '</p>' +
        '</div>'

      if (view.sheet) view.sheet.close()
      view.sheet = PP.ui.sheet({
        title: '消息详情',
        body: body,
        footer: '<div class="sheet-footer">' +
          '<button type="button" class="btn btn--primary" data-close>标记已读并关闭</button>' +
          '</div>'
      })
    }

    function readAll() {
      view.all.forEach(function (n) { n.read = true })
      renderList(view.root)
      PP.ui.toast('已全部标记为已读')
    }

    /* ---------------------------------------------- 页面定义 */

    PP.definePage('notifications', {
      mount: function (root, ctx) {
        var dom = PP.dom

        view = {
          root: root,
          category: 'all',
          // 克隆一份，页面内的已读翻转不污染上面的常量，重新进入仍是初始态
          all: ALL.map(function (n) { return Object.assign({}, n) }),
          sheet: null
        }

        // 打开即已读：清掉首页横幅的角标（首页已订阅 store，无需在这里处理）
        PP.store.set({ unread: 0 })

        renderCategories(root)
        renderList(root)

        dom.on(root, 'click', '[data-cat]', function (e, el) {
          var key = el.getAttribute('data-cat')
          if (key === view.category) return
          view.category = key
          renderCategories(root)
          renderList(root)
        })

        dom.on(root, 'click', '[data-id]', function (e, el) {
          openDetail(el.getAttribute('data-id'))
        })

        dom.on(root, 'click', '#note-readall', readAll)

        ctx.onCleanup(function () {
          // 页面出栈时若弹层还开着，一并收掉，避免遮罩留在界面上
          if (view && view.sheet) view.sheet.close()
          view = null
        })
      }
    })
  })((window.PP = window.PP || {}))

  <script data-bundle-from="js/app.js">
  /* ===== 脚本 · js/app.js ===== */
  /* ============================================================
     app.js · 启动引导
     ------------------------------------------------------------
     职责只有四件：加载图标 sprite → 生成 tabBar → 启动路由 → 揭幕。
     页面注册用 PP.definePage，各页面的 JS 在路由启动前完成注册。
     ============================================================ */
  (function (PP) {
    'use strict'

    var dom = PP.dom

    /* 页面注册表已由 routes.js 提供（PP.definePage），此处仅做引导 */

    /* ---------------------------------------------- 图标 sprite */

    /**
     * 把 SVG sprite 注入文档。
     * 打包产物里 sprite 已经内联，此处直接返回；
     * 开发态从 assets/icons.svg 取回后注入 —— 两条路径对外表现一致，
     * 页面里统一写 <svg><use href="#i-xxx"/></svg> 即可。
     */
    function loadSprite() {
      if (document.getElementById('pp-sprite')) return Promise.resolve()
      if (PP.fragBase === null) return Promise.resolve() // 产物态且未内联，不应发生
      return fetch(PP.fragBase + 'assets/icons.svg')
        .then(function (r) { return r.text() })
        .then(function (text) {
          var holder = document.createElement('div')
          holder.id = 'pp-sprite'
          holder.setAttribute('aria-hidden', 'true')
          holder.style.cssText = 'position:absolute;width:0;height:0;overflow:hidden'
          holder.innerHTML = text
          document.body.insertBefore(holder, document.body.firstChild)
        })
        .catch(function (e) {
          console.warn('[sprite] 加载失败，图标将不可见', e)
        })
    }

    /* ---------------------------------------------- tabBar */

    function buildTabbar() {
      var tabbar = dom.qs('#tabbar')
      dom.setHTML(tabbar, dom.raw(PP.TAB_ROUTES.map(function (r) {
        return (
          '<button type="button" class="tab" role="tab" aria-selected="false" data-name="' + r.name + '">' +
          '<svg aria-hidden="true"><use href="#' + r.tab.icon + '"/></svg>' +
          '<span class="tab-label">' + dom.esc(r.tab.text) + '</span>' +
          '</button>'
        )
      }).join('')))

      tabbar.addEventListener('click', function (e) {
        var tab = e.target.closest('.tab')
        if (tab) PP.router.switchTab(tab.getAttribute('data-name'))
      })
    }

    /* ---------------------------------------------- 全局动作委托 */

    /**
     * 声明式交互：页面里只写属性，不用绑事件。
     *   data-go="wallet"         → 跳转页面（tab 页自动走 switchTab）
     *   data-go="trade-collection" data-view="fund"
     *                            → 进入 tab 页并指定视图（页面按 onParams 响应）
     *   data-back                → 返回上一页
     *   data-demo="文案"          → 演示环境占位提示
     * 13 个页面因此不需要各写一遍导航代码。
     *
     * ⚠ data-back / data-go 是保留属性名，页面根元素不能用它们做别的钩子
     *   （历史上曾与路由的进场动画方向属性撞名，导致二级页点哪都返回）。
     */
    function bindGlobalActions() {
      document.addEventListener('click', function (e) {
        var target = e.target
        if (!target || !target.closest) return

        var go = target.closest('[data-go]')
        if (go) {
          var view = go.getAttribute('data-view')
          PP.router.go(go.getAttribute('data-go'), view ? { view: view } : null)
          return
        }
        if (target.closest('[data-back]')) {
          PP.router.back()
          return
        }
        var demo = target.closest('[data-demo]')
        if (demo) {
          PP.ui.toast(demo.getAttribute('data-demo') || '演示环境，该操作未接入')
        }
      })
    }

    /* ---------------------------------------------- 启动 */

    function boot() {
      buildTabbar()
      bindGlobalActions()

      loadSprite()
        .then(function () { return PP.router.start('index') })
        .then(function () {
          var app = dom.qs('#app')
          app.classList.add('is-ready')
          var boot = dom.qs('#boot')
          if (boot) {
            boot.classList.add('is-off')
            setTimeout(function () { if (boot.parentNode) boot.parentNode.removeChild(boot) }, 250)
          }
        })
        .catch(function (err) {
          console.error('[boot] 启动失败', err)
          var boot = dom.qs('#boot')
          if (boot) {
            boot.innerHTML =
              '<div style="text-align:center;padding:24px">' +
              '<p style="color:#dc2626;font-weight:600;margin-bottom:8px">页面加载失败</p>' +
              '<p style="font-size:12px;line-height:1.6">' +
              dom.esc(err && err.message ? err.message : String(err)) +
              '<br>开发态请通过本地服务器打开（见 README）</p>' +
              '</div>'
          }
        })
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', boot)
    } else {
      boot()
    }
  })((window.PP = window.PP || {}))
  </script><!-- ============ 页面片段 ============ -->

        <!-- 到账金额 -->
        <div class="frow">
          <label class="frow-label" for="arrival-input">
            <i class="frow-req" aria-hidden="true">*</i>到账金额：
          </label>
          <input class="field-input num" id="arrival-input" type="text"
                 inputmode="decimal" autocomplete="off"
                 placeholder="您可输入到账金额，将为您自动计算提现金额">
        </div>

        <!-- 转账附言 -->
        <div class="frow frow--last">
          <label class="frow-label" for="memo-input">转账附言：</label>
          <textarea class="memo-input" id="memo-input" rows="3" maxlength="50"
                    placeholder="选填，将随款项展示给收款方"></textarea>
        </div>
      </div>

      <div class="footbar">
        <button type="button" class="btn btn--ghost" data-back>取消</button>
        <button type="button" class="btn btn--primary" id="next-btn" aria-disabled="true">下一步</button>
      </div>
    </section>

    <!-- ===== 步骤 2：确认信息 ===== -->
    <section class="wizard-step" data-step="1" hidden>
      <div class="card wizard-card">
        <div class="section-head">
          <h2 class="section-title">提现信息确认</h2>
        </div>
        <div class="detail-row">
          <span class="detail-label">提现金额</span>
          <span class="detail-value num" id="confirm-amount">0.00 CNH</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">提现至</span>
          <span class="detail-value" id="confirm-to">本公司</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">结汇提现账户</span>
          <span class="detail-value" id="confirm-account">--</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">基础手续费</span>
          <span class="detail-value num" id="confirm-fee">0.00 CNH</span>
        </div>
        <div class="detail-row">
          <span class="detail-label">到账金额</span>
          <span class="detail-value num" data-tone="success" id="confirm-arrival">0.00 CNH</span>
        </div>
        <div class="detail-row" id="confirm-memo-row" hidden>
          <span class="detail-label">转账附言</span>
          <span class="detail-value" id="confirm-memo"></span>
        </div>
      </div>

      <div class="card wizard-card">
        <div class="field">
          <label class="field-label" for="pwd-input">交易密码</label>
          <input class="field-input" id="pwd-input" type="password" inputmode="numeric"
                 maxlength="6" autocomplete="off" placeholder="请输入 6 位交易密码">
        </div>
      </div>

      <div class="footbar">
        <button type="button" class="btn btn--ghost" id="prev-btn">返回上一步</button>
        <button type="button" class="btn btn--primary" id="submit-btn" aria-disabled="true">确认提交</button>
      </div>
    </section>

    <!-- ===== 步骤 3：提交成功 ===== -->
    <section class="wizard-step" data-step="2" hidden>
      <div class="result">
        <span class="result-icon" aria-hidden="true">
          <svg aria-hidden="true"><use href="#i-check-circle"/></svg>
        </span>
        <h2 class="result-title">您的结汇提现已提交成功</h2>
        <p class="result-desc">我们将尽快完成审核，请耐心等待结果</p>

        <div class="card result-card">
          <div class="detail-row">
            <span class="detail-label">申请金额</span>
            <span class="detail-value num" id="result-amount">0.00 CNH</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">到账金额</span>
            <span class="detail-value num" id="result-arrival">0.00 CNH</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">交易流水号</span>
            <span class="detail-value num" id="result-order-no"></span>
          </div>
        </div>
      </div>

      <div class="footbar">
        <button type="button" class="btn btn--ghost" data-go="index">返回首页</button>
        <button type="button" class="btn btn--primary" data-go="rmb-exchange-records">查看结汇记录</button>
      </div>
    </section>
  </template>

  <!-- 页面片段：trade-collection -->
  <template id="frag-trade-collection">
    <!--
      pages/trade-collection.html · 外贸收款管理（tabBar「收款」）
      ---------------------------------------------------------------
      本页含两个视图，由顶部 .tc-viewseg 分段切换：
        #tc-pane-collection  收款记录 —— 状态统计 + 搜索筛选 + 收款卡片列表
        #tc-pane-fund        在途资金 —— 合计 Hero + 状态页签 + 资金列表
      原「在途资金」一级页已并入此处：首页在途资金「详情 ›」带 data-view="fund"
      直达第二个视图，tabBar 因此从四栏收为三栏。

      静态结构与文案写在这里；两个列表都由 JS 从常量渲染，各自每页 5 条，
      底部分页交给 PP.ui.pager（只剩一页时自动收起，不占位）。
      筛选 / 收款详情 / 分配业务员 / 在途详情四个弹层统一交给 PP.ui.sheet，
      页面里只保留触发按钮，不再手写 mask + sheet 骨架。

      两个视图共存于同一页面根元素下，属性名必须互不干扰：
        收款用 data-status（状态统计）、data-act + data-id（卡片动作）
        在途用 data-fstatus（状态页签）、data-fid（条目点击）
        分页的 data-pg 由各自的挂载容器（#tc-pager / #fund-pager）承接
    -->

    <!-- ===== 视图切换：收款记录 / 在途资金 ===== -->
    <div class="seg tc-viewseg" id="tc-viewseg" role="tablist" aria-label="收款记录与在途资金">
      <button type="button" class="seg-item" role="tab" data-view="collection" aria-selected="true">收款记录</button>
      <button type="button" class="seg-item" role="tab" data-view="fund" aria-selected="false">在途资金</button>
    </div>

    <!-- ==================== 视图一 · 收款记录 ==================== -->
    <div class="tc-pane" id="tc-pane-collection">

      <!-- 收款状态统计（点击即筛选） -->
      <div class="stat-bar" role="group" aria-label="按收款状态筛选">
        <button type="button" class="stat-item" data-status="" aria-pressed="true">
          <span class="stat-num num" data-count="all">10</span>
          <span class="stat-label">全部</span>
        </button>
        <button type="button" class="stat-item" data-status="已入账" data-tone="success" aria-pressed="false">
          <span class="stat-num num" data-count="credited">4</span>
          <span class="stat-label">已入账</span>
        </button>
        <button type="button" class="stat-item" data-status="审核中" data-tone="warning" aria-pressed="false">
          <span class="stat-num num" data-count="reviewing">3</span>
          <span class="stat-label">审核中</span>
        </button>
        <button type="button" class="stat-item" data-status="已驳回" data-tone="danger" aria-pressed="false">
          <span class="stat-num num" data-count="rejected">3</span>
          <span class="stat-label">已驳回</span>
        </button>
      </div>

      <!-- 搜索 + 筛选 -->
      <div class="toolbar">
        <div class="search-box">
          <svg class="search-icon" aria-hidden="true"><use href="#i-search"/></svg>
          <input type="text" class="search-input" id="tc-search" enterkeyhint="search"
                 placeholder="搜索收款编号 / 付款方 / 附言"
                 aria-label="搜索收款编号、付款方或附言">
          <button type="button" class="search-clear" id="tc-clear" hidden>清除</button>
        </div>
        <button type="button" class="filter-btn" id="tc-filter" data-active="false"
                aria-haspopup="dialog" aria-label="筛选">
          <svg aria-hidden="true"><use href="#i-filter"/></svg>
          <span class="filter-badge" id="tc-filter-badge" hidden>0</span>
        </button>
      </div>

      <!-- 列表头 -->
      <div class="list-head">
        <span class="list-count" id="tc-count">共 10 条收款记录</span>
        <button type="button" class="btn-text" id="tc-export">导出明细</button>
      </div>

      <!-- 收款卡片列表（JS 渲染；每页 5 条） -->
      <ul class="coll-list" id="tc-list" aria-label="收款记录"></ul>

      <!-- 分页：由 PP.ui.pager 渲染，单页时自动隐藏 -->
      <div class="pager" id="tc-pager" hidden></div>

      <!-- 空状态 -->
      <div class="card empty tc-empty" id="tc-empty" hidden>
        <svg class="empty-icon" aria-hidden="true"><use href="#i-inbox"/></svg>
        <p class="empty-text">未找到匹配的收款记录</p>
        <p class="empty-sub">试试调整搜索关键词或筛选条件</p>
      </div>
    </div>

    <!-- ==================== 视图二 · 在途资金 ==================== -->
    <div class="tc-pane" id="tc-pane-fund" hidden>

      <!-- 汇总 Hero -->
      <section class="hero fund-hero">
        <span class="hero-deco hero-deco--a" aria-hidden="true"></span>
        <span class="hero-deco hero-deco--b" aria-hidden="true"></span>

        <span class="hero-label">在途资金合计 (USD)</span>
        <span class="hero-amount num" data-amount id="fund-total">$ 0.00</span>

        <span class="hero-divider" aria-hidden="true"></span>

        <div class="hero-meta">
          <div class="hero-meta-item">
            <span class="hero-meta-label">全部笔数</span>
            <span class="hero-meta-value num" id="fund-all-count">0 笔</span>
          </div>
          <span class="hero-meta-split" aria-hidden="true"></span>
          <div class="hero-meta-item">
            <span class="hero-meta-label">在途中</span>
            <span class="hero-meta-value num" id="fund-transit-count">0 笔</span>
          </div>
        </div>
      </section>

      <!-- 状态筛选；由 JS 渲染 -->
      <div class="seg fund-filter" id="fund-status" role="tablist" aria-label="资金状态筛选"></div>

      <!-- 资金列表；由 JS 渲染（每页 5 条） -->
      <section class="card card--section" id="fund-list-card">
        <ul class="fund-list" id="fund-list" role="list"></ul>
        <p class="fund-count" id="fund-count">共 0 条记录</p>
        <!-- 分页：由 PP.ui.pager 渲染，单页时自动隐藏 -->
        <div class="pager" id="fund-pager" hidden></div>
      </section>

      <!-- 空状态 -->
      <section class="card card--section empty" id="fund-empty" hidden>
        <svg class="empty-icon" aria-hidden="true"><use href="#i-inbox"/></svg>
        <span class="empty-text">未找到匹配的资金记录</span>
      </section>
    </div>
  </template>

  <!-- 页面片段：wallet -->
  <template id="frag-wallet">
    <!--
      pages/wallet.html · 我的资产
      ---------------------------------------------------------------
      渐变 Hero 的结构与配色复用 components.css 的 .hero / .hero-deco，
      钱包特有的排版见 wallet.css。
      币种账户是 10 条同构数据，由 wallet.js 渲染；静态文案写在这里。
      金额一律带 data-amount —— 受全局脱敏开关（body[data-amount-hidden]）控制。
    -->

    <!-- 汇总 Hero -->
    <section class="hero">
      <span class="hero-deco hero-deco--a" aria-hidden="true"></span>
      <span class="hero-deco hero-deco--b" aria-hidden="true"></span>

      <div class="wallet-label-row">
        <span class="hero-label">总资产折合估值 (USD)</span>
        <button type="button" class="wallet-eye" id="wallet-amount-toggle"
                aria-pressed="true" aria-label="隐藏金额">
          <svg aria-hidden="true"><use href="#i-eye"/></svg>
        </button>
      </div>

      <span class="wallet-total num" data-amount id="total-asset">$ 1,723,225.51</span>

      <span class="hero-divider" aria-hidden="true"></span>

      <div class="wallet-meta">
        <div class="wallet-meta-item">
          <span class="wallet-meta-label">币种账户</span>
          <span class="wallet-meta-value num" id="acct-count">10</span>
        </div>
        <span class="wallet-meta-split" aria-hidden="true"></span>
        <div class="wallet-meta-item">
          <span class="wallet-meta-label">在途资金 (USD)</span>
          <span class="wallet-meta-value num" data-amount id="in-transit">$ 177,088.52</span>
        </div>
      </div>
    </section>

    <!-- 币种账户列表；列表项由 JS 渲染 -->
    <section class="card wallet-card">
      <div class="section-head">
        <div>
          <h2 class="section-title">币种账户</h2>
          <span class="section-sub">余额以各币种原币展示</span>
        </div>
      </div>
      <ul class="acct-list" id="wallet-acct-list"></ul>
    </section>

    <p class="wallet-tip">数据仅供参考，以实际清算结果为准</p>
  </template>

</body>
</html>
