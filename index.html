        body: filterBody(),
        footer:
          '<div class="sheet-footer">' +
            '<button type="button" class="btn btn--ghost" data-reset>重置</button>' +
            '<button type="button" class="btn btn--primary" data-apply>查询</button>' +
          '</div>',
        onMount: function (root) {
          syncFilterForm(root, draft)

          dom.on(root, 'change', '#tc-f-start', function (e, el) { draft.startDate = el.value })
          dom.on(root, 'change', '#tc-f-end', function (e, el) { draft.endDate = el.value })
          dom.on(root, 'input', '#tc-f-payer', function (e, el) { draft.payer = el.value })
          dom.on(root, 'input', '#tc-f-min', function (e, el) { draft.min = el.value })
          dom.on(root, 'input', '#tc-f-max', function (e, el) { draft.max = el.value })

          dom.on(root, 'click', '#tc-f-account', function () {
            PP.ui.picker({
              title: '收款账号',
              value: ACCOUNT_OPTIONS[draft.accountIndex],
              options: ACCOUNT_OPTIONS.map(function (name) {
                return { value: name, title: name }
              })
            }).then(function (picked) {
              if (picked === null) return
              var i = ACCOUNT_OPTIONS.indexOf(picked)
              draft.accountIndex = i < 0 ? 0 : i
              syncAccount(root, draft)
            })
          })

          dom.on(root, 'click', '[data-ccy]', function (e, el) {
            draft.currency = el.getAttribute('data-ccy')
            syncCcy(root, draft.currency)
          })

          dom.on(root, 'click', '[data-reset]', function () {
            draft = emptyFilters()
            syncFilterForm(root, draft)
          })

          dom.on(root, 'click', '[data-apply]', function () {
            view.filters = Object.assign({}, draft)
            sheet.close()
            applyFilters()
          })
        }
      })
    }

    /* ---------------------------------------------- 详情弹层 */

    function detailRow(label, valueHTML, extraClass) {
      return '<div class="detail-row">' +
        '<span class="detail-label">' + dom.esc(label) + '</span>' +
        '<span class="detail-value' + (extraClass ? ' ' + extraClass : '') + '">' + valueHTML + '</span>' +
        '</div>'
    }

    function detailBody(a) {
      return '<div class="detail-box">' +
        detailRow('收款编号', dom.esc(a.no), 'num') +
        detailRow('收款时间', dom.esc(a.time)) +
        detailRow('付款方', dom.esc(a.payer)) +
        detailRow('收款金额', '+' + dom.esc(a.amountText), 'num tc-strong') +
        detailRow('收款账户', dom.esc(a.account), 'num') +
        detailRow('付款方账户', dom.esc(a.payerAccount), 'num') +
        detailRow('付款方 Bic', dom.esc(a.bic), 'num') +
        detailRow('付款方国家', dom.esc(a.country)) +
        detailRow('业务员', dom.esc(a.sales)) +
        detailRow('附言', dom.esc(a.note)) +
        detailRow('状态', '<span class="pill cc-status" data-tone="' + a.statusTone + '">' +
          dom.esc(a.status) + '</span>') +
        '</div>'
    }

    function copyDetail(a) {
      var text = [
        '收款编号：' + a.no,
        '收款时间：' + a.time,
        '付款方：' + a.payer,
        '收款金额：' + a.amountText,
        '收款账户：' + a.account,
        '付款方账户：' + a.payerAccount,
        '付款方Bic：' + a.bic,
        '付款方国家：' + a.country,
        '业务员：' + a.sales,
        '附言：' + a.note,
        '状态：' + a.status
      ].join('\n')

      dom.copy(text).then(function () {
        PP.ui.toast('已复制', { icon: 'success' })
      }).catch(function () {
        PP.ui.toast('复制失败，请手动选择文本复制')
      })
    }

    /** 回单：Web 版为模拟发送，小程序侧待接入真实回单文件 */
    function sendReceipt(a) {
      PP.ui.toast('回单已发送至邮箱：' + a.no)
    }

    function openDetail(a) {
      PP.ui.sheet({
        title: '收款详情',
        body: detailBody(a),
        footer:
          '<div class="sheet-footer">' +
            '<button type="button" class="btn btn--ghost" data-copy>复制信息</button>' +
            '<button type="button" class="btn btn--primary" data-receipt>回单下载</button>' +
          '</div>',
        onMount: function (root) {
          dom.on(root, 'click', '[data-copy]', function () { copyDetail(a) })
          dom.on(root, 'click', '[data-receipt]', function () { sendReceipt(a) })
        }
      })
    }

    /* ---------------------------------------------- 分配业务员弹层 */

    function assignBody(a, pick) {
      return (
        '<div class="assign-no-row">' +
          '<span class="assign-no-label">收款编号</span>' +
          '<span class="assign-no num">' + dom.esc(a.no) + '</span>' +
        '</div>' +
        '<div class="assign-list stack-2" role="listbox" aria-label="选择业务员">' +
          SALES_OPTIONS.map(function (name) {
            var on = name === pick
            return '<button type="button" class="option-row" role="option"' +
              ' data-name="' + dom.esc(name) + '" aria-selected="' + (on ? 'true' : 'false') + '">' +
              '<span class="tile"><svg aria-hidden="true"><use href="#i-user"/></svg></span>' +
              '<span class="option-body"><span class="option-title">' + dom.esc(name) + '</span></span>' +
              '<svg class="option-check" aria-hidden="true"' + (on ? '' : ' hidden') +
                '><use href="#i-check"/></svg>' +
              '</button>'
          }).join('') +
        '</div>'
      )
    }

    function openAssign(a) {
      var pick = a.sales

      var sheet = PP.ui.sheet({
        title: '分配业务员',
        body: assignBody(a, pick),
        footer:
          '<div class="sheet-footer">' +
            '<button type="button" class="btn btn--ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn--primary" data-save>保存</button>' +
          '</div>',
        onMount: function (root) {
          dom.on(root, 'click', '.option-row', function (e, row) {
            pick = row.getAttribute('data-name')
            dom.qsa('.option-row', root).forEach(function (item) {
              var on = item === row
              item.setAttribute('aria-selected', on ? 'true' : 'false')
              var check = dom.qs('.option-check', item)
              if (check) check.hidden = !on
            })
            dom.haptic()
          })

          dom.on(root, 'click', '[data-save]', function () {
            a.sales = pick
            sheet.close()
            // 分配不改筛选结果，只重渲染，页码停在原处
            render()
            PP.ui.toast('业务员已分配：' + pick, { icon: 'success' })
          })
        }
      })
    }

    /* ---------------------------------------------- 导出明细 */

    function exportList() {
      var header = ['序号', '收款编号', '收款时间', '状态', '付款方', '收款金额', '收款币种', '收款账户',
        '付款方账户', '付款方Bic', '付款方国家', '业务员', '附言']
      var rows = view.rows.map(function (a, i) {
        return [
          i + 1, a.no, a.time, a.status, a.payer, PP.format.fmtNum(a.amount), a.currency,
          a.account, a.payerAccount, a.bic, a.country, a.sales, a.note
        ]
      })
      var tsv = [header].concat(rows).map(function (r) { return r.join('\t') }).join('\n')

      dom.copy(tsv).then(function () {
        PP.ui.toast('已复制 ' + rows.length + ' 条明细，可粘贴到 Excel', { icon: 'success' })
      }).catch(function () {
        PP.ui.toast('复制失败，请手动选择文本复制')
      })
    }

    /* =============================================== 在途资金 · 渲染与交互 */

    function fundListOf() {
      return FUND_ROWS.filter(function (r) {
        return view.fundStatus === 'all' || r.key === view.fundStatus
      })
    }

    function fundRowOf(id) {
      for (var i = 0; i < FUND_ROWS.length; i++) {
        if (FUND_ROWS[i].id === id) return FUND_ROWS[i]
      }
      return null
    }

    /** 汇总 Hero：合计与笔数始终按全量统计，不随下方状态筛选变化 */
    function renderFundHero() {
      var total = FUND_ROWS.reduce(function (acc, r) {
        return acc + r.amount * (FUND_RATE[r.currency] || 1)
      }, 0)

      var setText = function (sel, text) {
        var el = dom.qs(sel, view.root)
        if (el) el.textContent = text
      }
      setText('#fund-total', PP.format.withSymbol('$', total))
      setText('#fund-all-count', FUND_ROWS.length + ' 笔')
      setText('#fund-transit-count', FUND_ROWS.filter(function (r) {
        return r.status === '在途中'
      }).length + ' 笔')
    }

    function renderFundTabs() {
      dom.renderList(dom.qs('#fund-status', view.root), FUND_STATUS_TABS, function (t) {
        return (
          '<button type="button" class="seg-item" role="tab"' +
          ' aria-selected="' + (t.key === view.fundStatus ? 'true' : 'false') + '"' +
          ' data-fstatus="' + t.key + '">' + dom.esc(t.label) + '</button>'
        )
      })
    }

    function fundRowHTML(r) {
      return (
        '<li>' +
        '<button type="button" class="fund" data-fid="' + dom.esc(r.id) + '">' +
        '<span class="tile" data-tone="' + r.tone + '">' +
        '<svg aria-hidden="true"><use href="#i-globe"/></svg></span>' +
        '<span class="fund-body">' +
        '<span class="fund-line1">' +
        '<span class="fund-payer">' + dom.esc(r.payer) + '</span>' +
        '<span class="fund-amount num">' + dom.esc(r.amountText) + '</span>' +
        '</span>' +
        '<span class="fund-line2">' +
        '<span class="fund-sub">' + dom.esc(r.country + ' · ' + r.bank) + '</span>' +
        '<span class="pill" data-tone="' + r.badgeTone + '">' + dom.esc(r.status) + '</span>' +
        '</span>' +
        '<span class="fund-time">' + dom.esc(r.time) + '</span>' +
        '</span>' +
        '</button>' +
        '</li>'
      )
    }

    function renderFundList() {
      var list = fundListOf()
      if (view.fundPage > pageCount(list.length)) view.fundPage = pageCount(list.length)

      dom.renderList(dom.qs('#fund-list', view.root), pageSlice(list, view.fundPage), fundRowHTML)
      dom.toggle(dom.qs('#fund-list-card', view.root), list.length > 0)
      dom.toggle(dom.qs('#fund-empty', view.root), list.length === 0)

      var count = dom.qs('#fund-count', view.root)
      if (count) count.textContent = '共 ' + list.length + ' 条记录'

      var p = renderPager('#fund-pager', list.length, view.fundPage, '在途资金分页', function (page) {
        view.fundPage = page
        renderFundList()
        scrollViewTop()
      })
      view.fundPage = p.page
    }

    function fundDetailRow(label, value, isNum) {
      return '<div class="detail-row">' +
        '<span class="detail-label">' + dom.esc(label) + '</span>' +
        '<span class="detail-value"' + (isNum ? ' data-num' : '') + '>' +
        dom.esc(value) + '</span>' +
        '</div>'
    }

    function openFundDetail(id) {
      var r = fundRowOf(id)
      if (!r) return

      var body =
        fundDetailRow('到账时间', r.time) +
        fundDetailRow('付款人', r.payer) +
        fundDetailRow('付款金额', r.amountText, true) +
        fundDetailRow('付款币种', r.currency) +
        fundDetailRow('付款国家/地区', r.country) +
        fundDetailRow('付款银行', r.bank) +
        fundDetailRow('附言', r.note) +
        fundDetailRow('状态', r.status)

      if (view.fundSheet) view.fundSheet.close()
      view.fundSheet = PP.ui.sheet({ title: '在途资金详情', body: body })
    }

    /** 切换页面内两个视图（收款记录 / 在途资金），同步分段控件的选中态 */
    function switchView(mode) {
      if (mode !== 'collection' && mode !== 'fund') return
      view.mode = mode
      dom.qsa('[data-view]', view.root).forEach(function (btn) {
        btn.setAttribute('aria-selected', btn.getAttribute('data-view') === mode ? 'true' : 'false')
      })
      dom.toggle(dom.qs('#tc-pane-collection', view.root), mode === 'collection')
      dom.toggle(dom.qs('#tc-pane-fund', view.root), mode === 'fund')
    }

    /* ---------------------------------------------- 页面定义 */

    PP.definePage('trade-collection', {
      mount: function (root, ctx) {
        view = {
          root: root,
          /** 当前视图：collection 收款记录 / fund 在途资金 */
          mode: 'collection',
          // 每次挂载都从常量复制一份，编辑（分配业务员）不会污染演示数据
          list: COLLECTIONS.map(decorate),
          rows: [],
          /** 收款列表当前页（1 起） */
          page: 1,
          searchText: '',
          statusSeg: '',
          filters: emptyFilters(),
          /** 在途资金视图状态（与收款的状态筛选各自独立） */
          fundStatus: 'all',
          /** 在途列表当前页（1 起） */
          fundPage: 1,
          fundSheet: null
        }

        refreshCounts()
        renderFundHero()
        renderFundTabs()
        renderFundList()

        var offs = [
          // 视图切换：收款记录 / 在途资金
          dom.on(root, 'click', '#tc-viewseg [data-view]', function (e, el) {
            switchView(el.getAttribute('data-view'))
          }),

          // 状态统计：点击即筛选
          dom.on(root, 'click', '#tc-pane-collection [data-status]', function (e, el) {
            var next = el.getAttribute('data-status')
            if (next === view.statusSeg) return
            view.statusSeg = next
            dom.qsa('#tc-pane-collection [data-status]', root).forEach(function (btn) {
              btn.setAttribute('aria-pressed', btn.getAttribute('data-status') === next ? 'true' : 'false')
            })
            applyFilters()
          }),

          // 搜索
          dom.on(root, 'input', '#tc-search', function (e, el) {
            view.searchText = el.value
            dom.toggle(dom.qs('#tc-clear', root), !!el.value)
            applyFilters()
          }),
          dom.on(root, 'click', '#tc-clear', function () {
            var input = dom.qs('#tc-search', root)
            input.value = ''
            view.searchText = ''
            dom.toggle(dom.qs('#tc-clear', root), false)
            applyFilters()
            input.focus()
          }),

          dom.on(root, 'click', '#tc-filter', openFilter),
          dom.on(root, 'click', '#tc-export', exportList),

          // 卡片动作：详情 / 回单 / 分配（列表重渲染后依然有效）
          dom.on(root, 'click', '[data-act]', function (e, el) {
            var a = findById(el.getAttribute('data-id'))
            if (!a) return
            var act = el.getAttribute('data-act')
            if (act === 'detail') openDetail(a)
            else if (act === 'receipt') sendReceipt(a)
            else if (act === 'assign') openAssign(a)
          }),

          // 在途资金：状态页签（只影响列表，不影响 Hero 汇总）；换状态即回第 1 页
          dom.on(root, 'click', '#tc-pane-fund [data-fstatus]', function (e, el) {
            var key = el.getAttribute('data-fstatus')
            if (key === view.fundStatus) return
            view.fundStatus = key
            view.fundPage = 1
            renderFundTabs()
            renderFundList()
          }),

          // 在途资金：条目整行可点，打开详情弹层
          dom.on(root, 'click', '[data-fid]', function (e, el) {
            openFundDetail(el.getAttribute('data-fid'))
          })
        ]

        applyFilters()

        ctx.onCleanup(function () {
          offs.forEach(function (off) { off() })
          // 页面出栈时若在途详情弹层还开着，一并收掉，避免遮罩留在界面上
          if (view && view.fundSheet) view.fundSheet.close()
          view = null
        })
      },

      /** 带视图意图进入本页时直接落位（如首页在途资金「详情 ›」→ { view: 'fund' }） */
      onParams: function (el, params) {
        if (view && params && params.view) switchView(params.view)
      }
    })
  })((window.PP = window.PP || {}))

        name: c.name,
        type: c.type,
        face: c.face,
        amount: c.amount,
        used: c.used,
        status: c.status,
        valid: c.valid,
        records: c.records,
        tone: toneOf(c.scope),
        statusText: st.text,
        statusTone: st.tone,
        usedText: '¥' + PP.format.fmtNum(c.used),
        amountText: '¥' + PP.format.fmtNum(c.amount),
        leftText: '¥' + PP.format.fmtNum(c.amount - c.used),
        pct: c.amount > 0 ? Math.min(100, Math.round((c.used / c.amount) * 100)) : 0,
        scopeList: c.scope.split('/').map(function (s) { return s.trim() })
      }
    }

    var COUPONS = RAW.map(decorate)

    /** 当前页面实例的可变状态；未挂载时为 null */
    var view = null

    /* ---------------------------------------------- 取数 */

    function byKey(key) {
      if (key === 'all') return COUPONS
      if (key === 'active') {
        return COUPONS.filter(function (c) {
          return c.status === 'active' || c.status === 'expiring'
        })
      }
      return COUPONS.filter(function (c) { return c.status === key })
    }

    function sum(list, pick) {
      return list.reduce(function (acc, c) { return acc + pick(c) }, 0)
    }

    function statValues() {
      var avail = byKey('active')
      return {
        avail: String(avail.length),
        totalUsed: '¥' + PP.format.fmtNum(sum(COUPONS, function (c) { return c.used })),
        totalLeft: '¥' + PP.format.fmtNum(sum(avail, function (c) { return c.amount - c.used })),
        expiring: String(byKey('expiring').length)
      }
    }

    function couponOf(id) {
      for (var i = 0; i < COUPONS.length; i++) {
        if (COUPONS[i].id === id) return COUPONS[i]
      }
      return null
    }

    /* ---------------------------------------------- 渲染片段 */

    function renderStats(root) {
      var values = statValues()
      PP.dom.renderList(PP.dom.qs('#rc-stats', root), STATS, function (s) {
        return (
          '<div class="stat-card">' +
          '<span class="tile" data-tone="' + s.tone + '">' +
          '<svg aria-hidden="true"><use href="#' + s.icon + '"/></svg></span>' +
          '<div class="stat-card-body">' +
          '<span class="stat-card-value">' + PP.dom.esc(values[s.key]) + '</span>' +
          '<span class="stat-card-label">' + PP.dom.esc(s.label) + '</span>' +
          '</div>' +
          '</div>'
        )
      })
    }

    function renderFilters(root) {
      PP.dom.renderList(PP.dom.qs('#rc-filters', root), FILTERS, function (f) {
        return (
          '<button type="button" class="chip" data-filter="' + f.key + '"' +
          ' aria-pressed="' + (f.key === view.filter ? 'true' : 'false') + '">' +
          PP.dom.esc(f.label) +
          '<span class="chip-count">' + byKey(f.key).length + '</span>' +
          '</button>'
        )
      })
    }

    function scopesHTML(list) {
      return list.map(function (s) {
        return '<span class="coupon-scope">' + PP.dom.esc(s) + '</span>'
      }).join('')
    }

    function couponHTML(c) {
      var esc = PP.dom.esc
      return (
        '<li class="coupon" data-tone="' + c.tone + '" data-state="' + c.status + '">' +
        '<span class="coupon-cord" aria-hidden="true"></span>' +

        '<div class="coupon-head">' +
        '<span class="tile" data-tone="' + c.tone + '">' +
        '<svg aria-hidden="true"><use href="#i-ticket"/></svg></span>' +
        '<div class="coupon-id">' +
        '<span class="coupon-name">' + esc(c.name) + '</span>' +
        '<span class="coupon-type">' + esc(c.type) + '</span>' +
        '</div>' +
        '<span class="pill" data-tone="' + c.statusTone + '">' + esc(c.statusText) + '</span>' +
        '</div>' +

        '<div class="coupon-amount-row">' +
        '<span class="coupon-amount num">' + esc(c.face) + '</span>' +
        '<span class="coupon-amount-cap">面额</span>' +
        '</div>' +

        '<div class="coupon-scopes">' + scopesHTML(c.scopeList) + '</div>' +

        '<div class="coupon-usage">' +
        '<div class="coupon-usage-top">' +
        '<span>已用 <strong>' + esc(c.usedText) + '</strong></span>' +
        '<span>总额 ' + esc(c.amountText) + '</span>' +
        '</div>' +
        '<div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100"' +
        ' aria-valuenow="' + c.pct + '" aria-label="' + esc(c.name) + ' 已使用 ' + c.pct + '%">' +
        '<span class="bar-in" style="width:' + c.pct + '%"></span>' +
        '</div>' +
        '</div>' +

        '<div class="coupon-foot">' +
        '<span class="coupon-valid">有效期至 <strong>' + esc(c.valid) + '</strong></span>' +
        '<button type="button" class="btn-text coupon-detail" data-detail="' + esc(c.id) + '">' +
        '查看使用记录</button>' +
        '</div>' +
        '</li>'
      )
    }

    function renderList(root) {
      var list = byKey(view.filter)
      var host = PP.dom.qs('#rc-list', root)
      PP.dom.renderList(host, list, couponHTML)
      PP.dom.toggle(host, list.length > 0)
      PP.dom.toggle(PP.dom.qs('#rc-empty', root), list.length === 0)
    }

    /* ---------------------------------------------- 详情弹层 */

    function ovCell(value, label) {
      return (
        '<div class="rc-ov-cell">' +
        '<span class="rc-ov-val num">' + PP.dom.esc(value) + '</span>' +
        '<span class="rc-ov-label">' + PP.dom.esc(label) + '</span>' +
        '</div>'
      )
    }

    function recordHTML(r) {
      return (
        '<li class="rc-rec">' +
        '<span class="rc-rec-body">' +
        '<span class="rc-rec-date">' + PP.dom.esc(r.date) + '</span>' +
        '<span class="rc-rec-desc">' + PP.dom.esc(r.desc) + '</span>' +
        '</span>' +
        '<span class="rc-rec-amt num">' + PP.dom.esc(r.amt) + '</span>' +
        '</li>'
      )
    }

    function openDetail(id) {
      var c = couponOf(id)
      if (!c) return

      var body =
        '<div class="rc-sheet">' +
        '<div class="rc-sheet-id">' +
        '<span class="tile" data-tone="' + c.tone + '">' +
        '<svg aria-hidden="true"><use href="#i-ticket"/></svg></span>' +
        '<span class="rc-sheet-sub">' + PP.dom.esc(c.type + ' · ' + c.statusText) + '</span>' +
        '</div>' +

        '<div class="rc-ov">' +
        ovCell(c.face, '面额') +
        ovCell(c.usedText, '已抵扣') +
        ovCell(c.leftText, '剩余可用') +
        '</div>' +

        '<div class="rc-sheet-scopes">' + scopesHTML(c.scopeList) + '</div>' +

        '<div class="rc-rec-head">' +
        '<svg class="rc-rec-ico" aria-hidden="true"><use href="#i-clock"/></svg>' +
        '<span class="rc-rec-title">抵扣使用记录</span>' +
        '</div>' +

        (c.records.length
          ? '<ul class="rc-rec-list" role="list">' +
            c.records.map(recordHTML).join('') + '</ul>'
          : '<div class="empty">' +
            '<svg class="empty-icon" aria-hidden="true"><use href="#i-inbox"/></svg>' +
            '<span class="empty-text">该券暂无抵扣记录</span>' +
            '</div>') +
        '</div>'

      if (view.sheet) view.sheet.close()
      view.sheet = PP.ui.sheet({ title: c.name, body: body })
    }

    /** 抵扣规则（等价于原小程序的 showModal，showCancel:false） */
    function showRules() {
      PP.ui.confirm({
        title: '抵扣规则',
        content: '优惠券按手续费场景自动匹配，单笔不足面额时智能拆分组合抵扣。',
        showCancel: false,
        confirmText: '知道了'
      })
    }

    /* ---------------------------------------------- 页面定义 */

    PP.definePage('rights-center', {
      mount: function (root, ctx) {
        var dom = PP.dom

        view = { root: root, filter: 'all', sheet: null }

        renderStats(root)
        renderFilters(root)
        renderList(root)

        dom.on(root, 'click', '[data-filter]', function (e, el) {
          var key = el.getAttribute('data-filter')
          if (key === view.filter) return
          view.filter = key
          renderFilters(root)
          renderList(root)
        })

        dom.on(root, 'click', '[data-detail]', function (e, el) {
          openDetail(el.getAttribute('data-detail'))
        })

        dom.on(root, 'click', '#rc-rules', showRules)

        ctx.onCleanup(function () {
          // 页面出栈时若弹层还开着，一并收掉，避免遮罩留在界面上
          if (view && view.sheet) view.sheet.close()
          view = null
        })
      }
    })
  })((window.PP = window.PP || {}))

    /** 当前页面实例的可变状态；未挂载时为 null */
    var view = null

    /* ---------------------------------------------- 数据 */

    function decorate(a) {
      return Object.assign({}, a, {
        statusTone: STATUS_TONE[a.orderStatus] || 'warning',
        shipTone: SHIP_TONE[a.shipStatus] || 'neutral',
        amountText: PP.format.fmtNum(a.amount) + ' ' + a.currency,
        ratioNum: parseInt(a.ratio, 10) || 0
      })
    }

      return { startDate: '', endDate: '', ship: '', creator: '' }
    }

    function findById(id) {
      for (var i = 0; i < view.list.length; i++) {
        if (view.list[i].id === id) return view.list[i]
      }
      return null
    }

    function pad(n) {
      return n < 10 ? '0' + n : '' + n
    }

    /* ---------------------------------------------- 渲染 */

    function rowHTML(a) {
      return (
        '<li class="order-card">' +
          '<button type="button" class="oc-main" data-id="' + dom.esc(a.id) + '"' +
            ' aria-label="查看订单 ' + dom.esc(a.no) + ' 的详情">' +
            '<span class="oc-top">' +
              '<span class="oc-no">' + dom.esc(a.no) + '</span>' +
              '<span class="pill" data-tone="' + a.statusTone + '">' + dom.esc(a.orderStatus) + '</span>' +

            '<span class="oc-mid">' +
              '<span class="oc-buyer-wrap">' +

    }

      var listEl = dom.qs('#om-list', view.root)
      dom.renderList(listEl, view.rows, rowHTML)
      dom.toggle(listEl, view.rows.length > 0)
      dom.toggle(dom.qs('#om-empty', view.root), view.rows.length === 0)
      dom.qs('#om-count', view.root).textContent = '共 ' + view.rows.length + ' 条订单'
    }

      var c = { all: view.list.length, pending: 0, partial: 0, linked: 0 }
      view.list.forEach(function (a) {
        if (a.orderStatus === '待关联') c.pending += 1
        else if (a.orderStatus === '部分关联') c.partial += 1
        else if (a.orderStatus === '全部关联') c.linked += 1
      })
      Object.keys(c).forEach(function (k) {
        var el = dom.qs('[data-count="' + k + '"]', view.root)
        if (el) el.textContent = String(c[k])
      })
    }

    /* ---------------------------------------------- 过滤 */

    function getFiltered() {
      var f = view.filters
      var kw = view.searchText.trim().toLowerCase()
      var s = f.startDate ? f.startDate + ' 00:00:00' : ''
      var e = f.endDate ? f.endDate + ' 23:59:59' : ''
      var creator = f.creator.trim().toLowerCase()

      return view.list.filter(function (a) {
        if (kw && (a.no + ' ' + a.contract + ' ' + a.buyer + ' ' + a.product).toLowerCase().indexOf(kw) === -1) return false
        if (view.statusSeg && a.orderStatus !== view.statusSeg) return false
        if (f.ship && a.shipStatus !== f.ship) return false
        if (s && a.time < s) return false
        if (e && a.time > e) return false
        if (creator && a.creator.toLowerCase().indexOf(creator) === -1) return false
        return true
      })
    }

    function syncFilterBadge() {
      var f = view.filters
      var n = [f.startDate, f.endDate, f.ship, f.creator.trim()].filter(function (v) { return !!v }).length
      var badge = dom.qs('#om-filter-badge', view.root)
      var btn = dom.qs('#om-filter', view.root)
      badge.textContent = String(n)

      btn.setAttribute('data-active', n > 0 ? 'true' : 'false')
      btn.setAttribute('aria-label', n > 0 ? '筛选，已生效 ' + n + ' 项条件' : '筛选')

    function syncShip(root, ship) {
      dom.qsa('[data-ship]', root).forEach(function (el) {

      })

    function syncFilterForm(root, draft) {
      dom.qs('#om-f-start', root).value = draft.startDate
      dom.qs('#om-f-end', root).value = draft.endDate
      dom.qs('#om-f-creator', root).value = draft.creator
      syncShip(root, draft.ship)
    }

    function openFilter() {
      // 草稿：弹层内随便改，点「查询」才生效
      var draft = Object.assign({}, view.filters)

      var sheet = PP.ui.sheet({
        title: '筛选条件',
        body: filterBody(),
        footer:
          '<div class="sheet-footer">' +
            '<button type="button" class="btn btn--ghost" data-reset>重置</button>' +

          '</div>',
        onMount: function (root) {

            syncShip(root, draft.ship)

          dom.on(root, 'click', '[data-reset]', function () {
            draft = emptyFilters()

        '</div>'

    function detailBody(a) {
      return '<div class="detail-box">' +
        detailRow('订单编号', dom.esc(a.no), 'num') +
        detailRow('合同号', dom.esc(a.contract)) +
        detailRow('创建时间', dom.esc(a.time)) +

        detailRow('商品名称', dom.esc(a.product)) +
        detailRow('订单总额', dom.esc(a.amountText), 'num om-strong') +
        detailRow('创建人', dom.esc(a.creator)) +
        detailRow('收款关联比例', dom.esc(a.ratio), 'num om-strong') +
        detailRow('订单状态', '<span class="pill" data-tone="' + a.statusTone + '">' +
          dom.esc(a.orderStatus) + '</span>') +
        detailRow('发货状态', '<span class="pill" data-tone="' + a.shipTone + '">' +
          dom.esc(a.shipStatus) + '</span>') +
        '</div>'
    }

    function copyOrder(a) {
      var text = [
        '订单编号: ' + a.no,
        '合同号: ' + a.contract,
        '创建时间: ' + a.time,
        '买方名称: ' + a.buyer,
        '商品名称: ' + a.product,
        '订单总额: ' + a.amountText,
        '创建人: ' + a.creator,
        '收款关联比例: ' + a.ratio,
        '订单状态: ' + a.orderStatus,
        '发货状态: ' + a.shipStatus
      ].join('\n')

      dom.copy(text).then(function () {
        PP.ui.toast('订单信息已复制', { icon: 'success' })
      }).catch(function () {
        PP.ui.toast('复制失败，请手动选择文本复制')
      })
    }

    function openDetail(a) {
      var sheet = PP.ui.sheet({
        title: '订单详情',
        body: detailBody(a),
        footer:
          '<div class="sheet-footer">' +
            '<button type="button" class="btn btn--ghost" data-copy>复制信息</button>' +
            '<button type="button" class="btn btn--primary" data-edit>编辑订单</button>' +
          '</div>',
        onMount: function (root) {
          dom.on(root, 'click', '[data-copy]', function () { copyOrder(a) })
          dom.on(root, 'click', '[data-edit]', function () {
            sheet.close()
            openForm('edit', a)
          })
        }
      })
    }

    /* ---------------------------------------------- 创建 / 编辑弹层 */

    function formBody(form) {
      return (
        '<div class="field">' +
          '<label class="field-label" for="om-f-buyer">买方名称</label>' +
          '<input type="text" class="field-input" id="om-f-buyer" placeholder="请输入买方名称"' +
            ' value="' + dom.esc(form.buyer) + '">' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label" for="om-f-product">商品名称</label>' +
          '<input type="text" class="field-input" id="om-f-product" placeholder="请输入商品名称"' +
            ' value="' + dom.esc(form.product) + '">' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label" for="om-f-amount">订单总额</label>' +
          '<input type="text" inputmode="decimal" class="field-input num" id="om-f-amount"' +
            ' placeholder="0.00" value="' + dom.esc(form.amount) + '">' +
        '</div>' +
        '<div class="field">' +
          '<span class="field-label" id="om-ccy-label">订单币种</span>' +
          '<div class="seg" role="tablist" aria-labelledby="om-ccy-label">' +
            ['USD', 'CNH', 'EUR'].map(function (c) {
              return '<button type="button" class="seg-item" role="tab" data-ccy="' + c + '"' +
                ' aria-selected="' + (form.currency === c ? 'true' : 'false') + '">' + c + '</button>'
            }).join('') +
          '</div>' +
        '</div>' +
        '<div class="field">' +
          '<label class="field-label" for="om-f-contract">合同号</label>' +
          '<input type="text" class="field-input" id="om-f-contract"' +
            ' placeholder="选填，留空自动生成" value="' + dom.esc(form.contract) + '">' +
        '</div>'
      )
    }

    function submitForm(sheet, mode, order, form) {
      var buyer = form.buyer.trim()
      var amount = parseFloat(form.amount)

      if (!buyer) {
        PP.ui.toast('请填写买方名称')
        return
      }
      if (!amount || amount <= 0) {
        PP.ui.toast('请填写正确的订单总额')
        return
      }

      if (mode === 'edit') {
        view.list = view.list.map(function (a) {
          if (a.id !== order.id) return a
          return decorate(Object.assign({}, a, {
            buyer: buyer,
            product: form.product.trim() || a.product,
            amount: amount,
            currency: form.currency,
            contract: form.contract.trim() || a.contract
          }))
        })
        sheet.close()
        refreshCounts()
        applyFilters()
        PP.ui.toast('订单已保存', { icon: 'success' })
        return
      }

      // 新建：待关联 / 未发货 / 关联比例 0%（对齐源页面提交创建的默认值）
      var seq = view.list.length + 1
      var now = new Date()
      var created = decorate({
        id: 'new-' + seq + '-' + now.getTime(),
        no: String(now.getTime()),
        contract: form.contract.trim() || 'NEW' + seq,
        time: PP.format.isoDate(now) + ' ' +
          pad(now.getHours()) + ':' + pad(now.getMinutes()) + ':' + pad(now.getSeconds()),
        buyer: buyer,
        product: form.product.trim() || '-',
        amount: amount,
        currency: form.currency,
        orderStatus: '待关联',
        shipStatus: '未发货',
        creator: '11022921@qq.com',
        ratio: '0%'
      })

      view.list = [created].concat(view.list)
      sheet.close()
      refreshCounts()
      applyFilters()
      PP.ui.toast('订单创建成功', { icon: 'success' })
    }

    function openForm(mode, order) {
      var form = mode === 'edit'
        ? {
          buyer: order.buyer,
          product: order.product,
          amount: String(order.amount),
          currency: order.currency,
          contract: order.contract
        }
        : { buyer: '', product: '', amount: '', currency: 'USD', contract: '' }

      var sheet = PP.ui.sheet({
        title: mode === 'edit' ? '编辑订单' : '创建订单',
        body: formBody(form),
        footer:
          '<div class="sheet-footer">' +
            '<button type="button" class="btn btn--ghost" data-close>取消</button>' +
            '<button type="button" class="btn btn--primary" data-submit>' +
              (mode === 'edit' ? '保存' : '提交创建') +
            '</button>' +
          '</div>',
        onMount: function (root) {
          dom.on(root, 'input', '#om-f-buyer', function (e, el) { form.buyer = el.value })
          dom.on(root, 'input', '#om-f-product', function (e, el) { form.product = el.value })
          dom.on(root, 'input', '#om-f-amount', function (e, el) { form.amount = el.value })
          dom.on(root, 'input', '#om-f-contract', function (e, el) { form.contract = el.value })

          dom.on(root, 'click', '[data-ccy]', function (e, el) {
            form.currency = el.getAttribute('data-ccy')
            dom.qsa('[data-ccy]', root).forEach(function (btn) {
              btn.setAttribute('aria-selected', btn === el ? 'true' : 'false')
            })
          })

          dom.on(root, 'click', '[data-submit]', function () {
            submitForm(sheet, mode, order, form)
          })
        }
      })
    }

    /* ---------------------------------------------- 导出列表 */

    function exportOrders() {
      if (!view.rows.length) {
        PP.ui.toast('没有可导出的订单')
        return
      }

      var header = ['序号', '订单编号', '合同号', '创建时间', '买方名称', '商品名称', '订单总额',
        '订单币种', '订单状态', '发货状态', '创建人', '收款关联比例']
      var rows = view.rows.map(function (a, i) {
        return [
          i + 1, a.no, a.contract, a.time, a.buyer, a.product,
          PP.format.fmtNum(a.amount), a.currency, a.orderStatus, a.shipStatus, a.creator, a.ratio
        ]
      })
      var tsv = [header].concat(rows).map(function (r) { return r.join('\t') }).join('\n')

      dom.copy(tsv).then(function () {
        PP.ui.toast('已复制到剪贴板，可粘贴到表格', { icon: 'success' })
      }).catch(function () {
        PP.ui.toast('复制失败，请手动选择文本复制')
      })
    }

    /* ---------------------------------------------- 页面定义 */

    PP.definePage('order-management', {
      mount: function (root, ctx) {
        view = {
          root: root,
          // 每次挂载都从常量复制一份，编辑 / 新建不污染演示数据
          list: ORDERS.map(decorate),
          rows: [],
          searchText: '',
          statusSeg: '',
          filters: emptyFilters()
        }

        refreshCounts()

        var offs = [
          // 状态统计：点击即筛选
          dom.on(root, 'click', '[data-status]', function (e, el) {
            var next = el.getAttribute('data-status')
            if (next === view.statusSeg) return
            view.statusSeg = next
            dom.qsa('[data-status]', root).forEach(function (btn) {
              btn.setAttribute('aria-pressed', btn.getAttribute('data-status') === next ? 'true' : 'false')
            })
            applyFilters()
          }),

          // 搜索
          dom.on(root, 'input', '#om-search', function (e, el) {
            view.searchText = el.value
            dom.toggle(dom.qs('#om-clear', root), !!el.value)
            applyFilters()
          }),
          dom.on(root, 'click', '#om-clear', function () {
            var input = dom.qs('#om-search', root)
            input.value = ''
            view.searchText = ''
            dom.toggle(dom.qs('#om-clear', root), false)
            applyFilters()
            input.focus()
          }),

          dom.on(root, 'click', '#om-filter', openFilter),
          dom.on(root, 'click', '#om-export', exportOrders),
          dom.on(root, 'click', '#om-create', function () { openForm('create', null) }),

          // 卡片点击 = 查看详情（列表重渲染后依然有效）
          dom.on(root, 'click', '.oc-main', function (e, el) {
            var a = findById(el.getAttribute('data-id'))
            if (a) openDetail(a)
          })
        ]

        applyFilters()

        ctx.onCleanup(function () {
          offs.forEach(function (off) { off() })
          view = null
        })
      }
    })
  })((window.PP = window.PP || {}))

  <script data-bundle-from="js/pages/exchange.js">
  /* ===== 脚本 · js/pages/exchange.js ===== */
  /* ============================================================
     pages/exchange.js · 换汇中心
     ------------------------------------------------------------
     职责：卖出/买入币种与金额联动试算、历史列表渲染、确认与成功弹层。
     金额算法与小程序版逐行对齐：
       参考汇率 = RATES[buy] / RATES[sell]（四舍五入到 4 位小数）
       买入金额 = 卖出金额 × 参考汇率
       可提交条件 = 金额 > 0 且 ≤ 卖出币种余额 且 卖出 ≠ 买入

     状态放在模块作用域闭包变量里 —— 页面可反复挂载/卸载，
     闭包变量随实例生灭，不会把上一次的输入带到下一次。
     ============================================================ */
  (function (PP) {
    'use strict'

    /** 币种表（演示数据，字段与接口同名；余额与 wallet 页一致） */
    var CURRENCIES = [
      { code: 'USD', name: '美元', flag: '🇺🇸', symbol: '$', balance: 842500.20, balanceText: '$ 842,500.20' },
      { code: 'CNH', name: '人民币', flag: '🇨🇳', symbol: '¥', balance: 890000.00, balanceText: '¥ 890,000.00' },
      { code: 'EUR', name: '欧元', flag: '🇪🇺', symbol: '€', balance: 156920.00, balanceText: '€ 156,920.00' },
      { code: 'GBP', name: '英镑', flag: '🇬🇧', symbol: '£', balance: 42000.00, balanceText: '£ 42,000.00' },
      { code: 'HKD', name: '港币', flag: '🇭🇰', symbol: 'HK$', balance: 125000.00, balanceText: 'HK$ 125,000.00' },
      { code: 'AUD', name: '澳元', flag: '🇦🇺', symbol: 'A$', balance: 68400.00, balanceText: 'A$ 68,400.00' }
    ]

    /** 以 USD 为锚的参考汇率（演示数据） */
    var RATES = { USD: 1, CNH: 7.2345, EUR: 0.9234, GBP: 0.7891, HKD: 7.8102, AUD: 1.5234 }

    /** 换汇历史（演示数据），每次挂载都从这份原始数据重新展开 */
    var RECORDS = [
      { pair: 'USD → CNH', time: '2026-04-01 09:42', amount: '- $ 50,000.00', rate: '7.2345', status: '已完成' },
      { pair: 'EUR → USD', time: '2026-04-01 15:45', amount: '- € 12,000.00', rate: '1.0842', status: '已完成' },
      { pair: 'USD → HKD', time: '2026-03-30 11:08', amount: '- $ 8,000.00', rate: '7.8102', status: '已完成' }
    ]

    /** 汇率锁定倒计时秒数（与源文件一致） */
    var LOCK_SECONDS = 30

    /** 当前实例的可变状态；未挂载时为 null */
    var view = null

    function findCcy(code) {
      for (var i = 0; i < CURRENCIES.length; i++) {
        if (CURRENCIES[i].code === code) return CURRENCIES[i]
      }
      return null
    }

    /** 参考汇率 = 目标币种 / 源币种 */
    function currentRate() {
      var r = RATES[view.buy] / RATES[view.sell]
      return Math.round(r * 10000) / 10000
    }

    /** 只保留数字与一个小数点 */
    function sanitize(raw) {
      var v = String(raw || '').replace(/[^\d.]/g, '')
      var firstDot = v.indexOf('.')
      if (firstDot >= 0) {
        v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '')
      }
      return v
    }

    /* ---------------------------------------------- 渲染 */

    function recordRow(item) {
      var tone = item.status === '已完成' ? 'success' : 'warning'
      return (
        '<li class="list-row">' +
        '<span class="tile" data-tone="warning" aria-hidden="true">' +
        '<svg aria-hidden="true"><use href="#i-swap"/></svg></span>' +
        '<div class="row-body">' +
        '<span class="row-title">' + PP.dom.esc(item.pair) + '</span>' +
        '<span class="row-sub">' + PP.dom.esc(item.time) + ' · 汇率 ' + PP.dom.esc(item.rate) + '</span>' +
        '</div>' +
        '<div class="rec-right">' +
        '<span class="row-value num" data-amount>' + PP.dom.esc(item.amount) + '</span>' +
        '<span class="pill rec-pill" data-tone="' + tone + '">' + PP.dom.esc(item.status) + '</span>' +
        '</div>' +
        '</li>'
      )
    }

    function renderRecords() {
      PP.dom.renderList(PP.dom.qs('#rec-list', view.root), view.records, recordRow)
    }

    /** 表单与按钮状态随币种/金额重算 */
    function paint() {
      var dom = PP.dom
      var rate = currentRate()
      var amount = parseFloat(view.amount) || 0
      var buyValue = amount * rate
      var sellCcy = findCcy(view.sell)
      var buyCcy = findCcy(view.buy)

      view.canSubmit = amount > 0 && amount <= sellCcy.balance && view.sell !== view.buy

      dom.qs('#sell-flag', view.root).textContent = sellCcy.flag
      dom.qs('#sell-code', view.root).textContent = view.sell
      dom.qs('#sell-bal', view.root).textContent = sellCcy.balanceText
      dom.qs('#buy-flag', view.root).textContent = buyCcy.flag
      dom.qs('#buy-code', view.root).textContent = view.buy
      dom.qs('#buy-rate', view.root).textContent =
        '参考汇率 1 ' + view.sell + ' = ' + rate.toFixed(4) + ' ' + view.buy
      dom.qs('#buy-amount', view.root).textContent =
        amount > 0 ? PP.format.withSymbol(buyCcy.symbol, buyValue) : '—'
      dom.qs('#submit-swap', view.root)
        .setAttribute('aria-disabled', view.canSubmit ? 'false' : 'true')
    }

    /** 金额错误内联展示（同时保留源实现的 toast 文案） */
    function showAmountError(message) {
      var box = PP.dom.qs('#amount-error', view.root)
      var input = PP.dom.qs('#sell-amount', view.root)
      if (box) {
        box.textContent = message || ''
        box.hidden = !message
      }
      if (input) {
        if (message) input.setAttribute('aria-invalid', 'true')
        else input.removeAttribute('aria-invalid')
      }
    }

    /* ---------------------------------------------- 币种选择 */

    function pickCcy(side, code) {
      // 与另一侧相同时自动对调，避免同币种互换
      if (side === 'sell' && code === view.buy) view.buy = view.sell
      else if (side === 'buy' && code === view.sell) view.sell = view.buy
      if (side === 'sell') view.sell = code
      else view.buy = code

      showAmountError('')
      paint()
    }

    function openPicker(side) {
      PP.ui.picker({
        title: side === 'sell' ? '选择卖出币种' : '选择买入币种',
        value: side === 'sell' ? view.sell : view.buy,
        options: CURRENCIES.map(function (c) {
          return {
            value: c.code,
            title: c.flag + ' ' + c.code,
            sub: c.name,
            valueText: c.balanceText
          }
        })
      }).then(function (code) {
        if (!code || !view) return
        pickCcy(side, code)
      })
    }

    /* ---------------------------------------------- 汇率锁定倒计时 */

    function clearCountdown() {
      if (view && view.timer) {
        clearInterval(view.timer)
        view.timer = null
      }
    }

    function paintCountdown(el, left) {
      if (el) el.textContent = '00:' + (left < 10 ? '0' + left : left)
    }

    function startCountdown(el) {
      clearCountdown()
      var left = LOCK_SECONDS
      paintCountdown(el, left)
      view.timer = setInterval(function () {
        left -= 1
        if (left <= 0) {
          var sheet = view.sheet
          clearCountdown()
          if (sheet) sheet.close()
          PP.ui.toast('汇率已刷新，请重新确认')
          return
        }
        paintCountdown(el, left)
      }, 1000)
    }

    /* ---------------------------------------------- 确认与结果弹层 */

    function detailRow(label, value, isNum) {
      return (
        '<div class="detail-row">' +
        '<span class="detail-label">' + label + '</span>' +
        '<span class="detail-value' + (isNum ? ' num' : '') + '">' + value + '</span>' +
        '</div>'
      )
    }

    function openConfirm() {
      var dom = PP.dom
      var esc = dom.esc
      var rate = currentRate()
      var amount = parseFloat(view.amount) || 0
      var sellFmt = PP.format.fmtNum(amount)
      var buyFmt = PP.format.fmtNum(amount * rate)

      var body =
        '<p class="confirm-lock">' +
        '<span class="countdown num" id="fx-countdown" role="timer" ' +
        'aria-label="汇率剩余锁定时间">00:30</span></p>' +
        detailRow('卖出', '- ' + esc(sellFmt) + ' ' + esc(view.sell), true) +
        detailRow('买入', '+ ' + esc(buyFmt) + ' ' + esc(view.buy), true) +
        detailRow('交易汇率', '1 ' + esc(view.sell) + ' = ' + esc(rate.toFixed(4)) + ' ' + esc(view.buy), true) +
        detailRow('手续费', '免手续费', false) +
        detailRow('预计到账', esc(buyFmt) + ' ' + esc(view.buy), true) +
        '<div class="field pwd-field">' +
        '<label class="field-label" for="confirm-pwd">交易密码</label>' +
        '<input class="field-input" id="confirm-pwd" type="password" inputmode="numeric" ' +
        'maxlength="6" autocomplete="off" placeholder="请输入 6 位交易密码" ' +
        'aria-describedby="confirm-pwd-error">' +
        '<span class="field-hint">汇率锁定时长 30 秒，超时后需重新确认</span>' +
        '<p class="field-error" id="confirm-pwd-error" role="alert" hidden></p>' +
        '</div>'

      var footer =
        '<div class="sheet-footer">' +
        '<button type="button" class="btn btn--ghost" data-cancel>取消</button>' +
        '<button type="button" class="btn btn--primary" data-ok aria-disabled="true">确定交易</button>' +
        '</div>'

      view.sheet = PP.ui.sheet({
        title: '确认换汇交易',
        body: body,
        footer: footer,
        onMount: function (sheet, api) {
          var pwd = dom.qs('#confirm-pwd', sheet)
          var okBtn = dom.qs('[data-ok]', sheet)
          var err = dom.qs('#confirm-pwd-error', sheet)

          sheet.addEventListener('input', function () {
            var v = String(pwd.value || '').replace(/\D/g, '').slice(0, 6)
            if (v !== pwd.value) pwd.value = v
            view.password = v
            okBtn.setAttribute('aria-disabled', v.length === 6 ? 'false' : 'true')
            if (v.length === 6) {
              err.hidden = true
              pwd.removeAttribute('aria-invalid')
            }
          })

          sheet.addEventListener('click', function (e) {
            if (e.target.closest('[data-cancel]')) {
              api.close()
              return
            }
            if (!e.target.closest('[data-ok]')) return

            if (view.password.length !== 6) {
              err.textContent = '请输入 6 位交易密码'
              err.hidden = false
              pwd.setAttribute('aria-invalid', 'true')
              PP.ui.toast('请输入 6 位交易密码')
              return
            }
            submitTrade()
            api.close()
          })

          startCountdown(dom.qs('#fx-countdown', sheet))
        },
        onClose: function () {
          view.sheet = null
          clearCountdown()
        }
      })
    }

    function submitTrade() {
      clearCountdown()
      var sellCcy = findCcy(view.sell)
      var amount = parseFloat(view.amount) || 0

      view.records.unshift({
        pair: view.sell + ' → ' + view.buy,
        time: PP.format.isoDateTime(new Date()),
        amount: '- ' + sellCcy.symbol + ' ' + PP.format.fmtNum(amount),
        rate: currentRate().toFixed(4),
        status: '处理中'
      })
      view.password = ''
      renderRecords()
      openSuccess()
    }

    function openSuccess() {
      var dom = PP.dom
      var esc = dom.esc
      var rate = currentRate()
      var amount = parseFloat(view.amount) || 0
      var buyFmt = PP.format.fmtNum(amount * rate)

      var body =
        '<svg class="done-icon" aria-hidden="true"><use href="#i-check-circle"/></svg>' +
        '<p class="dialog-title">换汇申请成功</p>' +
        '<p class="dialog-desc">我们将尽快为您处理，到账后可在资产中查看</p>' +
        '<div class="dialog-detail">' +
        detailRow('卖出', esc(PP.format.fmtNum(amount)) + ' ' + esc(view.sell), true) +
        detailRow('买入', esc(buyFmt) + ' ' + esc(view.buy), true) +
        detailRow('参考汇率', '1 ' + esc(view.sell) + ' = ' + esc(rate.toFixed(4)) + ' ' + esc(view.buy), true) +

        '<button type="button" class="btn btn--primary" data-done>完成</button>' +

              api.close()

            }
            if (e.target.closest('[data-done]')) {
              api.close()
              view.ctx.back()
            }
          })
        }
      })
    }

    function resetForm() {
      view.amount = ''
      view.password = ''
      var input = PP.dom.qs('#sell-amount', view.root)
      if (input) input.value = ''
      showAmountError('')
      paint()
    }

    /* ---------------------------------------------- 页面定义 */

    PP.definePage('exchange', {
      mount: function (root, ctx) {
        var dom = PP.dom

        view = {
          root: root,
          ctx: ctx,
          sell: 'USD',
          buy: 'CNH',
          amount: '',
          password: '',
          canSubmit: false,
          records: RECORDS.slice(),
          sheet: null,
          timer: null
        }

        renderRecords()
        paint()

        /* 卖出 / 买入币种 */
        dom.on(root, 'click', '[data-pick]', function (e, el) {
          dom.haptic()
          openPicker(el.getAttribute('data-pick'))
        })

        /* 币种对调 */
        dom.on(root, 'click', '#swap-sides', function () {
          var sell = view.sell
          view.sell = view.buy
          view.buy = sell
          dom.haptic()
          showAmountError('')
          paint()
        })

        /* 金额输入 */
        dom.on(root, 'input', '#sell-amount', function (e, el) {
          var v = sanitize(el.value)
          if (v !== el.value) el.value = v
          view.amount = v
          showAmountError('')
          paint()
        })

        /* 提交 */
        dom.on(root, 'click', '#submit-swap', function () {
          if (!view.canSubmit) {
            var ccy = findCcy(view.sell)
            var amount = parseFloat(view.amount) || 0
            var msg = amount <= 0 ? '请输入换汇金额' : '超出可用余额 ' + ccy.balanceText
            showAmountError(msg)
            PP.ui.toast(msg)
            return
          }
          showAmountError('')
          openConfirm()
        })

        ctx.onCleanup(function () {
          clearCountdown()
          view = null
        })
      },

      /** 离开页面（切走或返回）时停掉倒计时，避免后台继续跑 */
      hide: function () {
        clearCountdown()
      }
    })
  })((window.PP = window.PP || {}))

  <script data-bundle-from="js/pages/international-remittance.js">
  /* ===== 脚本 · js/pages/international-remittance.js ===== */
  /* ============================================================
     pages/international-remittance.js · 国际汇款向导
     ------------------------------------------------------------
     职责：三步流转、币种选择、费用试算、表单校验、付款材料、结果页。
     费用算法与小程序版逐行对齐（常量与源文件一致）：
       手续费   = 金额 > 0 ? max(金额 × 0.1%, 15) : 0
       全额到账费 = 勾选「是」且金额 > 0 ? 25 : 0
       费用合计 = 手续费 + 全额到账费
       扣款金额 = 汇出金额 + 费用合计
       到账金额 = 金额 > 手续费 ? 金额 - 手续费 : 0
     注意最后一条是源实现的口径（不含全额到账费），此处保持不改。

     步骤条状态写成 data-state 属性，面板显隐用 hidden —— JS 不拼结构。
     ============================================================ */
  (function (PP) {
    'use strict'

    /** 币种与可用余额（演示数据，字段与接口同名） */
    var CURRENCIES = [
      { code: 'USD', name: '美元', flag: '🇺🇸', symbol: '$', balance: 128450.00, balanceText: '$ 128,450.00' },
      { code: 'EUR', name: '欧元', flag: '🇪🇺', symbol: '€', balance: 86420.50, balanceText: '€ 86,420.50' },
      { code: 'GBP', name: '英镑', flag: '🇬🇧', symbol: '£', balance: 53120.00, balanceText: '£ 53,120.00' },
      { code: 'JPY', name: '日元', flag: '🇯🇵', symbol: '¥', balance: 9800000, balanceText: '¥ 9,800,000' },
      { code: 'AUD', name: '澳元', flag: '🇦🇺', symbol: 'A$', balance: 41200.00, balanceText: 'A$ 41,200.00' },
      { code: 'CAD', name: '加元', flag: '🇨🇦', symbol: 'C$', balance: 37650.00, balanceText: 'C$ 37,650.00' }
    ]

    /** 费率规则（与源文件常量一致） */
    var FEE_RATE = 0.001      // 0.1%
    var FEE_MIN = 15          // 最低手续费
    var FULL_FEE = 25         // 全额到账费
    var MAX_FILE = 20 * 1024 * 1024 // 单个材料 20MB

    /** 汇款人（演示数据，与源文件一致） */
    var REMITTER = 'PPTRANSFER LIMITED'

    /** 校验错误 → 展示位与字段的映射 */
    var ERROR_TARGET = {
      currency: { box: '#err-currency', field: '#ccy-trigger' },
      name: { box: '#err-name', field: '#beneficiary-name' },
      account: { box: '#err-account', field: '#beneficiary-account' },
      swift: { box: '#err-swift', field: '#swift-code' },
      amount: { box: '#err-amount', field: '#amount' },
      password: { box: '#err-password', field: '#trade-password' }
    }

    /** 当前实例的可变状态；未挂载时为 null */
    var view = null

    function findCcy(code) {
      for (var i = 0; i < CURRENCIES.length; i++) {
        if (CURRENCIES[i].code === code) return CURRENCIES[i]
      }
      return null
    }

    function pad(n) {
      return n < 10 ? '0' + n : '' + n
    }

    function sanitize(raw) {
      var v = String(raw || '').replace(/[^\d.]/g, '')
      var firstDot = v.indexOf('.')
      if (firstDot >= 0) {
        v = v.slice(0, firstDot + 1) + v.slice(firstDot + 1).replace(/\./g, '')
      }
      return v
    }

    /* ---------------------------------------------- 费用试算 */

    function calcFee() {
      var amt = parseFloat(view.amount) || 0
      var fee = amt > 0 ? Math.max(amt * FEE_RATE, FEE_MIN) : 0
      var full = view.fullArrival && amt > 0 ? FULL_FEE : 0
      var total = fee + full
      return { amt: amt, fee: fee, full: full, total: total, deduct: amt + total }
    }

    /** 金额带币种；为 0 时显示破折号（与源实现一致） */
    function money(value) {
      return value > 0 ? PP.format.fmtNum(value) + ' ' + view.currency : '—'
    }

    function paintFees() {
      var dom = PP.dom
      var f = calcFee()

      dom.qs('#s1-fee', view.root).textContent = money(f.fee)
      dom.qs('#s1-full', view.root).textContent = money(f.full)
      dom.qs('#s1-total', view.root).textContent = money(f.total)
      dom.qs('#s1-deduct', view.root).textContent = money(f.deduct)

      view.amountFmt = PP.format.fmtNum(f.amt)
      view.arriveFmt = PP.format.fmtNum(f.amt > f.fee && f.amt > 0 ? f.amt - f.fee : 0)
      view.feeBearer = view.fullArrival ? '付款人全额承担' : '共同承担/付款人'
    }

    /* ---------------------------------------------- 校验 */

    function clearError(key) {
      var t = ERROR_TARGET[key]
      if (!t) return
      var box = PP.dom.qs(t.box, view.root)
      var field = PP.dom.qs(t.field, view.root)
      if (box) {
        box.textContent = ''
        box.hidden = true
      }
      if (field) field.removeAttribute('aria-invalid')
    }

    function clearErrors() {
      Object.keys(ERROR_TARGET).forEach(clearError)
    }

    function showError(key, message) {
      clearErrors()
      var t = ERROR_TARGET[key]
      if (!t) return
      var box = PP.dom.qs(t.box, view.root)
      var field = PP.dom.qs(t.field, view.root)
      if (box) {
        box.textContent = message
        box.hidden = false
      }
      if (field) field.setAttribute('aria-invalid', 'true')
    }

    /** 返回 { key, message } 或 null；顺序与源实现 validate 一致 */
    function validate() {
      var amt = parseFloat(view.amount) || 0
      var ccy = findCcy(view.currency)

      if (!view.currency) return { key: 'currency', message: '请选择付款币种' }
      if (!view.beneficiaryName) return { key: 'name', message: '请输入收款人账户名称' }
      if (!view.beneficiaryAccount) return { key: 'account', message: '请输入收款人账号' }
      if (!view.swiftCode) return { key: 'swift', message: '请输入 Swift Code' }
      if (!(amt > 0)) return { key: 'amount', message: '请输入汇出金额' }
      if (ccy && amt > ccy.balance) return { key: 'amount', message: '超出可用余额 ' + ccy.balanceText }
      return null
    }

    function checkNext() {
      var amt = parseFloat(view.amount) || 0
      var ccy = findCcy(view.currency)
      view.canNext = !!(view.currency && view.beneficiaryName && view.beneficiaryAccount &&
        view.swiftCode && amt > 0 && ccy && amt <= ccy.balance)
      PP.dom.qs('#next-step', view.root)
        .setAttribute('aria-disabled', view.canNext ? 'false' : 'true')
      return view.canNext
    }

    /* ---------------------------------------------- 渲染 */

    function paintCcy() {
      var dom = PP.dom
      var ccy = findCcy(view.currency)
      var value = dom.qs('#ccy-value', view.root)
      var flag = dom.qs('#ccy-flag', view.root)

      value.textContent = view.currency || '请选择币种'
      if (view.currency) value.classList.remove('placeholder')
      else value.classList.add('placeholder')

      flag.hidden = !ccy
      if (ccy) flag.textContent = ccy.flag

      var hint = ccy ? '可用余额 ' + ccy.balanceText : ''
      ;['#ccy-balance', '#amount-balance'].forEach(function (sel) {
        var el = dom.qs(sel, view.root)
        el.textContent = hint
        el.hidden = !ccy
      })
      dom.qs('#full-fee-ccy', view.root).textContent = view.currency || ''
    }

    function paintFile() {
      var dom = PP.dom
      dom.qs('#upload-trigger', view.root).hidden = !!view.fileName
      dom.qs('#file-row', view.root).hidden = !view.fileName
      dom.qs('#file-name', view.root).textContent = view.fileName
    }

    function paintArrival() {
      PP.dom.qsa('[data-arrival]', view.root).forEach(function (el) {
        var on = (el.getAttribute('data-arrival') === '1') === view.fullArrival
        el.setAttribute('aria-checked', on ? 'true' : 'false')
      })
    }

    /** 第 2 步的确认信息 */
    function paintSummary() {
      var dom = PP.dom
      var f = calcFee()
      var cur = view.currency ? ' ' + view.currency : ''

      dom.qs('#s2-currency', view.root).textContent = view.currency
      dom.qs('#s2-name', view.root).textContent = view.beneficiaryName
      dom.qs('#s2-account', view.root).textContent = view.beneficiaryAccount
      dom.qs('#s2-swift', view.root).textContent = view.swiftCode
      dom.qs('#s2-remitter', view.root).textContent = view.remitter
      dom.qs('#s2-file', view.root).textContent = view.fileName || '未上传'
      dom.qs('#s2-remark', view.root).textContent = view.remark || '—'
      dom.qs('#s2-amount', view.root).textContent = view.amountFmt + cur
      dom.qs('#s2-fee', view.root).textContent = money(f.fee)
      dom.qs('#s2-bearer', view.root).textContent = view.feeBearer
      dom.qs('#s2-arrive', view.root).textContent = view.arriveFmt + cur
    }

    function renderStep() {
      var dom = PP.dom

      dom.qs('#panel-1', view.root).hidden = view.step !== 1
      dom.qs('#panel-2', view.root).hidden = view.step !== 2
      dom.qs('#panel-3', view.root).hidden = view.step !== 3

      dom.qsa('[data-step]', view.root).forEach(function (el) {
        var n = Number(el.getAttribute('data-step'))
        el.setAttribute('data-state', view.step > n ? 'done' : (view.step === n ? 'on' : 'off'))
        el.setAttribute('aria-current', view.step === n ? 'step' : 'false')
        var dot = el.querySelector('.step-dot')
        if (dot) dot.textContent = view.step > n ? '✓' : String(n)
      })

      dom.qsa('[data-line]', view.root).forEach(function (el) {
        var n = Number(el.getAttribute('data-line'))
        el.setAttribute('data-state', view.step > n ? 'on' : 'off')
      })
    }

    /** 步骤切换后回到页首，避免停在上一屏的滚动位置 */
    function scrollTop() {
      var box = view.root.parentNode
      if (box) box.scrollTop = 0
    }

    /* ---------------------------------------------- 流程 */

    function goStep(step) {
      view.step = step
      renderStep()
      scrollTop()
    }

    function goStep2() {
      var err = validate()
      if (err) {
        showError(err.key, err.message)
        PP.ui.toast(err.message)
        var field = PP.dom.qs(ERROR_TARGET[err.key].field, view.root)
        if (field && field.focus) field.focus({ preventScroll: false })
        return
      }
      clearErrors()
      paintFees()
      paintSummary()
      view.password = ''
      PP.dom.qs('#trade-password', view.root).value = ''
      PP.dom.qs('#submit-apply', view.root).setAttribute('aria-disabled', 'true')
      goStep(2)
    }

    function submitApply() {
      if (view.password.length !== 6) {
        showError('password', '请输入 6 位交易密码')
        PP.ui.toast('请输入 6 位交易密码')

        return
      }
      clearError('password')
      var now = new Date()
      view.refNo = 'IR' + now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) +
        String(Date.now()).slice(-6)
      PP.dom.qs('#ref-no', view.root).textContent = view.refNo
      view.password = ''
      PP.dom.qs('#trade-password', view.root).value = ''

    }

    function resetAll() {
      view.beneficiaryName = ''
      view.beneficiaryAccount = ''
      view.swiftCode = ''
      view.amount = ''
      view.amountFmt = '0.00'
      view.arriveFmt = '0.00'
      view.remark = ''
      view.fileName = ''
      view.password = ''
      view.refNo = ''
      view.canNext = false
      view.fullArrival = false

      var dom = PP.dom
      ;['#beneficiary-name', '#beneficiary-account', '#swift-code', '#amount', '#remark',
        '#trade-password'].forEach(function (sel) {
        var el = dom.qs(sel, view.root)
        if (el) el.value = ''
      })
      var file = dom.qs('#file-input', view.root)
      if (file) file.value = ''

      clearErrors()
      paintArrival()
      paintFile()
      paintFees()
      checkNext()
      goStep(1)
    }

    /* ---------------------------------------------- 页面定义 */

    PP.definePage('international-remittance', {
      mount: function (root, ctx) {
        var dom = PP.dom

        view = {
          root: root,
          ctx: ctx,
          step: 1,
          currency: '',
          beneficiaryName: '',
          beneficiaryAccount: '',
          swiftCode: '',
          amount: '',
          amountFmt: '0.00',
          arriveFmt: '0.00',
          fullArrival: false,
          remark: '',
          remitter: REMITTER,
          fileName: '',
          feeBearer: '共同承担/付款人',
          canNext: false,
          password: '',
          refNo: ''
        }

        paintCcy()
        paintArrival()
        paintFile()
        paintFees()
        checkNext()
        renderStep()

        /* 付款币种 */
        dom.on(root, 'click', '#ccy-trigger', function () {

            title: '选择付款币种',
            value: view.currency,
            options: CURRENCIES.map(function (c) {
              return {
                value: c.code,
                title: c.flag + ' ' + c.code,
                sub: '可用余额 ' + c.balanceText
              }
            })
          }).then(function (code) {

            view.currency = code
            clearError('currency')
            paintCcy()
            paintFees()

          view.beneficiaryName = el.value
          clearError('name')
          checkNext()
        })
        dom.on(root, 'input', '#beneficiary-account', function (e, el) {
          view.beneficiaryAccount = el.value
          clearError('account')
          checkNext()
        })
        dom.on(root, 'input', '#swift-code', function (e, el) {
          var v = String(el.value || '').toUpperCase()
          if (v !== el.value) el.value = v
          view.swiftCode = v
          clearError('swift')
          checkNext()
        })
        dom.on(root, 'input', '#amount', function (e, el) {
          var v = sanitize(el.value)
          if (v !== el.value) el.value = v
          view.amount = v
          clearError('amount')
          paintFees()
          checkNext()
        })
        dom.on(root, 'input', '#remark', function (e, el) {
          view.remark = el.value
        })

        /* 全部余额 */
        dom.on(root, 'click', '#use-all', function () {
          var ccy = findCcy(view.currency)
          if (!ccy) {
            PP.ui.toast('请先选择付款币种')
            return
          }
          view.amount = String(ccy.balance)
          dom.qs('#amount', root).value = view.amount
          clearError('amount')
          paintFees()
          checkNext()
        })

        /* 是否全额到账 */
        dom.on(root, 'click', '[data-arrival]', function (e, el) {
          view.fullArrival = el.getAttribute('data-arrival') === '1'
          paintArrival()
          paintFees()
        })

        /* 付款材料 */
        dom.on(root, 'click', '#upload-trigger', function () {
          var input = dom.qs('#file-input', root)
          if (input) input.click()
        })
        dom.on(root, 'change', '#file-input', function (e, el) {
          var file = el.files && el.files[0]
          if (!file) return
          if (file.size > MAX_FILE) {
            el.value = ''
            PP.ui.toast('文件不能超过 20MB')
            return
          }
          view.fileName = file.name
          paintFile()
        })
        dom.on(root, 'click', '#file-remove', function () {
          view.fileName = ''
          var input = dom.qs('#file-input', root)
          if (input) input.value = ''
          paintFile()
        })

        /* 步骤流转 */
        dom.on(root, 'click', '#next-step', goStep2)
        dom.on(root, 'click', '#prev-step', function () { goStep(1) })
        dom.on(root, 'click', '#submit-apply', submitApply)
        dom.on(root, 'input', '#trade-password', function (e, el) {
          var v = String(el.value || '').replace(/\D/g, '').slice(0, 6)
          if (v !== el.value) el.value = v
          view.password = v
          if (v.length === 6) clearError('password')
          dom.qs('#submit-apply', root)
            .setAttribute('aria-disabled', v.length === 6 ? 'false' : 'true')
        })

        /* 结果页 */
        dom.on(root, 'click', '#copy-ref', function () {
          dom.copy(view.refNo).then(function () {
            PP.ui.toast('汇款单号已复制')
          }).catch(function () {
            PP.ui.toast('复制失败，请长按选择')
          })
        })
        dom.on(root, 'click', '#reset-all', resetAll)
        dom.on(root, 'click', '#finish', function () { ctx.back() })

        ctx.onCleanup(function () {
          view = null
        })
      }
    })
  })((window.PP = window.PP || {}))
