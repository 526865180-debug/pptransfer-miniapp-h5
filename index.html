  /* ===== 样式 · styles/tokens.css ===== */
  /* ============================================================
     PPTransfer H5 · 设计令牌（Design Tokens）
     ------------------------------------------------------------
     分两层：
       ① 原始层（primitive）—— 色阶、尺度，只描述「是什么」
       ② 语义层（semantic）—— 别名，描述「用在哪」，组件只许引用语义层
     这样换肤 / 换品牌时只改原始层，组件代码零改动。

     尺寸基准：375px 视口（原小程序 750rpx ÷ 2）。
     单位一律用 px，不做全局缩放 —— 窄屏上文字仍保持 14px 可读，
     这是相对 rpx 换算方案在可访问性上的主动取舍。
     ============================================================ */

  :root {
    /* ---------- ① 原始层 · 品牌蓝 ---------- */
    --blue-50: #eff6ff;
    --blue-100: #dbeafe;
    --blue-400: #60a5fa;
    --blue-500: #3b82f6;
    --blue-600: #2563eb;
    --blue-700: #1d4ed8;
    --blue-900: #1e3a8a;

    /* ---------- ① 原始层 · 中性灰 ---------- */
    --slate-50: #f8fafc;
    --slate-100: #f1f5f9;
    --slate-200: #e2e8f0;
    --slate-300: #cbd5e1;
    --slate-400: #94a3b8;
    --slate-500: #64748b;
    --slate-600: #475569;
    --slate-700: #334155;
    --slate-900: #0f172a;

    /* ---------- ① 原始层 · 语义色阶 ---------- */
    --emerald-50: #ecfdf5;
    --emerald-600: #059669;
    --amber-50: #fffbeb;
    --amber-600: #d97706;
    --red-50: #fef2f2;
    --red-600: #dc2626;
    --orange-50: #fff7ed;
    --orange-600: #ea580c;
    --indigo-50: #eef2ff;
    --indigo-600: #4f46e5;
    --violet-50: #f5f3ff;
    --violet-600: #7c3aed;

    /* ---------- ② 语义层 · 品牌与状态 ---------- */
    --color-brand: var(--blue-600);
    --color-brand-strong: var(--blue-700);
    --color-brand-deep: var(--blue-900);
    --color-brand-soft: var(--blue-50);
    --color-brand-tint: var(--blue-100);

    --color-up: var(--red-600);      /* 涨 —— 国内金融惯例用红 */
    --color-down: var(--emerald-600); /* 跌 —— 用绿 */
    --color-success: var(--emerald-600);
    --color-warning: var(--amber-600);
    --color-danger: var(--red-600);
    --color-info: var(--indigo-600);

    /* ---------- ② 语义层 · 文字与表面 ---------- */
    --text-primary: var(--slate-900);
    --text-secondary: var(--slate-700);
    --text-tertiary: var(--slate-500);
    --text-quaternary: var(--slate-400);
    --text-placeholder: var(--slate-300);
    --text-on-brand: #ffffff;

    --surface-page: var(--slate-50);
    --surface-card: #ffffff;
    --surface-sunken: var(--slate-50);
    --surface-frame: var(--slate-200); /* 应用框之外的画布底色 */

    --border-subtle: var(--slate-100);
    --border-default: var(--slate-200);

    /* 状态底色（徽章 / 图标块 / 提示条） */
    --tone-brand-bg: var(--blue-50);
    --tone-brand-fg: var(--blue-600);
    --tone-success-bg: var(--emerald-50);
    --tone-success-fg: var(--emerald-600);
    --tone-warning-bg: var(--amber-50);
    --tone-warning-fg: var(--amber-600);
    --tone-danger-bg: var(--red-50);
    --tone-danger-fg: var(--red-600);
    --tone-orange-bg: var(--orange-50);
    --tone-orange-fg: var(--orange-600);
    --tone-info-bg: var(--indigo-50);
    --tone-info-fg: var(--indigo-600);
    --tone-violet-bg: var(--violet-50);
    --tone-violet-fg: var(--violet-600);
    --tone-neutral-bg: var(--slate-100);
    --tone-neutral-fg: var(--slate-500);

    /* ---------- ② 语义层 · 字体 ---------- */
    --font-sans: -apple-system, BlinkMacSystemFont, "Helvetica Neue", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    --font-num: "DIN Alternate", "SF Mono", ui-monospace, -apple-system, sans-serif;

    --text-2xs: 10px;  /* 角标、极小辅助 */
    --text-xs: 11px;   /* 次要说明 */
    --text-sm: 12px;   /* 辅助信息、pill */
    --text-md: 13px;   /* 正文次要 */
    --text-base: 14px; /* 正文基准 */
    --text-lg: 15px;   /* 区块标题 */
    --text-xl: 16px;   /* 页面标题 */
    --text-2xl: 17px;  /* 统计数字 */
    --text-3xl: 20px;  /* 金额（次级） */
    --text-4xl: 23px;  /* 金额（主） */
    --text-5xl: 30px;  /* 总资产 */

    --weight-regular: 400;
    --weight-medium: 500;
    --weight-semibold: 600;

    --leading-tight: 1.2;
    --leading-snug: 1.35;
    --leading-normal: 1.55;

    /* ---------- ② 语义层 · 间距（4pt 栅格） ---------- */
    --space-1: 4px;
    --space-2: 8px;
    --space-3: 10px;
    --space-4: 12px;
    --space-5: 14px;
    --space-6: 16px;
    --space-7: 20px;
    --space-8: 24px;
    --space-9: 32px;

    --gutter: 12px;    /* 页面左右安全边距 */
    --tap-min: 44px;   /* 最小可点区域（WCAG / iOS HIG） */

    /* ---------- ② 语义层 · 圆角 ---------- */
    --radius-inner: 10px;
    --radius-card: 14px;
    --radius-hero: 16px;
    --radius-sheet: 16px;
    --radius-sm: 6px;
    --radius-pill: 999px;

    /* ---------- ② 语义层 · 阴影与层级 ---------- */
    --shadow-card: 0 2px 8px rgba(15, 23, 42, 0.04);
    --shadow-raised: 0 8px 20px rgba(15, 23, 42, 0.08);
    --shadow-hero: 0 8px 20px rgba(29, 78, 216, 0.26);
    --shadow-brand: 0 4px 10px rgba(37, 99, 235, 0.22);
    --shadow-sheet: 0 -8px 32px rgba(15, 23, 42, 0.16);

    --z-sticky: 20;
    --z-navbar: 40;
    --z-tabbar: 40;
    --z-mask: 100;
    --z-toast: 200;

    /* ---------- ② 语义层 · 动效 ---------- */
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
    --dur-fast: 120ms;
    --dur-base: 200ms;
    --dur-slow: 320ms;

    /* ---------- 外壳几何（供布局计算复用） ---------- */
    --navbar-h: 44px;
    --tabbar-h: 52px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
    --app-max-w: 430px;
  }

  /* 用户偏好减少动效时，全部降级为瞬时 —— 可访问性要求 */
  @media (prefers-reduced-motion: reduce) {
    :root {
      --dur-fast: 1ms;
      --dur-base: 1ms;
      --dur-slow: 1ms;
    }
  }
  </style><style data-bundle-from="styles/base.css">
  /* ===== 样式 · styles/base.css ===== */
  /* ============================================================
     基础层 · 重置与排版
     只做全局默认，不承载任何组件样式
     ============================================================ */

  *,
  *::before,
  *::after {
    box-sizing: border-box;
  }

  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
  }

  body {
    margin: 0;
    height: 100vh;
    height: 100dvh;
    overflow: hidden; /* 滚动交给 .app-body，避免整页跟着弹层滚 */
    font-family: var(--font-sans);
    font-size: var(--text-base);
    line-height: var(--leading-normal);
    color: var(--text-primary);
    background: var(--surface-frame);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  /* 移动端点击不出现灰色高亮块，按压反馈一律自己做 */
  * {
    -webkit-tap-highlight-color: transparent;
  }

  h1, h2, h3, h4, h5, h6, p, figure, blockquote, dl, dd {
    margin: 0;
  }

  ul, ol {
    margin: 0;
    padding: 0;
    list-style: none;
  }

  img, svg {
    display: block;
    max-width: 100%;
  }

  button {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
  }

  input, select, textarea {
    font: inherit;
    color: inherit;
  }

  input::placeholder {
    color: var(--text-placeholder);
  }

  /* 数值一律等宽 + 表格数字，金额对齐才不会跳动 */
  .num,
  [data-num] {
    font-family: var(--font-num);
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 可访问性 ---------- */

  /* 键盘焦点清晰可见；鼠标点击不出现焦点环 */
  :focus-visible {
    outline: 2px solid var(--color-brand);
    outline-offset: 2px;
    border-radius: var(--radius-sm);
  }

  /* 仅屏幕阅读器可见 —— 用于补充语义标签 */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  /* 跳转主内容 —— 键盘用户可直达正文 */
  .skip-link {
    position: absolute;
    left: -9999px;
    top: 0;
    z-index: 999;
    padding: var(--space-2) var(--space-4);
    background: var(--surface-card);
    color: var(--color-brand);
    border-radius: var(--radius-inner);
    font-weight: var(--weight-semibold);
  }
  .skip-link:focus {
    left: var(--space-4);
    top: var(--space-2);
  }

  /* 折叠状态用 hidden 属性统一控制 */
  [hidden] {
    display: none !important;
  }
  </style><style data-bundle-from="styles/components.css">
  /* ===== 样式 · styles/components.css ===== */
  /* ============================================================
     组件层 · 通用组件库
     ------------------------------------------------------------
     约定：
       1. 只引用 tokens.css 的语义层变量，不出现硬编码色值
       2. 色调统一走 data-tone 属性（blue/success/warning/danger/…），
          避免 `.pill.blue` 这类裸类名污染全局命名空间
       3. 每个可交互组件都有 hover / active / focus-visible / disabled 四态
       4. 可点区域最小 44px（--tap-min），不足的用 padding 撑开
     ============================================================ */

  /* ============ 卡片 ============ */
  .card {
    background: var(--surface-card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
  }

  /* 带内边距 + 上下留白的区块卡片 */
  .card--section {
    margin: var(--space-4) var(--gutter) 0;
    padding: var(--space-6);
  }

  /* ============ 区块标题 ============ */
  .section-head {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-4);
    margin-bottom: var(--space-4);
  }
  .section-title {
    display: block;
    font-size: var(--text-lg);
    font-weight: var(--weight-semibold);
    line-height: var(--leading-tight);
    color: var(--text-primary);
  }
  .section-sub {
    display: block;
    margin-top: 3px;
    font-size: var(--text-2xs);
    color: var(--text-quaternary);
  }
  .section-link {
    flex-shrink: 0;
    padding: var(--space-1) 0;
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--color-brand);
    min-height: 0;
  }
  .section-link:active {
    opacity: 0.6;
  }

  /* ============ 渐变资产卡 ============ */
  .hero {
    position: relative;
    padding: var(--space-7) 18px;
    border-radius: var(--radius-hero);
    background: linear-gradient(135deg, var(--color-brand-deep) 0%, var(--color-brand-strong) 55%, var(--blue-500) 100%);
    box-shadow: var(--shadow-hero);
    overflow: hidden;
    color: var(--text-on-brand);
  }
  /* 装饰圆：纯装饰，不进无障碍树 */
  .hero-deco {
    position: absolute;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.08);
    pointer-events: none;
  }
  .hero-deco--a {
    width: 170px;
    height: 170px;
    top: -75px;
    right: -45px;
  }
  .hero-deco--b {
    width: 90px;
    height: 90px;
    bottom: -35px;
    right: 60px;
    background: rgba(255, 255, 255, 0.06);
  }
  .hero-label {
    display: block;
    font-size: var(--text-sm);
    color: rgba(255, 255, 255, 0.72);
  }
  .hero-divider {
    height: 1px;
    margin: 15px 0 13px;
    background: rgba(255, 255, 255, 0.14);
  }

  /* ============ 图标块 ============ */
  .tile {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    border-radius: var(--radius-inner);
    background: var(--tone-neutral-bg);
    color: var(--tone-neutral-fg);
  }
  .tile > svg {
    width: 21px;
    height: 21px;
  }
  .tile[data-tone='blue'] { background: var(--tone-brand-bg); color: var(--tone-brand-fg); }
  .tile[data-tone='success'] { background: var(--tone-success-bg); color: var(--tone-success-fg); }
  .tile[data-tone='warning'] { background: var(--tone-warning-bg); color: var(--tone-warning-fg); }
  .tile[data-tone='orange'] { background: var(--tone-orange-bg); color: var(--tone-orange-fg); }
  .tile[data-tone='danger'] { background: var(--tone-danger-bg); color: var(--tone-danger-fg); }
  .tile[data-tone='info'] { background: var(--tone-info-bg); color: var(--tone-info-fg); }
  .tile[data-tone='violet'] { background: var(--tone-violet-bg); color: var(--tone-violet-fg); }

  /* ============ 徽章 ============ */
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    padding: 3px 9px;
    border-radius: var(--radius-pill);
    font-size: var(--text-2xs);
    font-weight: var(--weight-semibold);
    line-height: var(--leading-snug);
    white-space: nowrap;
    background: var(--tone-neutral-bg);
    color: var(--tone-neutral-fg);
  }
  .pill[data-tone='blue'] { background: var(--tone-brand-bg); color: var(--tone-brand-fg); }
  .pill[data-tone='success'] { background: var(--tone-success-bg); color: var(--tone-success-fg); }
  .pill[data-tone='warning'] { background: var(--tone-warning-bg); color: var(--tone-warning-fg); }
  .pill[data-tone='orange'] { background: var(--tone-orange-bg); color: var(--tone-orange-fg); }
  .pill[data-tone='danger'] { background: var(--tone-danger-bg); color: var(--tone-danger-fg); }
  .pill[data-tone='info'] { background: var(--tone-info-bg); color: var(--tone-info-fg); }
  .pill[data-tone='violet'] { background: var(--tone-violet-bg); color: var(--tone-violet-fg); }

  /* ============ 按钮 ============ */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: var(--space-1);
    min-height: var(--tap-min);
    padding: 12px var(--space-6);
    border-radius: var(--radius-inner);
    font-size: var(--text-base);
    font-weight: var(--weight-semibold);
    line-height: var(--leading-tight);
    text-align: center;
    transition: background-color var(--dur-fast) var(--ease-out),
      opacity var(--dur-fast) var(--ease-out),
      transform var(--dur-fast) var(--ease-out);
  }
  .btn:active:not(:disabled) {
    transform: scale(0.97);
  }
  .btn:disabled,
  .btn[aria-disabled='true'] {
    background: var(--slate-300);
    color: var(--text-on-brand);
    box-shadow: none;
    opacity: 1;
    cursor: not-allowed;
    transform: none;
  }

  .btn--primary {
    background: var(--color-brand);
    color: var(--text-on-brand);
    box-shadow: var(--shadow-brand);
  }
  .btn--primary:hover:not(:disabled) { background: var(--color-brand-strong); }

  .btn--ghost {
    background: var(--surface-card);
    color: var(--text-secondary);
    border: 1px solid var(--border-default);
  }
  .btn--ghost:hover:not(:disabled) { background: var(--surface-sunken); }

  .btn--soft {
    background: var(--color-brand-soft);
    color: var(--color-brand);
  }
  .btn--soft:hover:not(:disabled) { background: var(--color-brand-tint); }

  .btn--sm {
    min-height: 32px;
    padding: 6px var(--space-4);
    font-size: var(--text-sm);
    border-radius: var(--radius-sm);
  }

  .btn--block { display: flex; width: 100%; }

  .btn-row {
    display: flex;
    gap: var(--space-2);
  }
  .btn-row > .btn { flex: 1; }

  /* 文字型操作（列表内「查看」「复制」等） */
  .btn-text {
    display: inline-flex;
    align-items: center;
    min-height: 32px;
    padding: 4px var(--space-2);
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--color-brand);
    border-radius: var(--radius-sm);
  }
  .btn-text:active { opacity: 0.6; }
  .btn-text[data-tone='muted'] { color: var(--text-tertiary); }

  /* ============ 分段切换 ============ */
  .seg {
    display: flex;
    padding: 3px;
    border-radius: 9px;
    background: var(--slate-100);
  }
  .seg-item {
    flex: 1;
    min-height: 32px;
    padding: 6px 0;
    border-radius: 7px;
    font-size: var(--text-sm);
    font-weight: var(--weight-medium);
    color: var(--text-tertiary);
    text-align: center;
    transition: background-color var(--dur-fast) var(--ease-out),
      color var(--dur-fast) var(--ease-out);
  }
  .seg-item[aria-selected='true'] {
    background: var(--surface-card);
    color: var(--color-brand);
    font-weight: var(--weight-semibold);
    box-shadow: 0 1px 4px rgba(15, 23, 42, 0.08);
  }

  /* ============ 分页（列表底部） ============
     由 PP.ui.pager 渲染：‹ 1 2 › +「第 x–y 条 / 共 N 条」。
     单页时不渲染内容并由组件自带 hidden，不占位。 */
  .pager {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
    padding: var(--space-4) 0 var(--space-2);
  }
  .pager-nav {
    display: flex;
    align-items: center;
    gap: var(--space-1);
  }
  .pager-btn {
    position: relative;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 32px;
    height: 32px;
    padding: 0 6px;
    font-family: var(--font-num);
    font-size: var(--text-md);
    font-weight: var(--weight-medium);
    color: var(--text-secondary);
    background: var(--surface-card);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-sm);
    transition: background-color var(--dur-fast) var(--ease-out),
      color var(--dur-fast) var(--ease-out);
  }
  /* 32px 视觉尺寸不够 44px 命中标准，用伪元素撑开（见守则「可访问性基线」） */
  .pager-btn::after {
    content: '';
    position: absolute;
    inset: -6px -2px;
  }
  .pager-btn > svg { width: 16px; height: 16px; }
  .pager-btn:active { background: var(--surface-sunken); }
  .pager-btn[aria-current='page'] {
    color: var(--text-on-brand);
    background: var(--color-brand);
    border-color: var(--color-brand);
    font-weight: var(--weight-semibold);
  }
  .pager-btn:disabled {
    color: var(--text-placeholder);
    background: var(--surface-sunken);
    border-color: var(--border-subtle);
  }
  .pager-gap {
    min-width: 20px;
    font-size: var(--text-sm);
    color: var(--text-quaternary);
    text-align: center;
  }
  .pager-info {
    font-size: var(--text-xs);
    color: var(--text-quaternary);
  }

  /* ============ 表单 ============ */
  .field { margin-bottom: var(--space-6); }
  .field-label {
    display: block;
    margin-bottom: var(--space-2);
    font-size: var(--text-md);
    font-weight: var(--weight-medium);
    color: var(--text-secondary);
  }
  .field-label[data-required]::after {
    content: ' *';
    color: var(--color-danger);
  }
  .field-input {
    display: block;
    width: 100%;
    min-height: var(--tap-min);
    padding: 12px var(--space-4);
    font-family: var(--font-num);
    font-size: var(--text-lg);
    color: var(--text-primary);
    background: var(--surface-sunken);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-inner);
    transition: border-color var(--dur-fast) var(--ease-out),
      box-shadow var(--dur-fast) var(--ease-out);
  }
  .field-input:focus {
    outline: none;
    border-color: var(--color-brand);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .field-input:disabled {
    color: var(--text-quaternary);
    background: var(--slate-100);
  }
  /* 只读输入框：值由系统返显、用户填不了（如个人账户按银行账号识别开户行）。
     保留输入框形态，但去掉「可编辑」的观感：次要色文字、聚焦不点亮。 */
  .field-input[readonly] {
    color: var(--text-secondary);
    cursor: default;
  }
  .field-input[readonly]:focus {
    border-color: var(--border-default);
    box-shadow: none;
  }
  .field-hint {
    display: block;
    margin-top: 5px;
    font-size: var(--text-xs);
    color: var(--text-quaternary);
  }
  .field-error {
    display: block;
    margin-top: 5px;
    font-size: var(--text-xs);
    color: var(--color-danger);
  }
  .field-input[aria-invalid='true'] {
    border-color: var(--color-danger);
  }

  /* ============ 列表行 ============ */
  .list { padding: 4px var(--space-6); }

  .list-row {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: 13px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .list-row:last-child { border-bottom: 0; }

  .row-body {
    flex: 1;
    min-width: 0;
  }
  .row-title {
    display: block;
    font-size: var(--text-base);
    font-weight: var(--weight-medium);
    color: var(--text-primary);
  }
  .row-sub {
    display: block;
    margin-top: 3px;
    font-size: var(--text-xs);
    color: var(--text-quaternary);
  }
  .row-value {
    font-family: var(--font-num);
    font-size: var(--text-lg);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
  }
  .row-label {
    font-size: var(--text-md);
    color: var(--text-tertiary);
  }
  .row-chev {
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    color: var(--text-quaternary);
  }

  /* 键值对行 —— 详情展示用 */
  .detail-row {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: var(--space-4);
    padding: 10px 0;
    border-bottom: 1px solid var(--border-subtle);
  }
  .detail-row:last-child { border-bottom: 0; }
  .detail-label {
    flex-shrink: 0;
    font-size: var(--text-md);
    color: var(--text-tertiary);
  }
  .detail-value {
    min-width: 0;
    font-size: var(--text-md);
    color: var(--text-primary);
    text-align: right;
    overflow-wrap: anywhere;
  }
  .detail-value[data-num] {
    font-weight: var(--weight-semibold);
  }

  /* ============ 提示条（说明 / 免责） ============ */
  .notice {
    display: flex;
    gap: var(--space-4);
    padding: var(--space-4);
    border-radius: var(--radius-inner);
    background: linear-gradient(135deg, var(--blue-50) 0%, var(--violet-50) 100%);
    border: 1px solid var(--blue-100);
  }
  .notice-icon {
    flex-shrink: 0;
    width: 22px;
    height: 22px;
    color: var(--color-brand);
  }
  .notice-body {
    min-width: 0;
    font-size: var(--text-sm);
    line-height: var(--leading-snug);
    color: var(--text-secondary);
  }
  .notice-title {
    display: block;
    margin-bottom: 2px;
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
  }

  /* ============ 状态统计条 ============ */
  .stat-bar {
    display: flex;
    margin: 0 var(--gutter);
    padding: 5px 0;
    background: var(--surface-card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
  }
  .stat-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
    padding: 10px 0;
    border-radius: var(--radius-inner);
    transition: background-color var(--dur-fast) var(--ease-out);
  }
  .stat-item:active { background: var(--surface-sunken); }
  .stat-num {
    font-family: var(--font-num);
    font-size: var(--text-2xl);
    font-weight: var(--weight-semibold);
    line-height: var(--leading-tight);
    color: var(--text-primary);
  }
  .stat-label {
    font-size: var(--text-xs);
    color: var(--text-quaternary);
  }
  /* 选中态：数字与标签同时染色，符合「点击即筛选」的心智 */
  .stat-item[aria-pressed='true'] .stat-num,
  .stat-item[aria-pressed='true'] .stat-label { color: var(--color-brand); }
  .stat-item[aria-pressed='true'][data-tone='warning'] .stat-num,
  .stat-item[aria-pressed='true'][data-tone='warning'] .stat-label { color: var(--tone-warning-fg); }
  .stat-item[aria-pressed='true'][data-tone='success'] .stat-num,
  .stat-item[aria-pressed='true'][data-tone='success'] .stat-label { color: var(--tone-success-fg); }
  .stat-item[aria-pressed='true'][data-tone='danger'] .stat-num,
  .stat-item[aria-pressed='true'][data-tone='danger'] .stat-label { color: var(--tone-danger-fg); }
  .stat-item[aria-pressed='true'][data-tone='orange'] .stat-num,
  .stat-item[aria-pressed='true'][data-tone='orange'] .stat-label { color: var(--tone-orange-fg); }

  /* 统计网格 —— 权益中心的 2×2 概览 */
  .stat-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-2);
  }
  .stat-card {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    padding: var(--space-4);
    background: var(--surface-card);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-card);
  }
  .stat-card-body { min-width: 0; }
  .stat-card-value {
    display: block;
    font-family: var(--font-num);
    font-size: var(--text-2xl);
    font-weight: var(--weight-semibold);
    line-height: var(--leading-tight);
    color: var(--text-primary);
  }
  .stat-card-label {
    display: block;
    margin-top: 2px;
    font-size: var(--text-xs);
    color: var(--text-quaternary);
  }

  /* ============ 工具栏（搜索 + 筛选） ============ */
  .toolbar {
    display: flex;
    align-items: center;
    gap: var(--space-3);
    margin: var(--space-4) var(--gutter) 0;
  }
  .search-box {
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    height: 38px;
    padding: 0 var(--space-4);
    background: var(--surface-card);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-inner);
  }
  .search-icon {
    flex-shrink: 0;
    width: 16px;
    height: 16px;
    margin-right: 7px;
    color: var(--text-quaternary);
  }
  .search-input {
    flex: 1;
    min-width: 0;
    border: 0;
    outline: none;
    background: transparent;
    font-size: var(--text-md);
    color: var(--text-primary);
  }
  .search-box:focus-within {
    border-color: var(--color-brand);
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
  }
  .search-clear {
    flex-shrink: 0;
    padding: 4px 0 4px var(--space-2);
    font-size: var(--text-xs);
    color: var(--color-brand);
  }

  .filter-btn {
    position: relative;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    background: var(--surface-card);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-inner);
    color: var(--text-secondary);
  }
  .filter-btn > svg { width: 18px; height: 18px; }
  .filter-btn[data-active='true'] {
    border-color: var(--color-brand);
    color: var(--color-brand);
  }
  .filter-badge {
    position: absolute;
    top: -5px;
    right: -5px;
    display: flex;
    align-items: center;
    justify-content: center;
    min-width: 15px;
    height: 15px;
    padding: 0 4px;
    border: 1px solid var(--surface-card);
    border-radius: var(--radius-pill);
    background: var(--color-brand);
    color: var(--text-on-brand);
    font-family: var(--font-num);
    font-size: var(--text-2xs);
    font-weight: var(--weight-semibold);
  }

  /* ============ 列表头（计数 + 导出） ============ */
  .list-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin: var(--space-5) 15px 0;
  }
  .list-count {
    font-size: var(--text-xs);
    color: var(--text-quaternary);
  }

  /* ============ 筛选 Chip 条 ============ */
  .chipbar {
    display: flex;
    gap: var(--space-2);
    padding: 0 var(--gutter) 0;
    overflow-x: auto;
    scrollbar-width: none;
    -webkit-overflow-scrolling: touch;
  }
  .chipbar::-webkit-scrollbar { display: none; }
  .chip {
    flex-shrink: 0;
    display: inline-flex;
    align-items: center;
    gap: var(--space-1);
    min-height: 32px;
    padding: 6px var(--space-4);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-pill);
    background: var(--surface-card);
    font-size: var(--text-sm);
    color: var(--text-tertiary);
    transition: background-color var(--dur-fast) var(--ease-out),
      color var(--dur-fast) var(--ease-out),
      border-color var(--dur-fast) var(--ease-out);
  }
  .chip[aria-pressed='true'] {
    background: var(--color-brand);
    border-color: var(--color-brand);
    color: var(--text-on-brand);
    font-weight: var(--weight-semibold);
  }
  .chip-count {
    font-family: var(--font-num);
    font-size: var(--text-2xs);
    opacity: 0.75;
  }

  /* ============ 弹层 ============ */
  .mask {
    position: fixed;
    inset: 0;
    z-index: var(--z-mask);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    background: rgba(15, 23, 42, 0.45);
    animation: mask-in var(--dur-base) var(--ease-out);
  }
  @keyframes mask-in {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  /* 遮罩居中对齐应用框，宽屏下弹层不会贴到屏幕边缘 */
  .mask-inner {
    position: relative;
    width: 100%;
    max-width: var(--app-max-w);
  }
  .mask[data-align='center'] {
    align-items: center;
    padding: var(--space-8);
  }

  .sheet {
    width: 100%;
    max-height: 82vh;
    overflow-y: auto;
    padding: var(--space-7) var(--space-6) var(--space-8);
    background: var(--surface-card);
    border-radius: var(--radius-sheet) var(--radius-sheet) 0 0;
    box-shadow: var(--shadow-sheet);
    animation: sheet-up var(--dur-slow) var(--ease-out);
    overscroll-behavior: contain;
  }
  .mask[data-align='center'] .sheet {
    border-radius: var(--radius-sheet);
    animation: modal-in var(--dur-base) var(--ease-out);
  }
  @keyframes sheet-up {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }
  @keyframes modal-in {
    from { opacity: 0; transform: scale(0.96); }
    to { opacity: 1; transform: scale(1); }
  }

  .sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-4);
    margin-bottom: var(--space-4);
  }
  .sheet-title {
    font-size: var(--text-xl);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
  }
  .sheet-close {
    padding: 8px var(--space-2);
    font-size: var(--text-md);
    color: var(--text-quaternary);
  }
  .sheet-footer {
    display: flex;
    gap: var(--space-2);
    margin-top: var(--space-7);
  }
  .sheet-footer > .btn { flex: 1; }

  /* ============ 空状态 ============ */
  .empty {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);
    padding: 40px var(--space-6);
    text-align: center;
  }
  .empty-icon {
    width: 70px;
    height: 70px;
    color: var(--slate-300);
    opacity: 0.8;
  }
  .empty-text {
    font-size: var(--text-md);
    color: var(--text-quaternary);
  }
  .empty-sub {
    font-size: var(--text-xs);
    color: var(--text-placeholder);
  }

  /* ============ 详情容器 ============ */
  .detail-box {
    margin-bottom: var(--space-6);
    padding: 4px var(--space-4);
    background: var(--surface-sunken);
    border-radius: var(--radius-inner);
  }

  /* ============ 日期 / 区间选择 ============ */
  .date-row {
    display: flex;
    align-items: center;
    gap: var(--space-2);
  }
  .date-pick {
    flex: 1;
    min-width: 0;
  }
  .date-box {
    display: block;
    width: 100%;
    min-height: var(--tap-min);
    padding: 11px var(--space-3);
    background: var(--surface-sunken);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-inner);
    font-family: var(--font-num);
    font-size: var(--text-md);
    color: var(--text-primary);
    text-align: center;
  }
  .date-box:invalid,
  .date-box[data-empty='true'] {
    color: var(--text-placeholder);
  }
  .date-sep {
    flex-shrink: 0;
    font-size: var(--text-md);
    color: var(--text-quaternary);
  }

  /* ============ 选择器选项（币种 / 账号 / 业务员） ============ */
  .option-row {
    display: flex;
    align-items: center;
    gap: var(--space-4);
    min-height: var(--tap-min);
    padding: 13px var(--space-3);
    border-radius: var(--radius-inner);
    transition: background-color var(--dur-fast) var(--ease-out);
  }
  .option-row:hover { background: var(--surface-sunken); }
  .option-row[aria-selected='true'] { background: var(--color-brand-soft); }
  .option-body {
    flex: 1;
    min-width: 0;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .option-title {
    font-size: var(--text-base);
    font-weight: var(--weight-semibold);
    color: var(--text-primary);
  }
  .option-sub {
    font-size: var(--text-xs);
    color: var(--text-quaternary);
  }
  .option-value {
    font-family: var(--font-num);
    font-size: var(--text-md);
    color: var(--text-tertiary);
  }
  .option-check {
    flex-shrink: 0;
    width: 17px;
    height: 17px;
    color: var(--color-brand);
  }

  /* ============ 分隔标题（弹层小标题） ============ */
  .group-label {
    display: block;
    margin: var(--space-5) 0 var(--space-2);
    font-size: var(--text-sm);
    font-weight: var(--weight-semibold);
    color: var(--text-secondary);
  }
  .group-label:first-child { margin-top: 0; }

  /* ============ 筛选位（左右并排） ============ */
  .filter-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--space-4);
  }

  /* ============ 金额脱敏（全站机制） ============
     页面里给金额节点加 data-amount，由 store.amountVisible 驱动
     body[data-amount-hidden] 一次性切换；模糊而非替换成 *，
     保留金额轮廓，切换时布局不会跳动。 */

  [data-amount] {
    transition: filter var(--dur-base) var(--ease-out);
  }
  body[data-amount-hidden='true'] [data-amount] {
    filter: blur(7px);
  }
  /* 小号金额（币种余额 chip 等）用更浅的模糊，避免糊成一团 */
  body[data-amount-hidden='true'] .bal-amount {
    filter: blur(5px);
  }

  /* ============ 表单行（堆叠式：标签在上，控件在下） ============
     移动端宽度有限，不做桌面那种左标签右控件；
     行间用 1px 分隔线，最后一行加 .frow--last 去掉。 */

  .frow {
    display: flex;
    flex-direction: column;
    gap: 7px;
    padding: var(--space-4) 0;
    border-bottom: 1px solid var(--border-default);
  }
  .frow:first-child { padding-top: 0; }
  .frow--last {
    border-bottom: 0;
    padding-bottom: 0;
  }
  .frow-label {
    font-size: var(--text-md);
    color: var(--text-secondary);
  }
  /* 必填星号：纯视觉提示，读屏语义由字段本身的 required/校验承担 */
  .frow-req {
    margin-right: 3px;
    color: var(--tone-danger-fg);
    font-style: normal;
  }

  /* ============ 单选胶囊组（替代原生 radio 的移动端形态） ============ */

  .radio-group {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
  }
  .radio-pill {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 8px 14px;
    border: 1px solid var(--border-default);
    border-radius: var(--radius-pill);
    background: var(--surface-card);
    font-size: var(--text-md);
    color: var(--text-secondary);
    transition: border-color var(--dur-fast) var(--ease-out),
      background-color var(--dur-fast) var(--ease-out),
      color var(--dur-fast) var(--ease-out);
  }
  .radio-pill:active { background: var(--surface-sunken); }
  .radio-pill[aria-checked='true'] {
    border-color: var(--color-brand);
    background: var(--color-brand-soft);
    color: var(--color-brand-strong);
    font-weight: var(--weight-medium);
  }
  /* 选中圆点用伪元素画，读屏不会念出多余内容 */
  .radio-pill::before {
    content: '';
    width: 14px;
    height: 14px;
    border: 1px solid var(--text-placeholder);
    border-radius: 50%;
    background: var(--surface-card);
    transition: border-color var(--dur-fast) var(--ease-out),
      box-shadow var(--dur-fast) var(--ease-out);
  }
  .radio-pill[aria-checked='true']::before {
    border-color: var(--color-brand);
    background: var(--color-brand);
    box-shadow: inset 0 0 0 3px var(--surface-card);
  }

  /* ============ 伪选择框（点开弹层选择，而非原生 select） ============ */

  .select-field {
    display: flex;
    align-items: center;
    gap: var(--space-2);
    width: 100%;
    min-height: var(--tap-min);
    padding: 0 var(--space-3);
    border: 1px solid var(--border-default);
    border-radius: var(--radius-inner);
    background: var(--surface-card);
    text-align: left;
    transition: border-color var(--dur-fast) var(--ease-out);
  }
  .select-field:active { border-color: var(--color-brand); }
  .select-value {
    flex: 1;
    min-width: 0;
    font-size: var(--text-md);
    color: var(--text-primary);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .select-value.is-placeholder { color: var(--text-placeholder); }
  .select-caret {
    flex-shrink: 0;
    width: 14px;
    height: 14px;
    color: var(--text-tertiary);
  }
  .select-hint {
    font-size: var(--text-xs);
    color: var(--text-quaternary);
  }

  /* 只读字段：系统固定值，不可修改（如开户地区固定「中国内地」）。
     刻意不给按钮语义与交互态——用户点不动它，也就不该看起来像能点。 */
  .field-static {
    display: flex;
    align-items: center;
    min-height: var(--tap-min);
    padding: 0 var(--space-3);
    border-radius: var(--radius-inner);
    background: var(--surface-sunken);
    font-size: var(--text-md);
    color: var(--text-secondary);
  }

  /* 行内文字链（去换汇 / 添加账户 …）：靠 ::after 撑到 44px 命中区 */
  .link-btn {
    position: relative;
    padding: 2px 0;
    font-size: var(--text-md);
    font-weight: var(--weight-medium);
    color: var(--color-brand);
  }

  /* ===== 样式 · styles/shell.css ===== */
  /* ============================================================
     外壳层 · 应用框 / 导航栏 / tabBar / 滚动容器 / 反馈组件
     ------------------------------------------------------------
     这是「手机壳」的模拟：桌面浏览器下居中显示 430px 应用框，
     移动端满宽。壳与页面内容解耦，页面只管 #app-body 里的东西。
     ============================================================ */

  /* ============ 应用框 ============ */
  .app {
    position: relative;
    display: flex;
    flex-direction: column;
    width: 100%;
    max-width: var(--app-max-w);
    height: 100vh;
    height: 100dvh;
    margin: 0 auto;
    overflow: hidden;
    background: var(--surface-page);
    opacity: 0;
    transition: opacity var(--dur-slow) var(--ease-out);
  }
  .app.is-ready { opacity: 1; }

  @media (min-width: 480px) {
    /* 桌面下浮起来，脱离画布底色，更像一台设备 */
    .app {
      height: min(100dvh, 900px);
      margin-top: max(0px, calc((100dvh - 900px) / 2));
      border-radius: 20px;
      box-shadow: 0 24px 60px rgba(15, 23, 42, 0.18);
    }
  }

  /* ============ 导航栏 ============ */
  .app-bar {
    position: relative;
    z-index: var(--z-navbar);
    display: flex;
    flex-shrink: 0;
    align-items: center;
    gap: var(--space-2);
    height: calc(var(--navbar-h) + var(--safe-top));
    padding: var(--safe-top) var(--space-3) 0;
    background: var(--surface-card);
    border-bottom: 1px solid var(--border-subtle);
  }
  .app-bar-title {

    min-width: 0;

    text-align: center;
    color: var(--text-primary);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .app-bar-side {
    display: flex;
    flex-shrink: 0;
    align-items: center;
    min-width: 44px;
  }
  .app-bar-side--end { justify-content: flex-end; }

  /* 返回键 */
  .app-back {
    display: flex;
    align-items: center;
    gap: 2px;
    height: var(--tap-min);
    padding: 0 var(--space-2) 0 0;
    color: var(--text-primary);
    font-size: var(--text-base);
  }

    width: 20px;
    height: 20px;
  }

  .app-body {

    overscroll-behavior-y: contain;
  }

  .page {
    padding: var(--space-6) 0 var(--space-6);
  }
  .page[hidden] { display: none; }

  /* ============ tabBar ============ */
  .tabbar {
    position: relative;
    z-index: var(--z-tabbar);
    display: flex;
    flex-shrink: 0;
    height: calc(var(--tabbar-h) + var(--safe-bottom));

    border-top: 1px solid var(--border-subtle);
  }
  .tab {

    align-items: center;

  }
  .tab[aria-selected='true'] {
    color: var(--color-brand);
    font-weight: var(--weight-semibold);
  }

  /* ============ Toast ============ */
  .toast-layer {
    position: fixed;
    inset: 0;
    z-index: var(--z-toast);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: var(--space-2);
    pointer-events: none;
  }
  .toast {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--space-2);

    padding: var(--space-4) var(--space-6);

  }
  .toast > svg {
    width: 26px;

  }
  @keyframes toast-in {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .toast.is-out {
    animation: toast-out var(--dur-base) var(--ease-out) forwards;
  }
  @keyframes toast-out {
    to { opacity: 0; transform: translateY(-4px); }
  }

  .spinner {
    width: 22px;
    height: 22px;

    from { opacity: 0; transform: translateY(6px); }

  /* 属性名是 data-nav（fwd/back），不要写成 data-back —— 那是「返回按钮」的

  .page[data-nav='back'] {
    animation: page-back var(--dur-slow) var(--ease-out);
  }
  @keyframes page-back {
    from { opacity: 0; transform: translateX(-10px); }
    to { opacity: 1; transform: translateX(0); }
  }

  /* ============ 底部安全留白 ============ */
  .page-end {
    height: var(--space-8);

  .boot {

    transition: opacity var(--dur-base) var(--ease-out);
  }
  .boot.is-off {
    opacity: 0;
    pointer-events: none;

  <script data-bundle-from="js/dom.js">
  /* ===== 脚本 · js/dom.js ===== */
  /* ============================================================
     dom.js · 极简 DOM 助手
     ------------------------------------------------------------
     不引入任何框架：只提供这个项目真正用得到的四件事 ——
     查询、事件委托、安全插值、列表渲染。
     （模板运行时 / 指令解析 / 虚拟 DOM 都不需要）
     ============================================================ */
  (function (PP) {
    'use strict'

    /** HTML 转义 —— 所有插入模板的数据都必须过这一层 */
    function esc(value) {
      if (value === null || value === undefined) return ''
      return String(value)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;')
    }

    /**
     * 带标签模板，自动转义插值。
     *   PP.html`<b>${userInput}</b>`   // 插值自动转义
     *   PP.raw(markup)                 // 需要插入可信 HTML 片段时显式声明
     */
    var RAW = {}
    function raw(markup) {
      return { [RAW]: String(markup) }
    }
    function html(strings) {
      var out = strings[0]
      for (var i = 1; i < arguments.length; i++) {
        var v = arguments[i]
        out += (v && v[RAW] !== undefined ? v[RAW] : esc(v)) + strings[i]
      }
      return { [RAW]: out }
    }

    function qs(sel, root) {
      return (root || document).querySelector(sel)
    }
    function qsa(sel, root) {
      return Array.prototype.slice.call((root || document).querySelectorAll(sel))
    }

    /**
     * 事件委托 —— 在容器上挂一次监听，处理所有后代匹配元素。
     * 好处：列表重渲染后无需重新绑定，也不会遗漏动态节点。
     * 返回解绑函数。
     */
    function on(root, type, selector, handler) {
      function listener(e) {
        var target = e.target.closest(selector)
        if (target && root.contains(target)) handler(e, target)
      }
      root.addEventListener(type, listener)
      return function off() {
        root.removeEventListener(type, listener)
      }
    }

    /** 把 HTML 字面量写入容器（唯一的 innerHTML 出口，便于审查） */
    function setHTML(el, markup) {
      if (!el) return el
      el.innerHTML = markup && markup[RAW] !== undefined ? markup[RAW] : String(markup || '')
      return el
    }

    /** 列表渲染：容器 + 数据 + 行模板函数 */
    function renderList(el, items, rowFn) {
      return setHTML(el, raw(items.map(rowFn).join('')))
    }

    function toggle(el, visible) {
      if (el) el.hidden = !visible
    }

    /** 复制到剪贴板，带降级方案（非安全上下文下 navigator.clipboard 不可用） */
    function copy(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text)
      }
      return new Promise(function (resolve, reject) {
        var ta = document.createElement('textarea')
        ta.value = text
        ta.setAttribute('readonly', '')
        ta.style.cssText = 'position:fixed;left:-9999px;opacity:0'
        document.body.appendChild(ta)
        ta.select()
        try {
          document.execCommand('copy')
          resolve()
        } catch (err) {
          reject(err)
        } finally {
          document.body.removeChild(ta)
        }
      })
    }

    /** 轻震动反馈（支持的设备上） */
    function haptic() {
      if (navigator.vibrate) navigator.vibrate(10)
    }

    PP.dom = {
      esc: esc,
      html: html,
      raw: raw,
      qs: qs,
      qsa: qsa,
      on: on,
      setHTML: setHTML,
      renderList: renderList,
      toggle: toggle,
      copy: copy,
      haptic: haptic
    }
  })((window.PP = window.PP || {}))

  /* ===== 脚本 · js/format.js ===== */
  /* ============================================================
     format.js · 数值 / 日期格式化
     ------------------------------------------------------------
     金额一律走千分位 + 固定小数位，并用等宽数字字体渲染，
     这样列表里上下相邻的金额小数点能对齐。
     ============================================================ */
  (function (PP) {
    'use strict'

    /**
     * 千分位 + 固定小数位
     *   fmtNum(1723225.51)     → '1,723,225.51'
     *   fmtNum(890, 0)         → '890'
     */
    function fmtNum(value, digits) {
      var d = typeof digits === 'number' ? digits : 2
      var parts = Number(value || 0).toFixed(d).split('.')
      parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',')
      return parts.join('.')
    }

    /** 带币种符号：withSymbol('¥', 890) → '¥ 890.00' */
    function withSymbol(symbol, value, digits) {
      return (symbol ? symbol + ' ' : '') + fmtNum(value, digits)
    }

    /** 带正负号的涨跌幅：growth(2.4) → '+2.4%' */
    function growth(value, digits) {
      var d = typeof digits === 'number' ? digits : 2
      var n = Number(value || 0)
      return (n >= 0 ? '+' : '') + n.toFixed(d) + '%'
    }

    /** 涨跌方向：'up' | 'down' | 'flat'（国内惯例：涨红跌绿） */
    function trend(value) {
      var n = Number(value || 0)
      if (n > 0) return 'up'
      if (n < 0) return 'down'
      return 'flat'
    }

    /** YYYY-MM-DD */
    function isoDate(date) {
      var d = date ? new Date(date) : new Date()
      return [
        d.getFullYear(),
        String(d.getMonth() + 1).padStart(2, '0'),
        String(d.getDate()).padStart(2, '0')
      ].join('-')
    }

    /** YYYY-MM-DD HH:mm */
    function isoDateTime(date) {
      var d = date ? new Date(date) : new Date()
      return isoDate(d) + ' ' + String(d.getHours()).padStart(2, '0') + ':' +
        String(d.getMinutes()).padStart(2, '0')
    }

    /** 手机号 / 账号脱敏：6222****1234 */
    function maskAccount(value, head, tail) {
      var s = String(value || '')
      var h = head === undefined ? 4 : head
      var t = tail === undefined ? 4 : tail
      if (s.length <= h + t) return s
      return s.slice(0, h) + '****' + s.slice(-t)
    }

    PP.format = {
      fmtNum: fmtNum,
      withSymbol: withSymbol,
      growth: growth,
      trend: trend,
      isoDate: isoDate,
      isoDateTime: isoDateTime,
      maskAccount: maskAccount
    }
  })((window.PP = window.PP || {}))

     ------------------------------------------------------------
     只放真正跨页面共享的状态。页面私有数据一律留在页面模块内部，
     避免 store 变成什么都往里塞的杂物间。
     当前仅有四类：当前用户、商户信息、未读数、金额脱敏开关。
     ============================================================ */
  (function (PP) {
    'use strict'

    var state = {
      /** 当前登录用户（演示数据，待接登录态） */
      user: {
        name: '顾人',
        role: '超级管理员'
      },
      /** 未读消息数，消息通知页「打开即已读」会清零 */
      unread: 6,
      /** 金额脱敏开关，首页眼睛图标控制；由 body[data-amount-hidden] 驱动全站 */
      amountVisible: true
    }

    var listeners = []

    function get(key) {
      return key === undefined ? state : state[key]
    }

    /** 浅合并写状态并通知订阅者 */
    function set(patch) {
      var changed = false
      Object.keys(patch).forEach(function (k) {
        if (state[k] !== patch[k]) {
          state[k] = patch[k]
          changed = true
        }
      })
      if (changed) listeners.forEach(function (fn) { fn(state) })
      return state
    }

    /** 订阅全局变化，返回退订函数（页面卸载时调用，防止内存泄漏） */
    function subscribe(fn) {
      listeners.push(fn)
      return function unsubscribe() {
        var i = listeners.indexOf(fn)
        if (i >= 0) listeners.splice(i, 1)
      }
    }

    PP.store = {
      get: get,
      set: set,
      subscribe: subscribe
    }
  })((window.PP = window.PP || {}))

  <script data-bundle-from="js/ui.js">
  /* ===== 脚本 · js/ui.js ===== */
  /* ============================================================
     ui.js · 反馈与弹层
     ------------------------------------------------------------
     把 toast / modal / sheet / picker 统一收口在此。
     页面不再各自拼遮罩与弹层骨架，保证一致的动效、遮罩与关闭行为。
     弹层支持堆叠（sheet 里再开 modal），按栈后进先出关闭。
     ============================================================ */
  (function (PP) {
    'use strict'

    var dom = PP.dom
    var layers = [] // 弹层栈，栈顶响应 Esc

    /* ---------------------------------------------------- Toast */

    var toastTimer = null

    /**
     * 轻提示
     *   toast('已复制')                  → 纯文字
     *   toast('提交成功', {icon:'success'})
     *   toast('处理中', {icon:'loading', duration:0})  → 常驻，需手动 hide
     */
    function toast(message, opts) {
      var o = opts || {}
      var layer = dom.qs('#toast-layer')
      if (!layer) return { hide: function () {} }

      if (toastTimer) {
        clearTimeout(toastTimer)
        toastTimer = null
      }
      dom.setHTML(layer, '')
      layer.style.display = 'flex'

      var icon = ''
      if (o.icon === 'success') {
        icon = '<svg aria-hidden="true"><use href="#i-check-circle"/></svg>'
      } else if (o.icon === 'loading') {
        icon = '<div class="spinner" role="status"></div>'
      }

      var node = document.createElement('div')
      node.className = 'toast'
      node.setAttribute('role', o.icon === 'loading' ? 'status' : 'alert')
      dom.setHTML(node, dom.raw(icon + '<span>' + dom.esc(message) + '</span>'))
      layer.appendChild(node)

      var duration = o.duration === undefined ? 1800 : o.duration
      if (duration > 0) {
        toastTimer = setTimeout(function () { hideToast(node) }, duration)
      }

      function hideToast(target) {
        var el = target || node
        if (!el || !el.parentNode) return
        el.classList.add('is-out')
        setTimeout(function () {
          if (el.parentNode) el.parentNode.removeChild(el)
          if (!layer.children.length) layer.style.display = 'none'
        }, 200)
      }

      return { hide: hideToast }
    }

    /* ---------------------------------------------------- 弹层基座 */

    /**
     * 打开一个弹层。
     *   title    标题（可选）
     *   body     弹层内容，接受 PP.html 字面量或 HTML 字符串
     *   align    'bottom'（默认，动作面板样式）| 'center'（对话框样式）
     *   footer   底部按钮区 HTML
     *   onMount  内容挂载后回调，参数 (root, api)，用于绑定事件
     *   onClose  关闭后回调
     * 返回 { close, root }
     */
    function openSheet(opts) {
      var o = opts || {}
      var layerRoot = dom.qs('#layer-root')

      var mask = document.createElement('div')
      mask.className = 'mask'
      mask.setAttribute('data-align', o.align === 'center' ? 'center' : 'bottom')

      var inner = document.createElement('div')
      inner.className = 'mask-inner'
      mask.appendChild(inner)

      var sheet = document.createElement('div')
      sheet.className = 'sheet'
      sheet.setAttribute('role', 'dialog')
      sheet.setAttribute('aria-modal', 'true')
      if (o.title) sheet.setAttribute('aria-label', o.title)
      inner.appendChild(sheet)

      var head = ''
      if (o.title) {
        head =
          '<div class="sheet-head">' +
          '<h2 class="sheet-title">' + dom.esc(o.title) + '</h2>' +
          '<button type="button" class="sheet-close" data-close>关闭</button>' +
          '</div>'
      }
      dom.setHTML(sheet, dom.raw(head + (o.body || '') + (o.footer || '')))

      var closed = false
      function close(result) {
        if (closed) return
        closed = true
        var i = layers.indexOf(entry)
        if (i >= 0) layers.splice(i, 1)
        mask.remove()
        document.removeEventListener('keydown', onKey)
        if (o.onClose) o.onClose(result)
      }

      function onKey(e) {
        if (e.key === 'Escape' && layers[layers.length - 1] === entry) {
          e.preventDefault()
          close()
        }
      }

      mask.addEventListener('click', function (e) {
        if (e.target === mask || e.target.closest('[data-close]')) close()
      })
      document.addEventListener('keydown', onKey)

      layerRoot.appendChild(mask)

      var entry = {
        close: close,
        root: sheet,
        set: function (markup) { dom.setHTML(sheet, markup) }
      }
      layers.push(entry)

      if (o.onMount) o.onMount(sheet, entry)

      var focusTarget = sheet.querySelector('[autofocus], input, button')
      if (focusTarget) focusTarget.focus({ preventScroll: true })

    }

    /* ---------------------------------------------------- 确认框 */

    /**
     * 确认对话框（替代 wx.showModal）
     * 返回 Promise<boolean> —— 确认 true / 取消 false
     */
    function confirmDialog(opts) {
      var o = typeof opts === 'string' ? { content: opts } : (opts || {})
      return new Promise(function (resolve) {
        var settled = false
        function done(v) {
          if (settled) return
          settled = true
          resolve(v)
        }
        var footer =
          '<div class="sheet-footer">' +
          (o.showCancel === false ? '' :
            '<button type="button" class="btn btn--ghost" data-cancel>' +
            dom.esc(o.cancelText || '取消') + '</button>') +
          '<button type="button" class="btn btn--primary" data-ok>' +
          dom.esc(o.confirmText || '确定') + '</button>' +
          '</div>'

        var api = openSheet({
          title: o.title || '',
          align: 'center',
          body: '<p class="muted" style="font-size:var(--text-base);line-height:var(--leading-normal)">' +
            dom.esc(o.content || '') + '</p>',
          footer: footer,
          onMount: function (root, sheet) {
            root.addEventListener('click', function (e) {
              if (e.target.closest('[data-ok]')) { done(true); sheet.close() }
              if (e.target.closest('[data-cancel]')) { done(false); sheet.close() }
            })
          },
          onClose: function () { done(false) }
        })
        return api
      })
    }

    /* ---------------------------------------------------- 选择器 */

    /**
     * 单选列表弹层（替代 picker mode=selector）
     *   options: [{ value, title, sub, valueText }]
     * 返回 Promise<value|null>
     */
    function picker(opts) {
      var o = opts || {}
      var options = o.options || []
      return new Promise(function (resolve) {
        var settled = false
        function done(v) {
          if (settled) return
          settled = true
          resolve(v)
        }

        var body = '<div class="stack-2">' + options.map(function (item) {
          var selected = String(item.value) === String(o.value)
          return (
            '<div class="option-row" role="option" data-value="' + dom.esc(item.value) + '"' +
            ' aria-selected="' + (selected ? 'true' : 'false') + '">' +
            '<div class="option-body">' +
            '<span class="option-title">' + dom.esc(item.title) + '</span>' +
            (item.sub ? '<span class="option-sub">' + dom.esc(item.sub) + '</span>' : '') +
            '</div>' +
            (item.valueText ? '<span class="option-value">' + dom.esc(item.valueText) + '</span>' : '') +
            (selected ? '<svg class="option-check" aria-hidden="true"><use href="#i-check"/></svg>' : '') +
            '</div>'
          )
        }).join('') + '</div>'

        var sheet = openSheet({
          title: o.title || '请选择',
          body: body,
          onMount: function (root) {
            root.addEventListener('click', function (e) {
              var row = e.target.closest('.option-row')
              if (!row) return
              done(row.getAttribute('data-value'))
              sheet.close()
            })
          },
          onClose: function () { done(null) }
        })
      })
    }

    /**
     * 带搜索的单选弹层（账户、银行这类需要检索的长列表）
     *   items: [{ value, title, sub }]，检索范围是 title + sub
     *   value 当前值 / placeholder 搜索框占位 / emptyText 无结果文案
     * 返回 Promise<value|null>
     */
    function searchPicker(opts) {
      var o = opts || {}
      var items = o.items || []
      return new Promise(function (resolve) {
        var settled = false
        function done(v) {
          if (settled) return
          settled = true
          resolve(v)
        }

        function rowHTML(item) {
          var active = String(item.value) === String(o.value)
          return (
            '<button type="button" class="picker-item' + (active ? ' is-active' : '') + '"' +
            ' data-value="' + dom.esc(item.value) + '"' +
            ' aria-pressed="' + (active ? 'true' : 'false') + '">' +
            '<span class="picker-body">' +
            '<span class="picker-title">' + dom.esc(item.title) + '</span>' +
            (item.sub ? '<span class="picker-sub">' + dom.esc(item.sub) + '</span>' : '') +
            '</span>' +
            '<svg class="picker-check" aria-hidden="true"><use href="#i-check"/></svg>' +
            '</button>'
          )
        }

        var body =
          '<div class="picker-search-wrap">' +
          '<input class="field-input picker-search" id="picker-search" type="search" autofocus' +
          ' autocomplete="off" placeholder="' + dom.esc(o.placeholder || '搜索') + '">' +
          '</div>' +
          '<div class="picker-list" id="picker-list"></div>'

        var sheet = openSheet({
          title: o.title || '请选择',
          body: body,
          onMount: function (root) {
            var search = dom.qs('#picker-search', root)
            var list = dom.qs('#picker-list', root)

            function render() {
              var kw = (search.value || '').trim().toLowerCase()
              var rows = items.filter(function (it) {
                return !kw || (it.title + ' ' + (it.sub || '')).toLowerCase().indexOf(kw) >= 0
              })
              list.innerHTML = rows.length
                ? rows.map(rowHTML).join('')
                : '<p class="picker-empty">' + dom.esc(o.emptyText || '没有匹配的结果') + '</p>'
            }

            dom.on(root, 'input', '#picker-search', render)
            dom.on(root, 'click', '.picker-item', function (e, el) {
              done(el.getAttribute('data-value'))
              sheet.close()
            })
            render()
          },
          onClose: function () { done(null) }
        })
      })
    }

    /** 动作面板：options 为 [{ label, tone }]，返回被选项的 index 或 null */
    function actionSheet(opts) {
      var o = opts || {}
      var options = o.options || []
      return new Promise(function (resolve) {
        var settled = false
        function done(v) {
          if (settled) return
          settled = true
          resolve(v)
        }
        var body = '<div class="stack-2">' + options.map(function (item, i) {
          return '<button type="button" class="btn btn--block ' +
            (item.tone === 'danger' ? 'btn--soft' : 'btn--ghost') +
            '" data-index="' + i + '"' +
            (item.tone === 'danger' ? ' style="color:var(--color-danger)"' : '') + '>' +
            dom.esc(item.label) + '</button>'
        }).join('') + '</div>' +
          '<div class="sheet-footer"><button type="button" class="btn btn--ghost" data-close>取消</button></div>'

        var sheet = openSheet({
          title: o.title || '',
          body: body,
          onMount: function (root) {
            root.addEventListener('click', function (e) {
              var btn = e.target.closest('[data-index]')
              if (!btn) return
              done(Number(btn.getAttribute('data-index')))
              sheet.close()
            })
          },
          onClose: function () { done(null) }
        })
      })
    }

    /* ---------------------------------------------------- 分页 */

    /** 页码序列：≤7 页全列，否则首末两页 + 当前页邻域，中间用省略号占位 */
    function pageSeq(page, pages) {
      var nums = []
      if (pages <= 7) {
        for (var i = 1; i <= pages; i++) nums.push(i)
        return nums
      }
      var candidates = [1, page - 1, page, page + 1, pages]
      candidates.forEach(function (n) {
        if (n >= 1 && n <= pages && nums.indexOf(n) < 0) nums.push(n)
      })
      nums.sort(function (a, b) { return a - b })

      var out = []
      nums.forEach(function (n, i) {
        if (i > 0 && n - nums[i - 1] > 1) out.push('...')
        out.push(n)
      })
      return out
    }

    function pagerNavBtn(kind, label, disabled) {
      // 两个方向分开写整串：图标引用要能被 tools/verify.py 静态扫到
      var chevron = kind === 'prev'
        ? '<use href="#i-chevron-left"/>'
        : '<use href="#i-chevron-right"/>'
      return (
        '<button type="button" class="pager-btn pager-nav" data-pg="' + kind + '"' +
        (disabled ? ' disabled' : '') + ' aria-label="' + label + '">' +
        '<svg aria-hidden="true">' + chevron + '</svg>' +
        '</button>'
      )
    }

    /**
     * 分页控件（客户端分页：列表数据已在内存，翻页只是换一段切片）
     *   el        挂载容器；每次调用重写其内容
     *   total     筛选后的总条数
     *   page      当前页（1 起，越界自动收敛到 [1, pages]）
     *   pageSize  每页条数
     *   label     容器 aria-label（如「收款记录分页」）
     *   onGo(n)   翻页回调

     * 返回 { page, pages, total } —— 调用方用它同步自己保存的页码，
     * 免得筛选后只剩一页、页码却还停在第 2 页上。
     * 总页数 ≤ 1 时清空容器并加 hidden，单页列表不出现多余的翻页控件。
     *
     * 点击用容器级 onclick 覆盖绑定：列表每次重渲染都会重调本函数，
     * 覆盖式赋值天然不会累积监听（用 addEventListener 会）。
     */
    function pager(opts) {
      var o = opts || {}
      var el = o.el
      var total = Math.max(0, Number(o.total) || 0)
      var pageSize = Math.max(1, Number(o.pageSize) || 10)
      var pages = Math.max(1, Math.ceil(total / pageSize))
      var page = Math.min(Math.max(1, Number(o.page) || 1), pages)
      var result = { page: page, pages: pages, total: total }

      if (!el) return result

      el.setAttribute('role', 'navigation')
      el.setAttribute('aria-label', o.label || '分页')

      if (pages <= 1) {
        dom.setHTML(el, '')
        el.hidden = true
        el.onclick = null
        return result
      }
      el.hidden = false

      var start = (page - 1) * pageSize + 1
      var end = Math.min(total, page * pageSize)

      dom.setHTML(el, dom.raw(
        '<div class="pager-nav">' +
          pagerNavBtn('prev', '上一页', page <= 1) +
          pageSeq(page, pages).map(function (n) {
            if (n === '...') return '<span class="pager-gap" aria-hidden="true">…</span>'
            return (
              '<button type="button" class="pager-btn" data-pg="' + n + '"' +
              (n === page ? ' aria-current="page"' : '') +
              ' aria-label="第 ' + n + ' 页">' + n + '</button>'
            )
          }).join('') +
          pagerNavBtn('next', '下一页', page >= pages) +
        '</div>' +
        '<p class="pager-info">第 ' + start + '–' + end + ' 条 / 共 ' + total + ' 条</p>'
      ))

      el.onclick = function (e) {
        var btn = e.target.closest('[data-pg]')
        if (!btn || !el.contains(btn) || btn.disabled) return
        var v = btn.getAttribute('data-pg')
        var next = v === 'prev' ? page - 1 : v === 'next' ? page + 1 : Number(v)
        if (!(next >= 1) || next > pages || next === page) return
        if (o.onGo) o.onGo(next)
      }

      return result
    }

    PP.ui = {
      toast: toast,
      sheet: openSheet,
      confirm: confirmDialog,
      picker: picker,
      searchPicker: searchPicker,
      actions: actionSheet,
      pager: pager
    }
  })((window.PP = window.PP || {}))

  <script data-bundle-from="js/chart.js">
  /* ===== 脚本 · js/chart.js ===== */
  /* ============================================================
     chart.js · 汇率走势图（原生 Canvas）
     ------------------------------------------------------------
     替代 echarts-for-weixin / ECharts。只需要一条平滑折线 + 渐变面积
     + 虚线网格 + 当前价标注，用 Canvas 手绘比引入 400KB 的图表库划算得多。
     视觉规格与原 ECharts option 保持一致：
       折线 #2563eb / 2px、面积渐变 0.18→0.01、
       网格 #f1f5f9 虚线、当前价标注 #f59e0b 虚线 + 4 位小数
     ============================================================ */
  (function (PP) {
    'use strict'

    var HOUR = 3600 * 1000
    var DAY = 24 * HOUR

    /** 币对基准价（对齐 Web 版 exchange.html 的 7.2345 量级） */
    var BASE_RATES = {
      'USD/CNH': 7.2214,
      'EUR/CNH': 7.8602,
      'GBP/CNH': 9.1743
    }

    var RANGES = {
      '24H': { points: 24, unit: HOUR, volatility: 0.006, labelInterval: 3 },
      '7D': { points: 7, unit: DAY, volatility: 0.012, labelInterval: 0 },
      '30D': { points: 30, unit: DAY, volatility: 0.02, labelInterval: 5 }
    }

    function pad2(n) {
      return n < 10 ? '0' + n : '' + n
    }

    /** 确定性伪随机（固定种子）—— 保证每次进入页面走势一致，不会「每次刷新都变」 */
    function seededRandom(seed) {
      var s = seed
      return function () {
        s = (s * 9301 + 49297) % 233280
        return s / 233280
      }
    }

    /**
     * 生成走势数据
     * @returns {{dates:string[], rates:number[], currentRate:number, change:string, changeValue:number, up:boolean}}
     */
    function buildRateSeries(pair, range) {
      var conf = RANGES[range] || RANGES['7D']
      var base = BASE_RATES[pair] || 7.2214
      var rand = seededRandom(20260401 + conf.points * 7 + Math.round(base * 100))
      var dates = []
      var rates = []
      var now = new Date()
      var rate = base - conf.volatility * 2

      for (var i = conf.points - 1; i >= 0; i--) {
        var d = new Date(now.getTime() - i * conf.unit)
        dates.push(range === '24H'
          ? pad2(d.getHours()) + ':00'
          : (d.getMonth() + 1) + '/' + d.getDate())
        rate += (rand() - 0.48) * conf.volatility
        rate = Math.max(base * 0.97, Math.min(base * 1.03, rate))
        rates.push(Math.round(rate * 10000) / 10000)
      }

      var currentRate = rates[rates.length - 1]
      var first = rates[0]
      var pct = ((currentRate - first) / first) * 100
      return {
        dates: dates,
        rates: rates,
        currentRate: currentRate,
        changeValue: pct,
        change: (pct >= 0 ? '+' : '') + pct.toFixed(2) + '%',
        up: pct >= 0
      }
    }

    var PADDING = { left: 34, right: 44, top: 14, bottom: 20 }

    /**
     * 走势图控制器
     * 生命周期：new RateChart(canvas) → render(series) →（容器尺寸变化时）resize()
     */
    function RateChart(canvas) {
      this.canvas = canvas
      this.ctx = canvas.getContext('2d')
      this.series = null
      this.off = null // ResizeObserver 解绑
    }

    RateChart.prototype.render = function (series) {
      this.series = series
      this.paint()
      if (!this.off && window.ResizeObserver) {
        var self = this
        var ro = new ResizeObserver(function () { self.paint() })
        ro.observe(this.canvas)
        this.off = function () { ro.disconnect() }
      }
    }

    RateChart.prototype.destroy = function () {
      if (this.off) this.off()
      this.off = null
      this.series = null
    }

    RateChart.prototype.paint = function () {
      var s = this.series
      if (!s || !s.rates.length) return

      var canvas = this.canvas
      var ctx = this.ctx
      var dpr = window.devicePixelRatio || 1

      // 尺寸取父容器实测值，避免 canvas 撑大布局
      var w = Math.max(canvas.parentNode.clientWidth, 40)
      var h = Math.max(canvas.parentNode.clientHeight, 40)
      if (canvas.width !== Math.round(w * dpr) || canvas.height !== Math.round(h * dpr)) {
        canvas.width = Math.round(w * dpr)
        canvas.height = Math.round(h * dpr)
        canvas.style.width = w + 'px'
        canvas.style.height = h + 'px'
      }
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      ctx.clearRect(0, 0, w, h)

      var plotW = w - PADDING.left - PADDING.right
      var plotH = h - PADDING.top - PADDING.bottom
      if (plotW <= 10 || plotH <= 10) return

      var rates = s.rates
      var min = Math.min.apply(null, rates)
      var max = Math.max.apply(null, rates)
      if (max === min) {
        max += 0.001
        min -= 0.001
      }
      // 上下各留 8% 余量，曲线不贴边
      var span = max - min
      min -= span * 0.08
      max += span * 0.08

      function x(i) {
        return PADDING.left + (rates.length === 1 ? plotW / 2 : (plotW * i) / (rates.length - 1))
      }
      function y(v) {
        return PADDING.top + plotH - ((v - min) / (max - min)) * plotH
      }

      ctx.font = '10px ' + getComputedStyle(document.body).getPropertyValue('--font-num')

      /* ---- 横向网格（3 条，虚线） ---- */
      ctx.save()
      ctx.strokeStyle = '#f1f5f9'
      ctx.lineWidth = 1
      ctx.setLineDash([3, 3])
      var split = 3
      for (var g = 0; g <= split; g++) {
        var gy = PADDING.top + (plotH * g) / split
        ctx.beginPath()
        ctx.moveTo(PADDING.left, gy)
        ctx.lineTo(PADDING.left + plotW, gy)
        ctx.stroke()
      }
      ctx.restore()

      /* ---- y 轴刻度：窄区间用 3 位小数，避免出现 7.21/7.21/7.20 重复标签 ---- */
      var decimals = (max - min) < 0.1 ? 3 : 2
      ctx.save()
      ctx.fillStyle = '#94a3b8'
      ctx.textAlign = 'right'
      ctx.textBaseline = 'middle'
      for (var t = 0; t <= split; t++) {
        var v = max - ((max - min) * t) / split
        ctx.fillText(v.toFixed(decimals), PADDING.left - 6, PADDING.top + (plotH * t) / split)
      }
      ctx.restore()

      /* ---- x 轴标签 ---- */
      var conf = null
      for (var k in RANGES) {
        if (RANGES[k].points === rates.length) conf = RANGES[k]
      }
      var interval = conf ? conf.labelInterval : Math.ceil(rates.length / 6)
      ctx.save()
      ctx.fillStyle = '#94a3b8'
      ctx.textAlign = 'center'
      ctx.textBaseline = 'top'
      for (var i2 = 0; i2 < s.dates.length; i2++) {
        if (i2 % (interval + 1) !== 0 && i2 !== s.dates.length - 1) continue
        ctx.fillText(s.dates[i2], x(i2), PADDING.top + plotH + 5)
      }
      ctx.restore()

      /* ---- 面积（品牌蓝渐变） ---- */
      var grad = ctx.createLinearGradient(0, PADDING.top, 0, PADDING.top + plotH)
      grad.addColorStop(0, 'rgba(37,99,235,0.18)')
      grad.addColorStop(1, 'rgba(37,99,235,0.01)')

      var pts = rates.map(function (v, i) { return { x: x(i), y: y(v) } })

      ctx.beginPath()
      ctx.moveTo(pts[0].x, pts[0].y)
      strokeSmooth(ctx, pts, false)
      ctx.lineTo(pts[pts.length - 1].x, PADDING.top + plotH)
      ctx.lineTo(pts[0].x, PADDING.top + plotH)
      ctx.closePath()
      ctx.fillStyle = grad
      ctx.fill()

      /* ---- 折线 ---- */
      ctx.beginPath()
      ctx.lineWidth = 2
      ctx.strokeStyle = '#2563eb'
      ctx.lineJoin = 'round'
      ctx.lineCap = 'round'
      ctx.moveTo(pts[0].x, pts[0].y)
      strokeSmooth(ctx, pts, true)
      ctx.stroke()

      /* ---- 当前价标注（琥珀色虚线 + 4 位小数） ---- */
      var cy = y(s.currentRate)
      ctx.save()
      ctx.strokeStyle = '#f59e0b'
      ctx.lineWidth = 1
      ctx.setLineDash([4, 4])
      ctx.beginPath()
      ctx.moveTo(PADDING.left, cy)
      ctx.lineTo(PADDING.left + plotW, cy)
      ctx.stroke()
      ctx.restore()

      ctx.save()
      ctx.fillStyle = '#d97706'
      ctx.font = 'bold 10px ' + getComputedStyle(document.body).getPropertyValue('--font-num')
      ctx.textAlign = 'left'
      ctx.textBaseline = 'middle'
      ctx.fillText(s.currentRate.toFixed(4), PADDING.left + plotW + 3, cy)
      ctx.restore()
    }

    /**
     * 用 Catmull-Rom 转三次贝塞尔画平滑曲线。
     * 直接连线会有折角，ECharts 的 smooth 就是这个效果。
     * includeFirst=false 时假定当前点已在路径起点上。
     */
    function strokeSmooth(ctx, pts, includeFirst) {
      if (pts.length < 3) {
        for (var i = 1; i < pts.length; i++) ctx.lineTo(pts[i].x, pts[i].y)
        return
      }
      var tension = 0.22
      for (var j = 0; j < pts.length - 1; j++) {
        var p0 = pts[j - 1] || pts[j]
        var p1 = pts[j]
        var p2 = pts[j + 1]
        var p3 = pts[j + 2] || p2
        var c1x = p1.x + (p2.x - p0.x) * tension
        var c1y = p1.y + (p2.y - p0.y) * tension
        var c2x = p2.x - (p3.x - p1.x) * tension
        var c2y = p2.y - (p3.y - p1.y) * tension
        ctx.bezierCurveTo(c1x, c1y, c2x, c2y, p2.x, p2.y)
      }
    }

    PP.chart = {
      BASE_RATES: BASE_RATES,
      RANGES: RANGES,
      buildRateSeries: buildRateSeries,
      RateChart: RateChart
    }
  })((window.PP = window.PP || {}))

  <script data-bundle-from="js/router.js">
  /* ===== 脚本 · js/router.js ===== */
  /* ============================================================
     router.js · hash 路由 + 页面栈
     ------------------------------------------------------------
     与小程序导航语义对齐但更简单：
       - tab 页：切换即重置栈（对应 switchTab），tabBar 常驻
       - 二级页：入栈（对应 navigateTo），导航栏出现返回键
       - 返回：出栈（对应 navigateBack），回到上一页并恢复其滚动位置

     页面片段加载：
       打包产物里片段已内联为 <template id="frag-xxx">，直接取用；
       开发态没有 template 时回退 fetch('pages/xxx.html')。
     ============================================================ */
  (function (PP) {
    'use strict'

    var dom = PP.dom

    /** 片段基址，由入口页设置（开发态 src/ 下为 ''，打包产物为 null 表示不 fetch） */
    PP.fragBase = ''

    var stack = []        // 页面实例栈：[{ name, el, mod, scrollTop }]
    var cache = {}        // 片段 HTML 缓存
    var current = null
    var listeners = []

    function bodyEl() { return dom.qs('#app-body') }

    /* ---------------------------------------------- 片段加载 */

    function loadFragment(name) {
      if (cache[name]) return Promise.resolve(cache[name])

      var tpl = document.getElementById('frag-' + name)
      if (tpl) {
        cache[name] = tpl.innerHTML
        return Promise.resolve(cache[name])
      }

      if (PP.fragBase === null) {
        return Promise.reject(new Error('片段未内联，且已禁用 fetch：' + name))
      }

      return fetch(PP.fragBase + 'pages/' + name + '.html')
        .then(function (res) {
          if (!res.ok) throw new Error('HTTP ' + res.status + ' · pages/' + name + '.html')
          return res.text()
        })
        .then(function (text) {
          cache[name] = text
          return text
        })
    }

    /* ---------------------------------------------- 页面生命周期 */

    function instantiate(name) {
      var route = PP.routeOf(name)
      var mod = PP.pages[name]
      if (!mod) throw new Error('页面未注册：' + name)

      var el = document.createElement('div')
      el.className = 'page'
      el.setAttribute('data-page', name)
      el.hidden = true

      var cleanups = []
      var ctx = {
        name: name,
        route: route,
        go: function (target, params) { return navigate(target, params) },
        back: back,
        setTitle: function (t) { if (isTop()) setBarTitle(t) },
        /** 注册清理函数：页面出栈时统一执行，避免遗留监听与定时器 */
        onCleanup: function (fn) { cleanups.push(fn) }
      }

      bodyEl().appendChild(el)

      return loadFragment(name).then(function (markup) {
        dom.setHTML(el, dom.raw(markup))
        if (mod.mount) mod.mount(el, ctx)
        return {
          name: name,
          el: el,
          mod: mod,
          ctx: ctx,
          scrollTop: 0,
          cleanup: function () {
            cleanups.forEach(function (fn) {
              try { fn() } catch (e) { console.warn('[page cleanup]', name, e) }
            })
            cleanups.length = 0
            if (mod.unmount) mod.unmount(el)
          }
        }
      })
    }

    function isTop() {
      return stack.length > 0 && stack[stack.length - 1].name === current
    }

    /* ---------------------------------------------- 导航栏与 tabBar */

    function setBarTitle(title) {
      dom.qs('#bar-title').textContent = title
      document.title = title + ' · PPTransfer H5'
    }

    function syncChrome(route) {
      var backSlot = dom.qs('#bar-start')
      var isRoot = !!route.tab
      dom.setHTML(backSlot, isRoot ? '' : dom.raw(
        '<button type="button" class="app-back" id="bar-back" aria-label="返回上一页">' +
        '<svg aria-hidden="true"><use href="#i-chevron-left"/></svg>' +
        '</button>'
      ))
      if (!isRoot) {
        var btn = dom.qs('#bar-back')
        if (btn) btn.addEventListener('click', back)
      }

      var tabbar = dom.qs('#tabbar')
      dom.qsa('.tab', tabbar).forEach(function (tab) {
        var on = tab.getAttribute('data-name') === route.name
        tab.setAttribute('aria-selected', on ? 'true' : 'false')
      })
      tabbar.hidden = !isRoot
    }

    /* ---------------------------------------------- 显示 / 隐藏 */

    function show(inst, isBack) {
      if (current) {
        if (stack.length) stack[stack.length - 1].scrollTop = bodyEl().scrollTop
        var prev = stack[stack.length - 1]
        if (prev && prev.el && prev.name !== inst.name) prev.el.hidden = true
      }
      // 上一页可能已不在栈中（tab 切换），统一隐藏所有非当前页
      dom.qsa('.page', bodyEl()).forEach(function (p) {
        if (p !== inst.el) p.hidden = true
      })

      inst.el.hidden = false
      // 进场动画方向。注意不要叫 data-back —— 那是 app.js 全局委托里
      // 「返回上一页按钮」的声明式属性，若与页面根元素同名属性撞车，
      // 二级页上任何一次点击都会冒泡命中 .page[data-back]，整页变成点哪都返回
      inst.el.setAttribute('data-nav', isBack ? 'back' : 'fwd')
      current = inst.name

      // 重放进场动画
      inst.el.style.animation = 'none'
      void inst.el.offsetHeight
      inst.el.style.animation = ''

      bodyEl().scrollTop = inst.scrollTop || 0
      setBarTitle(inst.ctx.route.title)
      syncChrome(inst.ctx.route)

      if (inst.mod.show) inst.mod.show(inst.el)
      listeners.forEach(function (fn) { fn(inst.name, isBack) })
    }

    function teardown(inst) {
      if (inst.mod.hide) inst.mod.hide(inst.el)
      inst.cleanup()
      if (inst.el.parentNode) inst.el.parentNode.removeChild(inst.el)
    }

    /* ---------------------------------------------- 导航 */

    /** 切换到 tab 页：清空栈，页面常驻
     *  params 为可选的进入意图（如 { view: 'fund' } 直达收款页的在途视图）：
     *  页面可实现可选的 onParams(el, params) 钩子来响应，钩子在 show 之前调用，
     *  视图先切好再亮相，避免先闪默认视图。 */
    function switchTab(name, params) {
      var route = PP.routeOf(name)
      if (!route || !route.tab) return Promise.reject(new Error('不是 tab 页：' + name))

      var existing = null
      for (var i = 0; i < stack.length; i++) {
        if (stack[i].name === name) existing = stack[i]
      }
      // 清掉除目标外的所有页面
      stack.slice().forEach(function (inst) {
        if (inst.name !== name) teardown(inst)
      })
      stack = stack.filter(function (inst) { return inst.name === name })

      function reveal(inst) {
        if (params && inst.mod.onParams) inst.mod.onParams(inst.el, params)
        if (stack.indexOf(inst) < 0) stack.push(inst)
        inst.scrollTop = inst.scrollTop || 0
        show(inst, false)
        writeHash(name)
      }

      if (existing) {
        reveal(existing)
        return Promise.resolve(existing)
      }
      return instantiate(name).then(reveal)
    }

    /** 进入二级页：入栈 */
    function navigate(name, params) {
      var route = PP.routeOf(name)
      if (!route) return Promise.reject(new Error('路由不存在：' + name))
      if (route.tab) return switchTab(name, params)

      var top = stack[stack.length - 1]
      if (top && top.name === name) return Promise.resolve(top) // 防重复进入
      if (top) top.scrollTop = bodyEl().scrollTop

      return instantiate(name).then(function (inst) {
        inst.params = params || {}
        stack.push(inst)
        inst.scrollTop = 0
        show(inst, false)
        writeHash(name)
        return inst
      })
    }

    function back() {
      if (stack.length <= 1) return
      var inst = stack.pop()
      teardown(inst)
      var prev = stack[stack.length - 1]
      show(prev, true)
      writeHash(prev.name)
    }

    var writingHash = false
    function writeHash(name) {
      var next = '#/' + name
      if (location.hash === next) return
      writingHash = true
      location.hash = next
      // hashchange 是异步的，下一帧再解除标记
      setTimeout(function () { writingHash = false }, 0)
    }

    /* ---------------------------------------------- hash 同步 */

    window.addEventListener('hashchange', function () {
      if (writingHash) return
      var name = (location.hash || '').replace(/^#\/?/, '')
      if (!name || name === current) return
      var route = PP.routeOf(name)
      if (!route) { writeHash(current); return }

      if (route.tab) {
        switchTab(name)
        return
      }
      // 浏览器前进/后退：若目标已在栈中则回退到它，否则入栈
      var idx = -1
      for (var i = 0; i < stack.length; i++) {
        if (stack[i].name === name) idx = i
      }
      if (idx >= 0) {
        while (stack.length - 1 > idx) teardown(stack.pop())
        show(stack[stack.length - 1], true)
      } else {
        navigate(name)
      }
    })

    /* ---------------------------------------------- 启动 */

    function start(defaultTab) {
      var entry = (location.hash || '').replace(/^#\/?/, '')
      var route = entry ? PP.routeOf(entry) : null

      if (route && route.tab) return switchTab(route.name)

      // 二级页直达：先铺一个 tab 页在栈底，返回才有落点
      return switchTab(defaultTab || PP.TAB_ROUTES[0].name).then(function () {
        if (route) return navigate(route.name)
      })
    }

    PP.router = {
      start: start,
      go: navigate,
      switchTab: switchTab,
      back: back,
      current: function () { return current },
      stack: function () { return stack.slice() },
      /** 订阅页面切换事件 */
      onChange: function (fn) { listeners.push(fn) }
    }
  })((window.PP = window.PP || {}))
  </script>
